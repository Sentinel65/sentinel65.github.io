<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Duke – Hra proti AI</title>
<style>
:root {
  --bg: #1a1a2e;
  --board-bg: #0d0d12;
  --cell-bg: #2a3234;
  --cell-light: #3a4446;
  --accent: #00b894;
  --danger: #d63031;
  --text: #f5f6fa;
  --player: #e6b800;
  --ai: #e84393;
  --cell: min(14.5vw, 58px);
  --gap: 3px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow-x: hidden; overflow-y: auto; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
body { display: flex; flex-direction: column; align-items: center; padding: 6px 4px 24px; min-height: 100%; }
header {
  width: 100%; max-width: calc(6 * var(--cell) + 7 * var(--gap) + 8px);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
h1 {
  font-size: clamp(1.05rem, 4vw, 1.35rem); font-weight: 700; color: var(--accent);
  cursor: default; user-select: none; letter-spacing: .02em;
  padding: 2px 8px; border-radius: 6px;
}
h1.coords-on { outline: 1px dashed #00b89455; }
.menu {
  display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; width: 100%;
}
.btn {
  width: 40px; height: 40px; border: none; border-radius: 10px;
  background: #2d3436; color: #00b894; font-size: 1.25rem;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background .15s, transform .1s;
  box-shadow: 0 2px 6px rgba(0,0,0,.4);
}
.btn:active { transform: scale(.92); }
.btn:hover { background: #3d4446; }
.btn.lang { font-size: .8rem; font-weight: 700; width: auto; padding: 0 10px; color: #00b894; }
.btn.active { background: var(--accent) !important; color: #111 !important; }

.status-row {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; max-width: calc(6 * var(--cell) + 7 * var(--gap) + 8px);
  gap: 8px; padding: 2px 0 4px;
}
.bag {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 9px; border-radius: 10px; flex-shrink: 0;
  background: #2d3436; box-shadow: 0 2px 5px rgba(0,0,0,.35);
  font-size: .88rem; font-weight: 600; user-select: none;
}
.bag.player { border: 2px solid var(--player); color: #dfe6e9; cursor: pointer; }
.bag.player:hover { background: #4a4020; }
.bag.player:active { transform: scale(.97); }
.bag.ai { border: 2px solid var(--ai); color: #dfe6e9; }
.bag .icon { font-size: 1.2rem; }
.bag.disabled { opacity: .4; pointer-events: none; }
.status {
  flex: 1; text-align: center; font-size: .82rem; color: #b2bec3;
  min-height: 1.4em; line-height: 1.35;
}

#board {
  display: grid;
  grid-template-columns: repeat(6, var(--cell));
  grid-template-rows: repeat(6, var(--cell));
  gap: var(--gap);
  background: var(--board-bg);
  padding: var(--gap);
  border-radius: 8px;
  box-shadow: 0 4px 24px rgba(0,0,0,.55);
  touch-action: manipulation;
}
.cell {
  width: var(--cell); height: var(--cell);
  background: var(--cell-bg);
  border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  position: relative; user-select: none; transition: background .12s; overflow: hidden;
}
.cell.light { background: var(--cell-light); }
.cell.highlight { background: #00b89455 !important; box-shadow: inset 0 0 0 2px var(--accent); }
.cell.capture-empty { background: #00b89433 !important; box-shadow: inset 0 0 0 2px var(--accent); }
.cell.selected { box-shadow: inset 0 0 0 3px #ffeaa7, 0 0 0 2px #fdcb6e; z-index: 2; background: #fdcb6e33 !important; }
.cell.setup-ok { background: #00b89433 !important; box-shadow: inset 0 0 0 2px var(--accent); }
.cell.cap-gone { box-shadow: inset 0 0 0 3px #e74c3c !important; background: #e74c3c22 !important; }
.tile.last-move-tile {
  border-color: #6c5ce7 !important;
  box-shadow: 0 0 0 2px #6c5ce7, 0 2px 8px rgba(108,92,231,.55) !important;
}
.tile.capture-target {
  border-color: #00b894 !important;
  box-shadow: 0 0 0 2px #00b894, 0 2px 8px rgba(0,184,148,.45) !important;
}
.coord {
  position: absolute; bottom: 1px; right: 2px;
  font-size: calc(var(--cell) * 0.16); color: #888; opacity: .7;
  pointer-events: none; font-weight: 600; z-index: 1;
}
.tile {
  width: 96%; height: 96%; border-radius: 4px; position: relative; overflow: hidden;
  box-shadow: 0 2px 5px rgba(0,0,0,.45);
}
.tile img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
.tile.player {
  background: #f5e68c; /* světle žlutá */
  border: 2px solid var(--player);
  box-shadow: 0 0 0 1px #f0d060, 0 2px 6px rgba(0,0,0,.5);
}
.tile.ai {
  background: #f5b8c8; /* světle růžová */
  border: 2px solid var(--ai);
  box-shadow: 0 0 0 1px #fd79a8, 0 2px 6px rgba(0,0,0,.5);
  transform: rotate(180deg);
}
.duke-crown {
  position: absolute;
  bottom: 3px;
  right: 4px;
  font-size: calc(var(--cell) * 0.24);
  color: #d4a017;
  text-shadow: 0 0 2px #000, 0 0 1px #000;
  z-index: 5;
  pointer-events: none;
  line-height: 1;
}
/* AI Duke: from player's viewpoint = top-left corner of the tile */
.duke-crown.ai-crown {
  top: 3px;
  left: 4px;
  bottom: auto;
  right: auto;
}

/* Toast */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: #2d3436; color: var(--text); padding: 12px 20px; border-radius: 12px;
  box-shadow: 0 6px 24px rgba(0,0,0,.5); font-size: .9rem; font-weight: 500;
  z-index: 200; opacity: 0; transition: transform .3s, opacity .3s;
  max-width: 90vw; text-align: center; border: 1px solid #444;
  pointer-events: none;
}
#toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
#toast.ok { border-color: var(--accent); }
#toast.err { border-color: var(--danger); }

.modal {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.78);
  z-index: 100; align-items: center; justify-content: center; padding: 12px;
}
.modal.show { display: flex; }
.modal-content {
  background: #2d3436; border-radius: 12px; max-width: 440px; width: 100%;
  max-height: 80vh; overflow: hidden; display: flex; flex-direction: column;
  box-shadow: 0 8px 32px rgba(0,0,0,.6);
}
.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 14px; border-bottom: 1px solid #444;
}
.modal-header h2 { color: var(--accent); font-size: 1.1rem; margin: 0; }
.modal-header .hdr-btns { display: flex; gap: 6px; }
.modal-body {
  padding: 12px 14px; overflow-y: auto; flex: 1;
  font-size: .85rem; line-height: 1.5; white-space: pre-wrap; font-family: ui-monospace, monospace;
}
.modal-body.help-mode {
  white-space: normal; font-family: system-ui, sans-serif;
}
.log-sq {
  display: inline-block; width: 0.85em; height: 0.85em;
  border-radius: 2px; vertical-align: -0.05em; margin-right: 0.15em;
}
.log-sq.p { background: #e6b800; }
.log-sq.a { background: #e84393; }
.modal .close, .modal .copy-btn {
  width: 36px; height: 36px; border: none; border-radius: 8px;
  background: #444; color: #fff; font-size: 1.1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.modal .close { background: var(--accent); color: #111; width: auto; padding: 8px 16px; font-weight: 700; margin: 10px 14px; align-self: stretch; }
.ai-thinking { color: #fd79a8; animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .45; } }

@media (min-width: 700px) {
  :root { --cell: 72px; --gap: 4px; }
  body { padding-top: 12px; }
}
@media (min-width: 900px) {
  :root { --cell: 84px; }
}
@media (max-width: 380px) {
  :root { --cell: 14.5vw; }
  .btn { width: 36px; height: 36px; font-size: 1.05rem; }
  .status { font-size: .75rem; }
}
@media (max-width: 480px) {
  :root { --cell: min(15.5vw, 64px); }
}

/* Replay player */
#replayBar {
  display: none;
  width: 100%; max-width: calc(6 * var(--cell) + 7 * var(--gap) + 8px);
  margin-top: 10px;
  padding: 10px 8px;
  background: #2d3436;
  border-radius: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,.4);
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
#replayBar.show { display: flex; }
.replay-controls {
  display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap;
}
.replay-controls .btn {
  width: 42px; height: 42px; font-size: 1.1rem;
}
.replay-controls .btn.active { background: var(--accent); color: #111; }
#replayInfo {
  font-size: .8rem; color: #b2bec3; text-align: center;
}
body.replay-mode #board { opacity: .92; }
body.replay-mode .bag.player { pointer-events: none; opacity: .45; }


.help-wrap { font-family: system-ui, sans-serif; white-space: normal; }
.help-wrap h3 {
  color: var(--accent); font-size: .95rem; margin: 14px 0 8px; padding-bottom: 4px;
  border-bottom: 1px solid #444;
}
.help-wrap h3:first-child { margin-top: 0; }
.help-cred { font-size: .78rem; color: #888; margin: -4px 0 12px; }
.help-wrap .c-purple { color: #6c5ce7; font-weight: 700; }
.help-wrap .c-green { color: #00b894; font-weight: 700; }
.help-wrap .c-red { color: #e74c3c; font-weight: 700; }
.help-wrap p { margin: 0 0 8px; line-height: 1.45; color: #dfe6e9; }
.help-wrap .legend {
  display: flex; flex-direction: column; gap: 8px; margin: 8px 0 12px;
}
.help-wrap .leg-row {
  display: flex; gap: 10px; align-items: flex-start;
  background: #1a1a2e; border-radius: 8px; padding: 8px 10px;
  border-left: 3px solid var(--accent);
}
.help-wrap .leg-sym {
  flex-shrink: 0; width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  background: #f5e68c; color: #111; border-radius: 6px;
  font-weight: 700; font-size: 1rem;
}
.help-wrap .leg-txt { font-size: .82rem; line-height: 1.4; color: #dfe6e9; }
.help-wrap .leg-txt b { color: var(--accent); }
.help-wrap ul.rules { margin: 0 0 8px 18px; padding: 0; }
.help-wrap ul.rules li { margin-bottom: 6px; line-height: 1.4; color: #dfe6e9; font-size: .85rem; }


/* Tile zoom overlay (mobile) */
#tileZoom {
  display: none; position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,.72);
  align-items: center; justify-content: center;
  padding: 16px;
}
#tileZoom.show { display: flex; }
#tileZoom .zoom-card {
  background: #2d3436; border-radius: 12px; padding: 12px;
  box-shadow: 0 12px 40px rgba(0,0,0,.6);
  max-width: 92vw; text-align: center;
}
#tileZoom .zoom-tile {
  width: min(36vw, 140px); height: min(36vw, 140px);
  border-radius: 12px; margin: 0 auto 12px;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; position: relative;
}
#tileZoom .zoom-tile img {
  width: 100%; height: 100%; object-fit: contain; display: block;
  image-rendering: -webkit-optimize-contrast;
  image-rendering: crisp-edges;
}
#tileZoom .zoom-tile.player { background: #f5e68c; border: 3px solid var(--player); }
#tileZoom .zoom-tile.ai { background: #f5b8c8; border: 3px solid var(--ai); }
#tileZoom .zoom-tile.ai img { transform: rotate(180deg); }
#tileZoom .zoom-name { font-size: 1.05rem; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
#tileZoom .zoom-hint { font-size: .78rem; color: #888; }

</style>
</head>
<body>
<header>
  <h1 id="titleBtn" title="Klikni pro souřadnice">The Duke</h1>
  <div class="menu">
    <button class="btn" id="btnSave" title="Uložit">⇩</button>
    <button class="btn" id="btnLoad" title="Načíst">⇧</button>
    <button class="btn" id="btnRestart" title="Restart">↻</button>
    <button class="btn" id="btnLog" title="Log">☰</button>
    <button class="btn lang" id="btnLang">EN</button>
    <button class="btn" id="btnReplay" title="Přehrávač">▷</button>
    <button class="btn" id="btnHelp" title="Nápověda">?</button>
  </div>
</header>

<div class="status-row">
  <div class="bag player" id="bagPlayer" title="Levy">
    <span class="icon">🎒</span>
    <span id="bagP">0</span>
  </div>
  <div class="status" id="status">Načítám…</div>
  <div class="bag ai" id="bagAI">
    <span class="icon">🎒</span>
    <span id="bagA">0</span>
  </div>
</div>

<div id="board"></div>

<div id="replayBar">
  <div class="replay-controls">
    <button class="btn" id="rpFirst" title="Začátek">⏮</button>
    <button class="btn" id="rpPrev" title="Zpět">⏪</button>
    <button class="btn" id="rpPlay" title="Přehrát">▶</button>
    <button class="btn" id="rpNext" title="Vpřed">⏩</button>
    <button class="btn" id="rpLast" title="Konec">⏭</button>
  </div>
  <div id="replayInfo">0 / 0</div>
</div>

<div id="toast"></div>
<div id="tileZoom">
  <div class="zoom-card">
    <div class="zoom-tile" id="zoomTile"><img id="zoomImg" alt=""></div>
    <div class="zoom-name" id="zoomName"></div>
    <div class="zoom-hint" id="zoomHint"></div>
  </div>
</div>

<div class="modal" id="helpModal">
  <div class="modal-content">
    <div class="modal-header"><h2 id="helpTitle">Nápověda</h2></div>
    <div class="modal-body" id="helpBody"></div>
    <button class="close" id="helpClose">OK</button>
  </div>
</div>

<div class="modal" id="logModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="logTitle">Log</h2>
      <div class="hdr-btns">
        <button class="copy-btn" id="btnCopyLog" title="Kopírovat">📋</button>
        <button class="copy-btn" id="logCloseX" title="Zavřít">✕</button>
      </div>
    </div>
    <div class="modal-body" id="logBody"></div>
    <button class="close" id="logClose">OK</button>
  </div>
</div>

    help:`<div class="help-wrap">
<p class="help-cred"><i>© 2013 Designer and rules: Jeremy Holcomb, Stephen McLaughlin</i></p>
<h3>Intro</h3>
<p>The Duke je abstraktní desková hra zasazená do středověku. Cílem hry je zajmout hlavní kámen soupeře, <b>Vévodu</b>.</p>
<p>Každý hrací kámen má dvě strany, útočnou a obrannou, a po svém pohybu se automaticky otočí na druhou stranu. Hra je velmi variabilní.</p>

<ul class="rules">
<li>Umísti svého <b>Vévodu</b> na základní řadu a jeho <b>2 pěšáky</b> podle nabízených polí (kámen se musí dotýkat Vévody <b>stranou</b>, ne rohem).</li>
<li>Hráči se každou hru v zahájení <b>střídají</b>.</li>
</ul>
<h3>Varianta tahu</h3>
<ul class="rules">
<li><b>1) Pohyb kamene</b> – klikni na kámen a posuň ho na jedno z nabízených polí. Na konci tahu se kámen <b>otočí</b>.</li>
<li><b>2) 🎒</b> – kliknutím na svůj pytel dostaneš kámen, který polož na nabízené pole vedle Vévody (kámen se musí dotýkat Vévody <b>stranou</b>, ne rohem).</li>
</ul>

<div class="leg-row"><div class="leg-sym">★</div><div class="leg-txt"><b>Strike</b> – útok na pole; kámen <b>zůstává stát</b>, soupeř zmizí, útočník se otočí.</div></div>

    help:`<div class="help-wrap">
<p class="help-cred"><i>© 2013 Designer and rules: Jeremy Holcomb, Stephen McLaughlin</i></p>
<h3>Intro</h3>
<p>The Duke is an abstract board game set in the Middle Ages. The goal is to capture the opponent's main tile, the <b>Duke</b>.</p>
<p>Every tile has two sides — attack and defense — and after each move it automatically flips to the other side. The game is highly variable.</p>
<h3>Setup</h3>
<ul class="rules">
<li>Place your <b>Duke</b> on the home row and his <b>2 Footmen</b>  based on the available fields (tiles must touch the Duke by a <b>side</b>, not only a corner).</li>
<li>Players <b>alternate</b> who starts each game.</li>
</ul>
<h3>Turn options</h3>
<ul class="rules">
<li><b>1) Move a tile</b> – tap a tile and move it to one of the highlighted squares. At the end of the move the tile <b>flips</b>.</li>
<li><b>2) 🎒</b> – tap your bag and place a tile next to the Duke (must touch by a <b>side</b>, not only a corner).</li>
</ul>
<h3>Movement symbols</h3>
<div class="legend">
<div class="leg-row"><div class="leg-sym">●</div><div class="leg-txt"><b>Move</b> – step to a square (path clear if farther than 1). May capture.</div></div>
<div class="leg-row"><div class="leg-sym">○</div><div class="leg-txt"><b>Jump</b> – jump to a square (over pieces). May capture.</div></div>
<div class="leg-row"><div class="leg-sym">★</div><div class="leg-txt"><b>Strike</b> – attack a square; tile <b>stays</b>, enemy is removed, attacker flips.</div></div>
<div class="leg-row"><div class="leg-sym">→</div><div class="leg-txt"><b>Slide</b> – any number of empty squares; may capture a blocker.</div></div>
<div class="leg-row"><div class="leg-sym">↠</div><div class="leg-txt"><b>Jump-Slide</b> – like slide but starts from the 2nd square.</div></div>
</div>
<h3>Controls</h3>
<ul class="rules">
<li>Click the title <b>The Duke</b> – show / hide coordinates.</li>
<li><b>▷</b> move replay from the log (play is locked while active).</li>
<li><span class="c-purple">Purple</span> border = last move square.</li>
<li><span class="c-green">Green</span> border = legal move square.</li>
<li><span class="c-red">Red</span> border = captured piece square (Strike).</li>
</ul>
<h3>Tile zoom</h3>
<ul class="rules">
<li><b>Double-click</b> (or double-tap) a tile to show an enlarged view of its move pattern.</li>
<li>Works during replay too. Close by tapping anywhere outside.</li>
</ul>
</div>`,
    logTitle:"Move log",
    sysSetup:"Players place starting tiles",
    sysStart:"Game starts",
    sysWinP:"Player wins",
    sysWinA:"AI wins",
    saved:"Game saved",
    loaded:"Game loaded",
    noSave:"No save found",
    copied:"Log copied",
    noLevy:"No empty square next to Duke",
    restartQ:"Restart game?"
  }
};

let lang="cs", board, bags, turn, selected, legalMoves, gameOver, pieceId, showCoords=false;
let phase, setupPieces, setupPlaced, logLines, firstPlayer, logSeq=0;
let lastMoveCells = []; // orange on mover tile(s)
let lastCaptureCell = null; // red empty square after Strike
let history = []; // snapshots for replay: {board, bags, turn, gameOver, lastMoveCells, note}
let replayMode = false;
let replayIdx = 0;
let replayTimer = null;
let liveSnapshot = null;

const DIR={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0],UR:[1,-1],UL:[-1,-1],DR:[1,1],DL:[-1,1]};

function parseDest(str){const steps=[];let i=0;while(i<str.length){if(i+1<str.length&&DIR[str.substr(i,2)]){steps.push(str.substr(i,2));i+=2;}else if(DIR[str[i]]){steps.push(str[i]);i+=1;}else i++;}return steps;}
function transformDir(d,owner){if(owner==="P")return d;const flip={U:"D",D:"U",L:"L",R:"R",UR:"DR",UL:"DL",DR:"UR",DL:"UL"};return flip[d]||d;}
function applySteps(x,y,steps,owner){let cx=x,cy=y;for(const s of steps){const[dx,dy]=DIR[transformDir(s,owner)];cx+=dx;cy+=dy;}return[cx,cy];}
function inBounds(x,y){return x>=0&&x<6&&y>=0&&y<6;}
function getPiece(x,y){return board[y]&&board[y][x];}
function isEmpty(x,y){return inBounds(x,y)&&!board[y][x];}
function isEnemy(x,y,o){const p=getPiece(x,y);return p&&p.owner!==o;}
function isFriendly(x,y,o){const p=getPiece(x,y);return p&&p.owner===o;}
function clearPath(x1,y1,x2,y2){const dx=Math.sign(x2-x1),dy=Math.sign(y2-y1);if(dx===0&&dy===0)return true;let cx=x1+dx,cy=y1+dy;while(cx!==x2||cy!==y2){if(!inBounds(cx,cy)||getPiece(cx,cy))return false;cx+=dx;cy+=dy;}return true;}
function sq(x,y){return String.fromCharCode(97+x)+(6-y);}

function generateMovesFor(x,y){
  const p=getPiece(x,y);if(!p)return[];
  const data=PIECES[p.type];if(!data)return[];
  let targets=(p.side===0?data.start:data.other)||[];
  if(data.command&&p.side===1)targets=targets.concat(data.command);
  const moves=[],owner=p.owner;
  for(const[destStr,movType] of targets){
    const steps=parseDest(destStr);if(!steps.length)continue;
    if(movType==="Slide"||movType==="JumpSlide"){
      const[tx,ty]=applySteps(x,y,steps,owner);const dx=Math.sign(tx-x),dy=Math.sign(ty-y);if(dx===0&&dy===0)continue;
      const startDist=movType==="JumpSlide"?2:1;
      for(let dist=startDist;dist<=6;dist++){const nx=x+dx*dist,ny=y+dy*dist;if(!inBounds(nx,ny))break;if(isFriendly(nx,ny,owner))break;
        moves.push({x:nx,y:ny,type:movType,fromX:x,fromY:y,capture:isEnemy(nx,ny,owner)});if(getPiece(nx,ny))break;}
    }else if(movType==="Move"){
      const[nx,ny]=applySteps(x,y,steps,owner);if(!inBounds(nx,ny)||isFriendly(nx,ny,owner))continue;
      if(Math.abs(nx-x)+Math.abs(ny-y)>1&&!clearPath(x,y,nx,ny))continue;
      moves.push({x:nx,y:ny,type:"Move",fromX:x,fromY:y,capture:isEnemy(nx,ny,owner)});
    }else if(movType==="Jump"){
      const[nx,ny]=applySteps(x,y,steps,owner);if(!inBounds(nx,ny)||isFriendly(nx,ny,owner))continue;
      moves.push({x:nx,y:ny,type:"Jump",fromX:x,fromY:y,capture:isEnemy(nx,ny,owner)});
    }else if(movType==="Strike"){
      const[nx,ny]=applySteps(x,y,steps,owner);if(!inBounds(nx,ny)||!isEnemy(nx,ny,owner))continue;
      moves.push({x:nx,y:ny,type:"Strike",fromX:x,fromY:y,capture:true,stay:true});
    }
  }
  return moves;
}

function getAllLegalMoves(owner){
  const res=[];
  for(let y=0;y<6;y++)for(let x=0;x<6;x++){
    const p=board[y][x];
    if(p&&p.owner===owner) res.push(...generateMovesFor(x,y));
  }
  if(bags[owner].length){
    let dukeX,dukeY;
    for(let y=0;y<6;y++)for(let x=0;x<6;x++){const p=board[y][x];if(p&&p.type==="Duke"&&p.owner===owner){dukeX=x;dukeY=y;}}
    if(dukeX!==undefined){
      for(const[dx,dy]of[[0,1],[0,-1],[1,0],[-1,0]]){
        const nx=dukeX+dx,ny=dukeY+dy;
        if(isEmpty(nx,ny)) res.push({type:"Levy",x:nx,y:ny,fromX:dukeX,fromY:dukeY});
      }
    }
  }
  return res;
}
function createPiece(type,owner,side=0){return{type,owner,side,id:pieceId++};}

/* ===== LOG ===== */
function nextLogN(){ logSeq++; return logSeq; }
function addLogSys(key){ logLines.unshift({n:nextLogN(), k:"sys", key:key}); if(logLines.length>200) logLines.pop(); }
function addLogPlace(owner, type, x, y){ logLines.unshift({n:nextLogN(), k:"place", o:owner, type, x, y}); if(logLines.length>200) logLines.pop(); }
function addLogMove(owner, type, fx, fy, tx, ty, capType, stay){
  logLines.unshift({n:nextLogN(), k:"move", o:owner, type, fx, fy, tx, ty, cap:capType||null, stay:!!stay});
  if(logLines.length>200) logLines.pop();
}
function addLogLevy(owner, type, x, y, left){ logLines.unshift({n:nextLogN(), k:"levy", o:owner, type, x, y, left}); if(logLines.length>200) logLines.pop(); }

function logSq(owner){
  return '<span class="log-sq ' + (owner==="P"?"p":"a") + '"></span>';
}
function formatLogLine(e, plain){
  const num = (e.n!=null ? String(e.n).padStart(2,"0")+". " : "");
  const cP = plain ? "■" : logSq("P");
  const cA = plain ? "■" : logSq("A");
  const c = (o) => o==="P" ? cP : cA;
  if(e.k==="sys"){ const st = e.key ? (NAMES[lang][e.key]||e.key) : (e.t||""); return num + (plain?"ℹ️  ":"ℹ️  ") + st; }
  if(e.k==="place") return num + c(e.o) + " " + (NAMES[lang][e.type]||e.type) + " → " + sq(e.x,e.y);
  if(e.k==="levy") return num + c(e.o) + " # " + (NAMES[lang][e.type]||e.type) + " → " + sq(e.x,e.y) + " #" + e.left;
  if(e.k==="move"){
    const name = NAMES[lang][e.type]||e.type;
    const opp = e.o==="P" ? cA : cP;
    if(e.stay && e.cap){
      return num + c(e.o) + " " + name + " " + sq(e.fx,e.fy) + ":" + sq(e.fx,e.fy) + "x" + sq(e.tx,e.ty) + " " + opp + " " + (NAMES[lang][e.cap]||e.cap);
    }
    if(e.cap) return num + c(e.o) + " " + name + " " + sq(e.fx,e.fy) + "x" + sq(e.tx,e.ty) + " " + opp + " " + (NAMES[lang][e.cap]||e.cap);
    return num + c(e.o) + " " + name + " " + sq(e.fx,e.fy) + ":" + sq(e.tx,e.ty);
  }
  return "";
}

function toast(msg, kind){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "show" + (kind ? " " + kind : "");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ el.className = ""; }, 2800);
}

/* ===== SETUP ===== */
function getHomeRow(owner){return owner==="P"?5:0;}
function getSecondRow(owner){return owner==="P"?4:1;}
function isValidSetupSquare(x,y,owner){
  const home=getHomeRow(owner), second=getSecondRow(owner);
  if(y!==home && y!==second) return false;
  if(setupPlaced.length===0) return y===home;
  const adj=[[0,1],[0,-1],[1,0],[-1,0]];
  let touches=false;
  for(const pl of setupPlaced) for(const[dx,dy] of adj) if(pl.x+dx===x && pl.y+dy===y) touches=true;
  if(!touches) return false;
  const onSecond = setupPlaced.filter(p=>p.y===second).length + (y===second?1:0);
  if(onSecond>1) return false;
  return true;
}
function getSetupLegal(){
  const owner = phase==="setupP" ? "P" : "A";
  const cells=[];
  for(let y=0;y<6;y++) for(let x=0;x<6;x++) if(isEmpty(x,y)&&isValidSetupSquare(x,y,owner)) cells.push({x,y});
  return cells;
}

function startSetup(){
  board = Array(6).fill(null).map(()=>Array(6).fill(null));
  pieceId=0; logLines=[]; logSeq=0; gameOver=null; selected=null; legalMoves=[];
  lastMoveCells=[]; lastCaptureCell=null; history=[]; stopReplay(); replayMode=false; replayIdx=0;
  document.getElementById("replayBar").classList.remove("show");
  document.body.classList.remove("replay-mode");
  document.getElementById("btnReplay").classList.remove("active");

  setupPlaced=[]; setupPieces=["Duke","Footman","Footman"];
  const bagList=["Footman","Pikeman","Pikeman","Pikeman","Knight","Wizard","Ranger","Seer","General","Priest","Champion","Marshall","Bowman","Dragoon","Assassin","LongBowman"];
  bags={P:bagList.slice().sort(()=>Math.random()-0.5), A:bagList.slice().sort(()=>Math.random()-0.5)};

  const last = localStorage.getItem("dukeFirst") || "A";
  firstPlayer = last==="P" ? "A" : "P";
  localStorage.setItem("dukeFirst", firstPlayer);

  addLogSys("sysSetup");
  phase = firstPlayer==="P" ? "setupP" : "setupA";
  turn = firstPlayer;
  lastMoveCells=[]; lastCaptureCell=null;
  pushHistory("setup-start");
  if(firstPlayer==="P"){
    setStatus(NAMES[lang].status.place + NAMES[lang][setupPieces[0]]);
  } else {
    setStatus(NAMES[lang].status.setupA);
    setTimeout(aiSetup, 400);
  }
  render();
}

function afterOneSidePlaced(){
  if(phase==="setupP"){
    if(firstPlayer==="P"){
      phase="setupA"; setupPlaced=[]; setupPieces=["Duke","Footman","Footman"];
      setStatus(NAMES[lang].status.setupA); render();
      setTimeout(aiSetup, 450);
    } else beginPlay();
  } else if(phase==="setupA"){
    if(firstPlayer==="A"){
      phase="setupP"; setupPlaced=[]; setupPieces=["Duke","Footman","Footman"];
      setStatus(NAMES[lang].status.place + NAMES[lang][setupPieces[0]]); render();
    } else beginPlay();
  }
}

function beginPlay(){
  phase="play"; turn=firstPlayer; selected=null; legalMoves=[];
  addLogSys("sysStart");
  lastMoveCells=[]; lastCaptureCell=null;
  pushHistory("start");
  if(turn==="A"){ setStatus(NAMES[lang].status.ai, "ai-thinking"); setTimeout(aiMove, 350); }
  else setStatus(NAMES[lang].status.your);
  render();
}

function placeSetupPiece(x,y){
  if(!setupPieces.length) return;
  const type=setupPieces.shift();
  const owner = phase==="setupP" ? "P" : "A";
  board[y][x]=createPiece(type, owner, 0);
  setupPlaced.push({x,y,type});
  addLogPlace(owner, type, x, y);
  lastMoveCells=[{x,y}];
  lastCaptureCell=null;
  pushHistory("setup");
  if(!setupPieces.length) afterOneSidePlaced();
  else { setStatus(NAMES[lang].status.place + NAMES[lang][setupPieces[0]]); render(); }
}

function aiSetup(){
  const candidates=[
    [{x:2,y:0,t:"Duke"},{x:1,y:0,t:"Footman"},{x:3,y:0,t:"Footman"}],
    [{x:3,y:0,t:"Duke"},{x:2,y:0,t:"Footman"},{x:4,y:0,t:"Footman"}],
    [{x:2,y:0,t:"Duke"},{x:2,y:1,t:"Footman"},{x:3,y:0,t:"Footman"}],
    [{x:3,y:0,t:"Duke"},{x:3,y:1,t:"Footman"},{x:2,y:0,t:"Footman"}]
  ];
  let chosen=candidates[Math.floor(Math.random()*candidates.length)];
  for(const c of chosen){ if(!isEmpty(c.x,c.y)){ chosen=candidates[0]; break; } }
  let i=0;
  function placeNext(){
    if(i>=chosen.length){ afterOneSidePlaced(); return; }
    const c=chosen[i++];
    board[c.y][c.x]=createPiece(c.t,"A",0);
    addLogPlace("A", c.t, c.x, c.y);
    lastMoveCells=[{x:c.x,y:c.y}];
    lastCaptureCell=null;
    pushHistory("setup-AI");
    render();
    setTimeout(placeNext, 320);
  }
  placeNext();
}

/* ===== RENDER ===== */

function cloneBoardState(){
  return {
    board: board.map(r => r.map(c => c ? {...c} : null)),
    bags: {P: bags.P.slice(), A: bags.A.slice()},
    turn, gameOver, pieceId,
    lastMoveCells: lastMoveCells.map(c => ({...c})),
    lastCaptureCell: lastCaptureCell ? {...lastCaptureCell} : null,
    phase
  };
}
function pushHistory(note){
  const logEntry = logLines.length ? logLines[0] : null;
  history.push({
    ...cloneBoardState(),
    note: note||"",
    logN: logEntry ? logEntry.n : null,
    logEntry: logEntry ? {...logEntry} : null
  });
}
function restoreHistory(i){
  if(i<0 || i>=history.length) return;
  const h = history[i];
  board = h.board.map(r => r.map(c => c ? {...c} : null));
  bags = {P: h.bags.P.slice(), A: h.bags.A.slice()};
  turn = h.turn; gameOver = h.gameOver; pieceId = h.pieceId;
  phase = h.phase || phase;
  lastMoveCells = (h.lastMoveCells||[]).map(c=>({...c}));
  lastCaptureCell = h.lastCaptureCell ? {...h.lastCaptureCell} : null;
  selected=null; legalMoves=[];
  replayIdx = i;
  render();
  updateReplayInfo();
}

function render(){
  const el=document.getElementById("board"); el.innerHTML="";
  const setupLegal = phase==="setupP" ? getSetupLegal() : [];
  for(let y=0;y<6;y++) for(let x=0;x<6;x++){
    const cell=document.createElement("div");
    cell.className="cell"+((x+y)%2?" light":"");
    cell.dataset.x=x; cell.dataset.y=y;
    if(showCoords){ const c=document.createElement("span"); c.className="coord"; c.textContent=sq(x,y); cell.appendChild(c); }
    const p=board[y][x];
    if(p){
      const t=document.createElement("div");
      let tcls = "tile "+(p.owner==="P"?"player":"ai");
      if(lastMoveCells.some(c=>c.x===x&&c.y===y)) tcls += " last-move-tile";
      const lmCap = legalMoves.find(m=>m.x===x&&m.y===y&&(m.capture||m.type==="Strike"));
      if(lmCap) tcls += " capture-target";
      t.className = tcls;
      const img=document.createElement("img");
      const srcs=IMG[p.type];
      img.src=srcs?srcs[p.side]:"";
      img.alt=NAMES[lang][p.type]||p.type;
      img.onerror=()=>{img.style.display="none"; t.textContent=NAMES[lang][p.type]||p.type;};
      t.appendChild(img);
      cell.appendChild(t);
      if(p.type==="Duke"){
        const crown=document.createElement("span");
        crown.className="duke-crown" + (p.owner==="A" ? " ai-crown" : "");
        crown.textContent="♛";
        cell.appendChild(crown);
      }
    }
    if(selected&&selected.x===x&&selected.y===y) cell.classList.add("selected");
    const lm=legalMoves.find(m=>m.x===x&&m.y===y);
    if(lm){
      if(lm.capture||lm.type==="Strike"){
        if(!p) cell.classList.add("capture-empty");
        // capture on occupied square: green on tile (handled above)
      } else cell.classList.add("highlight");
    }
    if(lastCaptureCell && lastCaptureCell.x===x && lastCaptureCell.y===y && !p)
      cell.classList.add("cap-gone");
    if(phase==="setupP"&&setupLegal.some(s=>s.x===x&&s.y===y)) cell.classList.add("setup-ok");
    // single click = move/select (delayed); double-tap = zoom (works in replay too)
    let tapTimer=null;
    cell.addEventListener("click", e=>{
      if(tapTimer){
        clearTimeout(tapTimer);
        tapTimer=null;
        e.preventDefault();
        e.stopPropagation();
        showTileZoom(x,y);
        return;
      }
      tapTimer=setTimeout(()=>{
        tapTimer=null;
        if(!replayMode) onCellClick(x,y);
      }, 280);
    });
    el.appendChild(cell);
  }
  document.getElementById("bagP").textContent=bags.P.length;
  document.getElementById("bagA").textContent=bags.A.length;
  const playerActive = (phase==="setupP") || (phase==="play" && turn==="P" && !gameOver);
  document.getElementById("bagPlayer").classList.toggle("disabled", !playerActive || (phase==="play" && !bags.P.length));
  document.getElementById("bagAI").classList.toggle("disabled", !(phase==="setupA" || (phase==="play" && turn==="A" && !gameOver)));
}

function setStatus(msg, cls=""){
  const s=document.getElementById("status");
  s.textContent=msg; s.className="status "+cls;
}

/* ===== INTERACTION ===== */
function onCellClick(x,y){
  if(replayMode) return;
  if(gameOver) return;
  if(phase==="setupP"){ if(isEmpty(x,y)&&isValidSetupSquare(x,y,"P")) placeSetupPiece(x,y); return; }
  if(phase!=="play" || turn!=="P") return;

  if(selected==="levy"){
    const m=legalMoves.find(m=>m.x===x&&m.y===y&&m.type==="Levy");
    if(m){
      doLevy("P",x,y);
      lastMoveCells = [{x:x,y:y}];
      lastCaptureCell = null;
      const left=bags.P.length;
      addLogLevy("P", board[y][x].type, x, y, left);
      pushHistory("P-levy");
      endTurn();
    }
    return;
  }
  if(selected&&selected.x===x&&selected.y===y){ selected=null; legalMoves=[]; render(); return; }
  const p=getPiece(x,y);
  if(p && p.owner==="P"){
    selected={x,y};
    legalMoves = generateMovesFor(x,y);
    // selecting a piece clears the red "captured empty" marker
    lastCaptureCell = null;
    render(); return;
  }
  if(selected){
    const m=legalMoves.find(m=>m.x===x&&m.y===y);
    if(m){
      const fx=selected.x, fy=selected.y;
      const fromP=getPiece(fx,fy);
      if(!fromP){ selected=null; legalMoves=[]; render(); return; }
      const capType = m.capture && getPiece(m.x,m.y) ? getPiece(m.x,m.y).type : null;
      doMove(fx, fy, m);
      if(m.stay){
        lastMoveCells = [{x:fx,y:fy}];
        lastCaptureCell = m.capture ? {x:m.x,y:m.y} : null;
      } else {
        lastMoveCells = [{x:fx,y:fy},{x:m.x,y:m.y}];
        lastCaptureCell = null;
      }
      addLogMove("P", fromP.type, fx, fy, m.x, m.y, capType, m.stay);
      selected=null; legalMoves=[];
      pushHistory("P");
      if(!board.flat().some(t=>t&&t.type==="Duke"&&t.owner==="A")){
        gameOver="P"; setStatus(NAMES[lang].status.win); addLogSys("sysWinP"); pushHistory("win"); toast(NAMES[lang].status.win,"ok");
      }
      if(!gameOver) endTurn(); else render();
    }
  }
}

function doMove(fromX,fromY,m){
  const p=board[fromY][fromX];
  if(!p) return;
  if(m.stay){ if(m.capture) board[m.y][m.x]=null; }
  else { if(m.capture) board[m.y][m.x]=null; board[m.y][m.x]=p; board[fromY][fromX]=null; }
  p.side=1-p.side;
}

function doLevy(owner,x,y){
  if(!bags[owner].length) return;
  const type=bags[owner].pop();
  board[y][x]=createPiece(type,owner,0);
  selected=null; legalMoves=[];
}
function endTurn(){
  selected=null; legalMoves=[];
  if(gameOver){ render(); return; }
  turn = turn==="P" ? "A" : "P";
  render();
  if(turn==="A"){ setStatus(NAMES[lang].status.ai,"ai-thinking"); setTimeout(aiMove,60); }
  else setStatus(NAMES[lang].status.your);
}

/* ===== AI ===== */
const PIECE_VAL={Duke:1000,Champion:9,Marshall:8,General:8,Wizard:7,Seer:6,Knight:6,Ranger:5,Dragoon:5,Priest:5,Bowman:4,LongBowman:4,Assassin:5,Pikeman:3,Footman:2};
function dukePos(owner){
  for(let y=0;y<6;y++) for(let x=0;x<6;x++){
    const p=board[y][x]; if(p&&p.type==="Duke"&&p.owner===owner) return {x,y};
  }
  return null;
}
function isSquareAttackedBy(x,y,attacker){
  for(let yy=0;yy<6;yy++) for(let xx=0;xx<6;xx++){
    const p=board[yy][xx];
    if(!p||p.owner!==attacker) continue;
    const moves=generateMovesFor(xx,yy);
    for(const m of moves){
      if(m.x===x&&m.y===y&&(m.capture||m.type==="Strike"||m.type==="Move"||m.type==="Jump"||m.type==="Slide"||m.type==="JumpSlide")) return true;
    }
  }
  return false;
}
function evaluate(){
  let score=0;
  const aDuke=dukePos("A"), pDuke=dukePos("P");
  if(!aDuke) return -100000;
  if(!pDuke) return 100000;
  for(let y=0;y<6;y++) for(let x=0;x<6;x++){
    const p=board[y][x]; if(!p) continue;
    const v=PIECE_VAL[p.type]||2;
    const sign=p.owner==="A"?1:-1;
    score += sign * v * 12;
    // hanging pieces: attacked by opponent → big penalty
    const enemy = p.owner==="A" ? "P" : "A";
    if(p.type!=="Duke" && isSquareAttackedBy(x,y,enemy)){
      score -= sign * v * 9; // almost cancels the piece value if hanging
    }
    score += sign * generateMovesFor(x,y).length * 0.25;
    score += sign * (3-Math.abs(x-2.5)-Math.abs(y-2.5)) * 0.2;
  }
  if(isSquareAttackedBy(aDuke.x, aDuke.y, "P")) score -= 120;
  if(isSquareAttackedBy(pDuke.x, pDuke.y, "A")) score += 70;
  // bag pieces are potential, not free material on the board
  score += bags.A.length * 1.2 - bags.P.length * 1.2;
  return score;
}
function snapshotBoard(){return{board:board.map(r=>r.map(c=>c?{...c}:null)),bags:{P:bags.P.slice(),A:bags.A.slice()},pieceId};}
function restoreBoard(s){board=s.board;bags=s.bags;pieceId=s.pieceId;}
function applyMoveAI(owner,m){
  if(m.type==="Levy"){ if(bags[owner].length){ const type=bags[owner].pop(); board[m.y][m.x]=createPiece(type,owner,0);} return; }
  const p=board[m.fromY][m.fromX]; if(!p) return;
  if(m.stay){ if(m.capture) board[m.y][m.x]=null; }
  else { if(m.capture) board[m.y][m.x]=null; board[m.y][m.x]=p; board[m.fromY][m.fromX]=null; }
  p.side=1-p.side;
}
function minimax(depth,alpha,beta,maximizing){
  if(depth===0) return evaluate();
  const owner=maximizing?"A":"P";
  const moves=getAllLegalMoves(owner);
  if(!moves.length) return maximizing?-9999:9999;
  moves.sort((a,b)=>(b.capture?1:0)-(a.capture?1:0));
  if(maximizing){ let maxE=-Infinity; for(const m of moves){ const snap=snapshotBoard(); applyMoveAI(owner,m); const ev=minimax(depth-1,alpha,beta,false); restoreBoard(snap); if(ev>maxE)maxE=ev; alpha=Math.max(alpha,ev); if(beta<=alpha)break; } return maxE; }
  else { let minE=Infinity; for(const m of moves){ const snap=snapshotBoard(); applyMoveAI(owner,m); const ev=minimax(depth-1,alpha,beta,true); restoreBoard(snap); if(ev<minE)minE=ev; beta=Math.min(beta,ev); if(beta<=alpha)break; } return minE; }
}
function aiMove(){
  if(gameOver) return;
  try {
    const moves=getAllLegalMoves("A");
    if(!moves.length){
      selected=null; legalMoves=[]; turn="P";
      setStatus(NAMES[lang].status.your);
      toast(lang==="cs"?"AI nemá tah":"AI has no move");
      render(); return;
    }
    // Root priority: capture Duke >> captures >> safe moves >> Levy >> suicidal Levy
    function rootPri(m){
      if(m.capture){
        const t=board[m.y]&&board[m.y][m.x];
        if(t&&t.type==="Duke") return 100000;
        return 5000 + (t ? (PIECE_VAL[t.type]||2)*100 : 0);
      }
      if(m.type==="Levy"){
        // never prefer levying onto a square the player can take immediately
        if(isSquareAttackedBy(m.x,m.y,"P")) return -8000;
        return -200;
      }
      return 0;
    }
    moves.sort((a,b)=> rootPri(b)-rootPri(a) || (Math.random()-0.5));
    let best=moves[0], bestScore=-Infinity;
    const startT=performance.now(), maxTime=1600;
    const depth = moves.length<=14 ? 4 : 3;
    for(const m of moves){
      if(performance.now()-startT>maxTime) break;
      const snap=snapshotBoard();
      applyMoveAI("A",m);
      if(!dukePos("P")){ restoreBoard(snap); best=m; bestScore=100000; break; }
      let score=minimax(depth,-Infinity,Infinity,false);
      // extra root penalty for suicidal levy (search may be shallow)
      if(m.type==="Levy" && isSquareAttackedBy(m.x,m.y,"P")) score -= 400;
      // extra root bonus for real captures
      if(m.capture){
        const t=snap.board[m.y]&&snap.board[m.y][m.x];
        if(t) score += (PIECE_VAL[t.type]||2)*8;
      }
      restoreBoard(snap);
      if(score>bestScore){ bestScore=score; best=m; }
    }
    // if best is still a suicidal levy and a non-levy exists, pick best non-levy
    if(best && best.type==="Levy" && isSquareAttackedBy(best.x,best.y,"P")){
      const alt=moves.find(m=>m.type!=="Levy");
      if(alt) best=alt;
    }
    if(best.type==="Levy"){
      doLevy("A",best.x,best.y);
      lastMoveCells = [{x:best.x,y:best.y}];
      lastCaptureCell = null;
      const placed=board[best.y]&&board[best.y][best.x];
      if(placed) addLogLevy("A", placed.type, best.x, best.y, bags.A.length);
    } else {
      const fx=best.fromX, fy=best.fromY, p=board[fy]&&board[fy][fx];
      if(p){
        let capType=null;
        if(best.capture){ const victim=board[best.y]&&board[best.y][best.x]; if(victim) capType=victim.type; }
        if(best.stay){
          if(best.capture && board[best.y]) board[best.y][best.x]=null;
          lastMoveCells = [{x:fx,y:fy}];
          lastCaptureCell = best.capture ? {x:best.x,y:best.y} : null;
        } else {
          if(best.capture && board[best.y]) board[best.y][best.x]=null;
          board[best.y][best.x]=p; board[fy][fx]=null;
          lastMoveCells = [{x:fx,y:fy},{x:best.x,y:best.y}];
          lastCaptureCell = null;
        }
        p.side=1-p.side;
        addLogMove("A", p.type, fx, fy, best.x, best.y, capType, best.stay);
      }
    }
    if(!board.flat().some(t=>t&&t.type==="Duke"&&t.owner==="P")){
      gameOver="A"; setStatus(NAMES[lang].status.lose); addLogSys("sysWinA");
      pushHistory("win"); toast(NAMES[lang].status.lose,"err");
    } else {
      // After AI move it is player's turn — store that in history
      turn="P";
      pushHistory("A");
    }
  } catch(err){ console.error(err); } 
  finally {
    selected=null; legalMoves=[];
    if(!gameOver){ turn="P"; setStatus(NAMES[lang].status.your); }
    render();
  }
}

/* ===== UI ===== */
document.getElementById("btnSave").onclick=()=>{
  localStorage.setItem("theDukeSave", JSON.stringify({board,bags,turn,pieceId,gameOver,phase,firstPlayer,logLines,logSeq,setupPieces,setupPlaced,history,lastMoveCells,lastCaptureCell}));
  toast(NAMES[lang].saved,"ok");
};
document.getElementById("btnLoad").onclick=()=>{
  const raw=localStorage.getItem("theDukeSave");
  if(!raw){ toast(NAMES[lang].noSave,"err"); return; }
  try{
    const d=JSON.parse(raw);
    board=d.board; bags=d.bags; turn=d.turn; pieceId=d.pieceId; gameOver=d.gameOver;
    phase=d.phase||"play"; firstPlayer=d.firstPlayer||"P"; logLines=d.logLines||[]; logSeq=d.logSeq||(logLines.reduce((m,e)=>Math.max(m,e.n||0),0));
    setupPieces=d.setupPieces||[]; setupPlaced=d.setupPlaced||[];
    history=d.history||[]; lastMoveCells=d.lastMoveCells||[]; lastCaptureCell=d.lastCaptureCell||null;
    if(!history.length) pushHistory("loaded");
    selected=null; legalMoves=[]; render();
    if(phase==="setupP") setStatus(NAMES[lang].status.place + (NAMES[lang][(setupPieces&&setupPieces[0])||"Duke"]));
    else if(phase==="setupA"){ setStatus(NAMES[lang].status.setupA); setTimeout(aiSetup,300); }
    else if(turn==="A"&&!gameOver){ setStatus(NAMES[lang].status.ai,"ai-thinking"); setTimeout(aiMove,80); }
    else setStatus(turn==="P"?NAMES[lang].status.your:NAMES[lang].status.ai);
    toast(NAMES[lang].loaded,"ok");
  }catch(e){ toast("Load error","err"); }
};

document.getElementById("btnRestart").onclick=()=>{
  startSetup();
};

function updateLangButton(){
  // show the language you can SWITCH TO
  document.getElementById("btnLang").textContent = (lang==="cs" ? "EN" : "CS");
}
function refreshStatusForLang(){
  if(replayMode){
    setStatus(lang==="cs"?"Přehrávač aktivní – hra blokována":"Replay active – play locked");
    updateReplayInfo();
    return;
  }
  if(gameOver==="P"){ setStatus(NAMES[lang].status.win); return; }
  if(gameOver==="A"){ setStatus(NAMES[lang].status.lose); return; }
  if(phase==="setupP"){
    setStatus(NAMES[lang].status.place + (NAMES[lang][(setupPieces&&setupPieces[0])||"Duke"]));
    return;
  }
  if(phase==="setupA"){
    setStatus(NAMES[lang].status.setupA);
    return;
  }
  if(phase==="play"){
    if(turn==="P") setStatus(NAMES[lang].status.your);
    else setStatus(NAMES[lang].status.ai, "ai-thinking");
  }
}
document.getElementById("btnLang").onclick=()=>{
  lang = lang==="cs" ? "en" : "cs";
  document.documentElement.lang = lang;
  updateLangButton();
  render();
  refreshStatusForLang();
  // if log modal open, refresh it
  const logBody=document.getElementById("logBody");
  if(document.getElementById("logModal").classList.contains("show")){
    document.getElementById("logTitle").textContent=NAMES[lang].logTitle;
    logBody.innerHTML = logLines.length ? logLines.map(e=>formatLogLine(e)).join("\n") : (lang==="cs"?"(prázdný)":"(empty)");
  }
  if(document.getElementById("helpModal").classList.contains("show")){
    document.getElementById("helpTitle").textContent=NAMES[lang].helpTitle;
    document.getElementById("helpBody").innerHTML=NAMES[lang].help;
  }
};
document.getElementById("btnHelp").onclick=()=>{
  document.getElementById("helpTitle").textContent=NAMES[lang].helpTitle;
  document.getElementById("helpBody").innerHTML=NAMES[lang].help;
  document.getElementById("helpBody").classList.add("help-mode");
  document.getElementById("helpModal").classList.add("show");
};
document.getElementById("helpClose").onclick=()=>document.getElementById("helpModal").classList.remove("show");
document.getElementById("helpModal").addEventListener("click", e => { if(e.target === document.getElementById("helpModal")) document.getElementById("helpModal").classList.remove("show"); });
document.getElementById("logModal").addEventListener("click", e => { if(e.target === document.getElementById("logModal")) document.getElementById("logModal").classList.remove("show"); });

document.getElementById("btnLog").onclick=()=>{
  document.getElementById("logTitle").textContent=NAMES[lang].logTitle;
  document.getElementById("logBody").innerHTML = logLines.length ? logLines.map(e=>formatLogLine(e)).join("\n") : (lang==="cs"?"(prázdný)":"(empty)");
  document.getElementById("logModal").classList.add("show");
};
document.getElementById("logClose").onclick=()=>document.getElementById("logModal").classList.remove("show");
document.getElementById("logCloseX").onclick=()=>document.getElementById("logModal").classList.remove("show");
document.getElementById("btnCopyLog").onclick=()=>{
  const text=logLines.map(e=>formatLogLine(e,true)).join("\n");
  navigator.clipboard.writeText(text).then(()=>toast(NAMES[lang].copied,"ok")).catch(()=>{
    const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta); toast(NAMES[lang].copied,"ok");
  });
};
document.getElementById("titleBtn").onclick=()=>{ showCoords=!showCoords; document.getElementById("titleBtn").classList.toggle("coords-on",showCoords); render(); };
document.getElementById("bagPlayer").onclick=()=>{
  if(replayMode) return;
  if(phase!=="play"||turn!=="P"||gameOver||!bags.P.length) return;
  const levy=getAllLegalMoves("P").filter(m=>m.type==="Levy");
  if(levy.length){ selected="levy"; legalMoves=levy; setStatus(NAMES[lang].status.levy); render(); }
  else toast(NAMES[lang].noLevy,"err");
};



/* ===== TILE ZOOM ===== */
function showTileZoom(x,y){
  const p=getPiece(x,y);
  if(!p) return;
  const overlay=document.getElementById("tileZoom");
  const tileEl=document.getElementById("zoomTile");
  const img=document.getElementById("zoomImg");
  const nameEl=document.getElementById("zoomName");
  const hintEl=document.getElementById("zoomHint");
  const srcs=IMG[p.type];
  img.src = srcs ? srcs[p.side] : "";
  tileEl.className = "zoom-tile " + (p.owner==="P"?"player":"ai");
  nameEl.textContent = (NAMES[lang][p.type]||p.type) + " · " + sq(x,y);
  hintEl.textContent = lang==="cs"
    ? "Strana " + (p.side+1) + "/2 · klepni kamkoli pro zavření"
    : "Side " + (p.side+1) + "/2 · tap anywhere to close";
  overlay.classList.add("show");
}
function hideTileZoom(){
  document.getElementById("tileZoom").classList.remove("show");
}
document.getElementById("tileZoom").addEventListener("click", hideTileZoom);

/* ===== REPLAY ===== */
function updateReplayInfo(){
  const el=document.getElementById("replayInfo");
  if(!el) return;
  const h = history[replayIdx];
  let detail = "";
  if(h && h.logEntry) detail = " · " + formatLogLine(h.logEntry, true).replace(/^\d+\.\s*/, "");
  else if(h && h.note) detail = " · " + h.note;
  el.textContent = (history.length ? (replayIdx+1) : 0) + " / " + history.length + detail;
}
function stopReplay(){
  if(replayTimer){ clearInterval(replayTimer); replayTimer=null; }
  const btn=document.getElementById("rpPlay");
  if(btn) btn.textContent="▶";
}
function toggleReplayMode(){
  const bar=document.getElementById("replayBar");
  const btn=document.getElementById("btnReplay");
  if(!replayMode){
    // ENTER replay — freeze live game state
    liveSnapshot = {
      ...cloneBoardState(),
      setupPieces: setupPieces ? setupPieces.slice() : [],
      setupPlaced: setupPlaced ? setupPlaced.map(p=>({...p})) : [],
      selected: null,
      legalMoves: []
    };
    if(!history.length) pushHistory("now");
    else {
      try {
        const last = history[history.length-1];
        if(JSON.stringify(last.board)!==JSON.stringify(board)) pushHistory("now");
      } catch(e){ pushHistory("now"); }
    }
    replayMode = true;
    bar.classList.add("show");
    btn.classList.add("active");
    document.body.classList.add("replay-mode");
    selected=null; legalMoves=[];
    replayIdx = 0;
    restoreHistory(0);
    setStatus(lang==="cs"?"Přehrávač aktivní – hra blokována":"Replay active – play locked");
  } else {
    // EXIT replay — restore exact live state (not history)
    stopReplay();
    replayMode = false;
    bar.classList.remove("show");
    btn.classList.remove("active");
    document.body.classList.remove("replay-mode");
    if(liveSnapshot){
      const h = liveSnapshot;
      board = h.board.map(r => r.map(c => c ? {...c} : null));
      bags = {P: h.bags.P.slice(), A: h.bags.A.slice()};
      turn = h.turn; gameOver = h.gameOver; pieceId = h.pieceId;
      phase = h.phase || phase;
      lastMoveCells = (h.lastMoveCells||[]).map(c=>({...c}));
      lastCaptureCell = h.lastCaptureCell ? {...h.lastCaptureCell} : null;
      if(h.setupPieces) setupPieces = h.setupPieces.slice();
      if(h.setupPlaced) setupPlaced = h.setupPlaced.map(p=>({...p}));
      liveSnapshot = null;
    } else if(history.length) {
      restoreHistory(history.length-1);
    }
    selected=null; legalMoves=[];
    if(gameOver==="P") setStatus(NAMES[lang].status.win);
    else if(gameOver==="A") setStatus(NAMES[lang].status.lose);
    else if(phase==="setupP") setStatus(NAMES[lang].status.place + (NAMES[lang][(setupPieces&&setupPieces[0])||"Duke"]));
    else if(phase==="setupA") setStatus(NAMES[lang].status.setupA);
    else if(phase==="play"){
      if(turn==="P") setStatus(NAMES[lang].status.your);
      else setStatus(NAMES[lang].status.ai, "ai-thinking");
    }
  }
  render();
}
function rpStep(delta){
  stopReplay();
  const ni = Math.max(0, Math.min(history.length-1, replayIdx+delta));
  restoreHistory(ni);
}
function rpPlayToggle(){
  if(replayTimer){ stopReplay(); return; }
  document.getElementById("rpPlay").textContent="⏸";
  replayTimer = setInterval(()=>{
    if(replayIdx >= history.length-1){ stopReplay(); return; }
    restoreHistory(replayIdx+1);
  }, 900);
}

document.getElementById("btnReplay").onclick = ()=> toggleReplayMode();
document.getElementById("rpFirst").onclick = ()=>{ stopReplay(); restoreHistory(0); };
document.getElementById("rpPrev").onclick = ()=> rpStep(-1);
document.getElementById("rpNext").onclick = ()=> rpStep(1);
document.getElementById("rpLast").onclick = ()=>{ stopReplay(); restoreHistory(history.length-1); };
document.getElementById("rpPlay").onclick = ()=> rpPlayToggle();


updateLangButton();
startSetup();
</script>
