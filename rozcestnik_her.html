<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rozcestník her</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --border: #334155;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            background: -webkit-linear-gradient(45deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            max-width: 700px;
            margin: 0 auto;
            flex-wrap: wrap;
        }

        .search-bar, .sort-select {
            padding: 0.8rem 1.5rem;
            border-radius: 30px;
            border: 1px solid var(--border);
            background-color: #0b1120;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-bar {
            flex: 1;
            min-width: 250px;
        }

        .sort-select {
            cursor: pointer;
            min-width: 200px;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2394a3b8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 1rem top 50%;
            background-size: 0.65rem auto;
            padding-right: 2.5rem;
        }

        .search-bar:focus, .sort-select:focus {
            border-color: var(--primary);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            opacity: 0;
            animation: fadeIn 1s ease-out forwards;
            animation-delay: 0.3s;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s;
            position: relative;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
            border-color: #475569;
        }

        .card-img {
            width: 100%;
            height: 160px;
            background-color: #2a3b52;
            border-bottom: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-img .fallback-text {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.7);
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .card-body {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .play-count-badge {
            font-size: 0.75rem;
            background-color: #334155;
            color: #cbd5e1;
            padding: 0.2rem 0.5rem;
            border-radius: 12px;
            font-weight: normal;
        }

        .card-text {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        .card-actions {
            display: flex;
            gap: 1rem;
        }

        .btn {
            flex: 1;
            display: inline-block;
            padding: 0.6rem;
            text-align: center;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-play {
            background-color: var(--primary);
            color: #fff;
        }

        .btn-play:hover {
            background-color: var(--primary-hover);
        }

        .btn-bgg {
            background-color: var(--accent);
            color: #fff;
        }

        .btn-bgg:hover {
            background-color: var(--accent-hover);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: #64748b;
            font-size: 1.2rem;
            display: none;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Fallback přechody */
        .gradient-1 { background: linear-gradient(135deg, #3b82f6, #8b5cf6); }
        .gradient-2 { background: linear-gradient(135deg, #10b981, #059669); }
        .gradient-3 { background: linear-gradient(135deg, #ef4444, #b91c1c); }
        .gradient-4 { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .gradient-5 { background: linear-gradient(135deg, #8b5cf6, #ec4899); }
        .gradient-6 { background: linear-gradient(135deg, #0ea5e9, #0284c7); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Rozcestník her</h1>
            <div class="controls">
                <input type="text" id="searchInput" class="search-bar" placeholder="Hledat hru podle názvu...">
                <select id="sortSelect" class="sort-select">
                    <option value="alpha">Seřadit abecedně (A-Z)</option>
                    <option value="plays">Seřadit podle spuštění</option>
                </select>
            </div>
        </header>

        <div class="grid" id="gamesContainer">
            <!-- Karty her se vygenerují přes JavaScript -->
        </div>
        <div id="emptyState" class="empty-state">
            Žádná hra neodpovídá hledání.
        </div>
    </div>

    <script>
        const IMG_DIR = 'images/';
        const STORAGE_KEY = 'rozcestnik_play_counts';

        // Načtení počtu spuštění z localStorage
        let playCounts = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};

        // Databáze her s doplněnými přímými odkazy na BGG
        const games = [
    { id: 'niju', title: 'Ni-Ju 二十', url: 'https://sentinel65.github.io/niju.html', desc: 'Klasická japonská abstraktní desková hra.', img: 'niju.jpg', fallback: 'gradient-1', bgg: 'https://boardgamegeek.com/boardgame/194976/ni-ju' },
    { id: 'passo', title: 'Passo', url: 'https://sentinel65.github.io/passo.html', desc: 'Strategická logická hra.', img: 'passo.jpg', fallback: 'gradient-2', bgg: 'https://boardgamegeek.com/boardgame/401177/passo' },
    { id: 'freedom', title: 'Freedom', url: 'https://sentinel65.github.io/Freedom.html', desc: 'Získejte svobodu ve své strategii na hracím plánu.', img: 'freedom.jpg', fallback: 'gradient-3', bgg: 'https://boardgamegeek.com/boardgame/100480/freedom' },
    { id: 'slidestone', title: 'Slidestone', url: 'https://sentinel65.github.io/Slidestone.html', desc: 'Posouvejte kameny po desce a vytvořte vítěznou formaci.', img: 'slidestone.jpg', fallback: 'gradient-4', bgg: 'https://boardgamegeek.com/boardgame/376950/slidestone' },
    { id: 'sumon', title: 'Sum On', url: 'https://sentinel65.github.io/sumon.html', desc: 'Taktická hra pro bystré mozky.', img: 'sumon.jpg', fallback: 'gradient-5', bgg: 'https://boardgamegeek.com/boardgame/237136/sum-on' },
    { id: 'sentinel', title: 'Sentinel', url: 'https://sentinel65.github.io/sentinel.html', desc: 'Rozsévejte své hrací kameny. K akci s žetony potřebujete základní věž o velikosti alespoň 2 kamenů.', img: 'sentinel.jpg', fallback: 'gradient-6', bgg: 'https://boardgamegeek.com/boardgame/463291/sentinel' },
    { id: 'lockpick', title: 'LockPick', url: 'https://sentinel65.github.io/LockPick.html', desc: 'Kombinační logická výzva.', img: 'lockpick.jpg', fallback: 'gradient-1', bgg: 'https://boardgamegeek.com/thread/3719518/wip-lock-pick-2026-solitaire-print-and-play-contes' },
    { id: 'cabo', title: 'Cabo', url: 'https://sentinel65.github.io/Cabo.html', desc: 'Zbavte se svých karet a udržujte si nízké skóre v této napínavé karetní hře.', img: 'cabo.jpg', fallback: 'gradient-2', bgg: 'https://boardgamegeek.com/boardgame/271321/cabo-second-edition' },
    { id: 'zatre', title: 'Zatre', url: 'https://sentinel65.github.io/zatre.html', desc: 'Matematická abstraktní hra se skládáním čísel.', img: 'zatre.jpg', fallback: 'gradient-3', bgg: 'https://boardgamegeek.com/boardgame/2938/zatre' },
    { id: 'tessella', title: 'Tessella', url: 'https://sentinel65.github.io/Tessella.html', desc: 'Abstraktní hra, ve které vaše figurky spolupracují v párech a snaží se zajmout soupeřovy kameny, které se nacházejí v jejich zorném poli.', img: 'tessella.jpg', fallback: 'gradient-4', bgg: 'https://boardgamegeek.com/boardgame/377702/tessella' },
    { id: 'baju', title: 'Baju', url: 'https://sentinel65.github.io/Baju.html', desc: 'Abstraktní logická hra pro dva hráče.', img: 'baju.jpg', fallback: 'gradient-5', bgg: 'https://boardgamegeek.com/boardgame/418339/baju' },
    { id: 'folky', title: 'Folky', url: 'https://sentinel65.github.io/folky.html', desc: 'Tradiční principy v moderním webovém kabátě.', img: 'folky.jpg', fallback: 'gradient-6', bgg: 'https://www.folky.cz/' },
    { id: 'nodelinks', title: 'Node Links', url: 'https://sentinel65.github.io/NodeLinks.html', desc: 'Spojujte uzly a blokujte cestu svým oponentům.', img: 'nodelinks.jpg', fallback: 'gradient-1', bgg: 'https://boardgamegeek.com/thread/3710606/wip-node-links-2026-1-card-print-and-play-contest/page/2' },
    { id: 'migoyugo', title: 'MigoYugo', url: 'https://sentinel65.github.io/MigoYugo.html', desc: 'Bystrá strategická hra MigoYugo, implementovaná s AI.', img: 'migoyugo.jpg', fallback: 'gradient-2', bgg: 'https://boardgamegeek.com/thread/3655964/wip-migoyugo-2026-two-player-print-and-play-design' },
    { id: 'ordo', title: 'Ordo', url: 'https://sentinel65.github.io/Ordo.html', desc: 'Udržte své kameny spojené ve skupině napříč herním plánem.', img: 'ordo.jpg', fallback: 'gradient-3', bgg: '' },
    { id: 'hex6', title: 'Hex6', url: 'https://sentinel65.github.io/Hex6_CB.html', desc: 'Paruj stejná čísla a dosáhni nejvyššího skóre.', img: 'hex6.jpg', fallback: 'gradient-4', bgg: 'https://boardgamegeek.com/thread/2898182/wip-hex-6-flip-and-write-contest-ready' },
    { id: 'rook', title: 'Rook', url: 'https://sentinel65.github.io/rook.html', desc: 'Taktická partie inspirovaná šachovou věží.', img: 'rook.jpg', fallback: 'gradient-5', bgg: 'https://www.tlamagames.com/en/puzzles/chess-puzzle-rook/' },
    { id: 'collapsi', title: 'Collapsi', url: 'https://sentinel65.github.io/Collapsi_AI_BASE64_en.html', desc: 'Abstraktní strategická hra. Pohyby se hrací plocha zmenšuje. Staň se posledním hráčem, který může táhnout..', img: 'collapsi.jpg', fallback: 'gradient-6', bgg: 'https://boardgamegeek.com/boardgame/447899/collapsi' },
    { id: 'six', title: 'Six', url: 'https://sentinel65.github.io/six.html', desc: 'Pokládejte a přesouvejte kameny do tvaru, chytře navigujte napříč fázemi hry.', img: 'six.jpg', fallback: 'gradient-1', bgg: 'https://boardgamegeek.com/boardgame/20195/six' },
    { id: 'katarenga', title: 'Katarenga', url: 'https://sentinel65.github.io/katarenga.html', desc: 'Varianta šachu, ve které je typ figurky určen políčkem, na kterém se právě nachází.', img: 'katarenga.jpg', fallback: 'gradient-1', bgg: 'https://boardgamegeek.com/boardgame/233502/katarenga' },
    { id: 'honeycombs', title: 'Honeycombs', url: 'https://sentinel65.github.io/honeycombs.html', desc: 'Cilem je propojit všechna pole od 1 do 19 tak, aby sousední čísla ležela vždy vedle sebe.', img: 'honeycombs.jpg', fallback: 'gradient-1', bgg: '' },
    { id: 'blooms', title: 'Blooms', url: 'https://sentinel65.github.io/blooms.html', desc: 'Hra pro dva hráče, inspirovaná hrou Go. Hráči si navzájem berou figurky obklíčením.', img: 'blooms.jpg', fallback: 'gradient-1', bgg: 'https://boardgamegeek.com/boardgame/249095/blooms' },
    { id: 'trezor', title: 'Trezor', url: 'https://sentinel65.github.io/Trezor.html', desc: 'Digitalizovaná verze kostkové solitaire hry "Vault: A Solitaire Dice Game (2021)"', img: 'trezor.jpg', fallback: 'gradient-1', bgg: 'https://boardgamegeek.com/boardgame/350759/vault-a-solitaire-dice-game' },
    { id: 'nte_gemini', title: 'Nine Tiles Extreme', url: 'https://sentinel65.github.io/NTE_Gemini.html', desc: 'Adrenalinová vizuální hříčka, skládejte obrazce s přesností a rychlostí.', img: 'ninetiles.jpg', fallback: 'gradient-2', bgg: 'https://boardgamegeek.com/boardgame/391084/nine-tiles-extreme' }
];

        const container = document.getElementById('gamesContainer');
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');
        const emptyState = document.getElementById('emptyState');

        // Funkce pro logování spuštění hry
        window.trackPlay = function(gameId) {
            playCounts[gameId] = (playCounts[gameId] || 0) + 1;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(playCounts));
            
            // Pokud chceme ihned aktualizovat UI po kliknutí (badge):
            const badge = document.getElementById(`badge-${gameId}`);
            if(badge) {
                badge.textContent = `${playCounts[gameId]}x`;
                badge.style.display = 'inline-block';
            }
        };

        // Handler pro chybu načtení obrázku
        window.handleImageError = function(imgElement, fallbackClass, title) {
            const parent = imgElement.parentElement;
            parent.classList.add(fallbackClass);
            parent.innerHTML = `<span class="fallback-text">${title.substring(0, 3).toUpperCase()}</span>`;
        };

        // Funkce pro řazení
        function getSortedGames(gamesList, sortType) {
            return [...gamesList].sort((a, b) => {
                if (sortType === 'plays') {
                    const playsA = playCounts[a.id] || 0;
                    const playsB = playCounts[b.id] || 0;
                    if (playsB !== playsA) {
                        return playsB - playsA; // Sestupně od nejhranější
                    }
                }
                // Implicitní abecední řazení (české znaky)
                return a.title.localeCompare(b.title, 'cs');
            });
        }

        function renderGames(gamesList) {
            container.innerHTML = '';
            
            if (gamesList.length === 0) {
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';

            gamesList.forEach(game => {
                const playCount = playCounts[game.id] || 0;
                
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-img">
                        <img src="${IMG_DIR}${game.img}" alt="${game.title}" 
                             onerror="handleImageError(this, '${game.fallback}', '${game.title.replace(/'/g, "\\'")}')">
                    </div>
                    <div class="card-body">
                        <h3 class="card-title">
                            ${game.title}
                            ${playCount > 0 ? `<span class="play-count-badge" id="badge-${game.id}">${playCount}x</span>` : `<span class="play-count-badge" id="badge-${game.id}" style="display:none;">0x</span>`}
                        </h3>
                        <p class="card-text">${game.desc}</p>
                        <div class="card-actions">
                            <a href="${game.url}" class="btn btn-play" target="_blank" rel="noopener noreferrer" onclick="trackPlay('${game.id}')">Hrát Hru</a>
                            <a href="${game.bgg}" class="btn btn-bgg" target="_blank" rel="noopener noreferrer">Info BGG</a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Hlavní funkce pro aktualizaci zobrazení (Vyhledávání + Řazení)
        function updateDisplay() {
            const searchTerm = searchInput.value.toLowerCase();
            const sortType = sortSelect.value;
            
            // Nejprve filtrace
            const filteredGames = games.filter(game => 
                game.title.toLowerCase().includes(searchTerm) || 
                game.desc.toLowerCase().includes(searchTerm)
            );
            
            // Poté seřazení
            const sortedAndFiltered = getSortedGames(filteredGames, sortType);
            
            renderGames(sortedAndFiltered);
        }

        // Event listenery
        searchInput.addEventListener('input', updateDisplay);
        sortSelect.addEventListener('change', updateDisplay);

        // Inicializace - první spuštění (implicitně abecedně, díky getSortedGames a výchozí hodnotě selectu)
        updateDisplay();
        
        // Pomocník pro to, když se uživatel vrátí na stránku z otevřené hry - 
        // vynutí překreslení pro aktualizaci počtadel a pořadí
        window.addEventListener('focus', () => {
            const newPlayCounts = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
            // Pokud se počet změní, překreslíme
            if (JSON.stringify(playCounts) !== JSON.stringify(newPlayCounts)) {
                playCounts = newPlayCounts;
                if (sortSelect.value === 'plays') {
                    updateDisplay();
                } else {
                    // Jenom aktualizujeme čísla v badge bez přeskupování layoutu,
                    // aby obrazovka neposkočila před očima
                    games.forEach(g => {
                        const b = document.getElementById(`badge-${g.id}`);
                        if(b) {
                            const count = playCounts[g.id] || 0;
                            if (count > 0) {
                                b.textContent = `${count}x`;
                                b.style.display = 'inline-block';
                            }
                        }
                    });
                }
            }
        });
    </script>
</body>
</html>
