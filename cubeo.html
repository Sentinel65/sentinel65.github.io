<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>CUBEO</title>
<style>
:root{
  --bg:#10141d;--panel:#171d28;--panel2:#202838;--line:#354054;--text:#eef2f7;
  --muted:#9ca8b9;--accent:#71c7ff;--green:#63d59a;--gold:#f2c96d;--danger:#ef7474;
  --cell:min(8.7vw,58px);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;color:inherit}
.app{height:100dvh;display:flex;flex-direction:column}
.topbar{height:116px;flex:0 0 116px;padding:7px 12px 8px;background:rgba(16,20,29,.98);border-bottom:1px solid var(--line);z-index:10}
.titleRow{height:54px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.playerCounter{display:flex;align-items:center;gap:8px;width:max-content;padding:7px 11px;border:1px solid var(--line);background:#151b26;border-radius:12px;font-size:11px;letter-spacing:.08em;color:var(--muted);transition:.2s}
.playerCounter b{font-size:20px;color:var(--text);line-height:1}
.playerCounter.whiteCounter{justify-self:start}.playerCounter.blackCounter{justify-self:end}
.playerCounter.active{border-color:var(--accent);box-shadow:0 0 0 1px rgba(113,199,255,.25) inset,0 0 18px rgba(113,199,255,.09);color:var(--text)}
.counterDie{font-size:14px}
.menu{height:46px;display:flex;justify-content:center;gap:7px;align-items:center}
.titleWrap{position:relative;justify-self:center;text-align:center}
.titleWrap h1{font-size:22px;letter-spacing:.18em;margin:0;font-weight:800}
#titleHit{position:absolute;inset:-10px -35px;border:0;background:transparent;cursor:default}

.iconBtn{width:42px;height:42px;border:1px solid var(--line);background:var(--panel);border-radius:12px;display:grid;place-items:center;font-size:20px;cursor:pointer;transition:.15s}
.iconBtn:hover{background:var(--panel2);border-color:#52627b}
.iconBtn.active{outline:2px solid var(--accent);outline-offset:-2px}
.iconBtn:disabled{opacity:.35;cursor:not-allowed}
.main{min-height:0;flex:1;display:flex;overflow:hidden}
.section{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:10px}
.section h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 9px}
.turn{display:flex;align-items:center;gap:9px;font-weight:750}
.turnDot{width:17px;height:17px;border-radius:50%;border:2px solid #56647a;box-shadow:inset 0 0 0 2px rgba(0,0,0,.18)}
.turnDot.white{background:#f5f6f8}.turnDot.black{background:#20242c}
.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.stat{background:#111721;border:1px solid #2b3547;border-radius:10px;padding:8px}
.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr;gap:7px}
.actionDock,.playDock{
  position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
  display:flex;gap:8px;padding:8px 10px;
  width:min(340px, calc(100% - 24px));
  height:64px;
  box-sizing:border-box;
  background:rgba(17,23,33,.88);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:14px;z-index:3;
  align-items:center;justify-content:center;
}
.playDock{display:none}
.playDock.open{display:flex}
.playDock .playbar{display:flex;align-items:center;justify-content:center;gap:6px;flex:1;min-width:0}
.playDock .playbar button{width:40px;height:40px;border:1px solid var(--line);background:#111721;border-radius:10px;cursor:pointer;font-size:14px;flex:0 0 auto}
.playDock .playbar button:hover{background:var(--panel2)}
.playDock .counter{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);min-width:64px;text-align:center;flex:0 0 auto}
.playDock .closePlay{width:40px;height:40px;border:1px solid var(--line);background:#1a2230;border-radius:10px;cursor:pointer;font-size:16px;flex:0 0 auto}
.toast.winToast{background:linear-gradient(135deg,#2a2418,#3a3020);border-color:var(--gold);color:#f8e7b0;font-weight:700;font-size:14px;padding:14px 18px;box-shadow:0 12px 36px #000a,0 0 20px rgba(242,201,109,.25)}

.actionBtn{border:1px solid var(--line);background:#121824;border-radius:12px;padding:0;text-align:center;cursor:pointer;width:48px;height:48px;flex:0 0 48px;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1}
.actionBtn:disabled{opacity:.35;cursor:not-allowed}
.actionBtn.active{border-color:var(--accent);box-shadow:0 0 0 1px rgba(113,199,255,.22) inset;background:#182536}
.actionBtn .actIcon{pointer-events:none}
.helpHint{font-size:11px;line-height:1.45;color:var(--muted)}
.pool{display:flex;gap:7px;flex-wrap:wrap}
.poolDice{display:flex;gap:5px}
.miniDie{width:31px;height:31px;border-radius:6px;border:1px solid #667085;position:relative;background:#f2f2ef;box-shadow:inset 1px 1px 3px #fff,inset -2px -2px 4px #9a9a9a}
.miniDie.black{background:#272a30;border-color:#626773;box-shadow:inset 1px 1px 3px #777,inset -2px -2px 4px #08090c}
.dot{position:absolute;width:5px;height:5px;border-radius:50%;background:#1d2026;transform:translate(-50%,-50%);top:50%;left:50%}
.black .dot{background:#e9e9e5}
.d1 .a{top:50%;left:50%}
.d2 .a{top:25%;left:25%}.d2 .b{top:75%;left:75%}
.d3 .a{top:25%;left:25%}.d3 .b{top:50%;left:50%}.d3 .c{top:75%;left:75%}
.d4 .a{top:25%;left:25%}.d4 .b{top:25%;left:75%}.d4 .c{top:75%;left:25%}.d4 .d{top:75%;left:75%}
.d5 .a{top:25%;left:25%}.d5 .b{top:25%;left:75%}.d5 .c{top:50%;left:50%}.d5 .d{top:75%;left:25%}.d5 .e{top:75%;left:75%}
.d6 .a{top:22%;left:25%}.d6 .b{top:50%;left:25%}.d6 .c{top:78%;left:25%}.d6 .d{top:22%;left:75%}.d6 .e{top:50%;left:75%}.d6 .f{top:78%;left:75%}
.boardArea{position:relative;flex:1 1 auto;min-width:0;min-height:0;background:#0c1119;overflow:hidden}
#board{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#board.dragging{cursor:grabbing}
.boardLegend{position:absolute;left:12px;top:12px;pointer-events:none;background:rgba(12,17,25,.78);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:11px;padding:7px 9px;font-size:11px;color:var(--muted)}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:5px}
.zoom button{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:rgba(23,29,40,.9);cursor:pointer}
.toastBox{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:7px;z-index:100;pointer-events:none}
.toast{background:#202938;border:1px solid #4b5a70;padding:10px 14px;border-radius:12px;box-shadow:0 10px 30px #0007;font-size:13px;animation:toast .2s ease-out;white-space:nowrap;max-width:min(96vw,560px);overflow:hidden;text-overflow:ellipsis}
.toast.winToast{white-space:normal;text-align:center;line-height:1.35}
@keyframes toast{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modalBack{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modalBack.open{display:flex}
.modal{width:min(920px,96vw);height:min(88dvh,820px);background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 25px 80px #0009;display:flex;flex-direction:column;overflow:hidden}
.modalHead{height:54px;flex:0 0 54px;padding:8px 10px 8px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.modalHead h2{margin:0;font-size:16px}.modalBtns{display:flex;gap:6px}
.modalBody{padding:14px;overflow:auto;min-height:0}
.logList{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.7;white-space:pre-wrap}
/* Game-styled scrollbars (log + help) */
.modalBody::-webkit-scrollbar,
.rulesText::-webkit-scrollbar,
.logList::-webkit-scrollbar{width:8px;height:8px}
.modalBody::-webkit-scrollbar-track,
.rulesText::-webkit-scrollbar-track,
.logList::-webkit-scrollbar-track{background:#0c1119;border-radius:8px;border:1px solid #1a2230}
.modalBody::-webkit-scrollbar-thumb,
.rulesText::-webkit-scrollbar-thumb,
.logList::-webkit-scrollbar-thumb{background:#2a3342;border-radius:8px;border:1px solid #3d4a5c}
.modalBody::-webkit-scrollbar-thumb:hover,
.rulesText::-webkit-scrollbar-thumb:hover,
.logList::-webkit-scrollbar-thumb:hover{background:#3d4a5c}
.modalBody{scrollbar-width:thin;scrollbar-color:#2a3342 #0c1119}

/* Upravený layout logu do mřížky (Grid) */
.logItem{display:grid;grid-template-columns:24px 22px 48px 1fr;gap:4px;padding:5px 7px;border-bottom:1px solid #2a3342;align-items:center}
.logItem.win{color:var(--gold);font-weight:700}
.l-num{color:var(--muted)}
.l-ic{text-align:center}
.l-die{white-space:nowrap}
.l-rest{text-align:left}
.l-sys{grid-column:1/-1;text-align:center;color:var(--muted);font-style:italic}

.rulesPage{width:100%;display:block;border:1px solid var(--line);border-radius:10px;margin:10px 0 16px}
.rulesText{line-height:1.55;font-size:13px;color:#dce2eb}
.rulesText h3{color:#fff;margin:18px 0 6px}.rulesText ul,.rulesText ol{padding-left:22px}
.dieStrip{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:10px 0}
.bigDie{width:52px;height:52px;border-radius:9px;position:relative;border:2px solid #727b89;background:#eee;box-shadow:inset 2px 2px 4px #fff,inset -3px -3px 5px #999,0 2px 5px #0006}
.bigDie.black{background:#292c33;box-shadow:inset 2px 2px 4px #747983,inset -3px -3px 5px #07080b,0 2px 5px #0009}
.bigDie .dot{width:8px;height:8px}
.diagramRow{display:flex;align-items:center;flex-wrap:nowrap;gap:8px;margin:8px 0 4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.ruleDiagram{display:inline-grid;gap:2px;background:#0c1119;padding:5px;border-radius:8px;border:1px solid var(--line);flex:0 0 auto}
.diagramArrow{align-self:center;font-size:18px;color:var(--accent);padding:0 2px;flex:0 0 auto}
.rc{width:36px;height:36px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;position:relative;box-sizing:border-box}
.rc.w{background:linear-gradient(135deg,#fff,#9b9da1);color:#171a20;border:1px solid #6c717b}
.rc.b{background:linear-gradient(135deg,#686c75,#090b0f);color:#f3f3ef;border:1px solid #858b96}
.rc.empty{background:transparent}
.rc.bad{outline:2px solid var(--danger);background:rgba(239,116,116,.12)}
.rc.good{outline:2px solid var(--green);background:rgba(99,213,154,.12)}
.rc.move{outline:2px solid var(--accent);background:rgba(113,199,255,.14)}
.rc.sel{outline:3px solid var(--gold)}
.rc .mk{position:absolute;top:-10px;right:-10px;font-size:13px;line-height:1}
.ruleCaption{font-size:12px;color:var(--muted);margin:6px 0 20px;max-width:560px}
.ruleLegend{font-size:11px;color:var(--muted);margin:2px 0 4px}
.ruleLegend b{color:var(--text)}
.infoList,.hintLegend{margin:6px 0 12px;padding-left:18px;line-height:1.7}
.infoList li,.hintLegend li{margin:2px 0}
.playbar{display:flex;align-items:center;gap:6px}.playbar button{width:36px;height:32px;border:1px solid var(--line);background:#111721;border-radius:8px;cursor:pointer}
.counter{font-variant-numeric:tabular-nums;font-size:11px;color:var(--muted);min-width:64px;text-align:center}
.aiSelect{width:100%;background:#111721;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px}
 .signalIcon{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:20px;width:24px}
.signalIcon i{display:block;width:4px;border-radius:2px;background:#5b6677;opacity:.45}
.signalIcon i:nth-child(1){height:6px}.signalIcon i:nth-child(2){height:12px}.signalIcon i:nth-child(3){height:18px}
.signalIcon.level1 i:nth-child(1),.signalIcon.level2 i:nth-child(-n+2),.signalIcon.level3 i{background:var(--accent);opacity:1;box-shadow:0 0 5px rgba(113,199,255,.35)}
.coordBadge{position:absolute;right:12px;top:12px;padding:6px 8px;border-radius:8px;background:#172131;border:1px solid var(--accent);color:var(--accent);font-size:10px;display:none;pointer-events:none}
.coordBadge.show{display:block}
@media(max-width:760px){
  .topbar{height:104px;flex-basis:104px;padding:5px 6px 7px}
  .titleRow{height:49px}.titleWrap h1{font-size:18px}.subtitle{display:none}
  .playerCounter{gap:5px;padding:6px 8px;font-size:9px;border-radius:10px}.playerCounter b{font-size:17px}.counterDie{font-size:12px}
  .menu{height:43px;gap:3px}.iconBtn{width:36px;height:36px;border-radius:10px;font-size:16px;padding:0}
  .actionDock,.playDock{bottom:12px;gap:6px;padding:6px 8px;border-radius:12px;width:min(320px, calc(100% - 16px));height:58px}
  .playDock .playbar button{width:34px;height:34px;font-size:13px}
  .playDock .closePlay{width:34px;height:34px}
  .actionBtn{width:42px;height:42px;flex:0 0 42px;font-size:20px}
  .boardLegend{top:8px;left:8px}
  .zoom{right:8px;bottom:82px}
}

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
  <div class="titleRow">
    <div class="playerCounter whiteCounter" id="whiteCounter"><span class="counterDie">⚪</span><span>BÍLÝ</span><b id="whitePoolTop">5</b></div>
    <div class="titleWrap"><h1>CUBEO</h1><div class="subtitle">6D6 · NO LUCK</div><button id="titleHit" aria-label="Souřadnice"></button></div>
    <div class="playerCounter blackCounter" id="blackCounter"><span class="counterDie">⚫</span><span>ČERNÝ</span><b id="blackPoolTop">5</b></div>
  </div>
  <nav class="menu" aria-label="Menu">
    <button class="iconBtn" id="saveBtn" title="Uložit">💾</button>
    <button class="iconBtn" id="loadBtn" title="Načíst">📂</button>
    <button class="iconBtn" id="restartBtn" title="Restart">🔄</button>
    <button class="iconBtn" id="logBtn" title="Log hry">☷</button>
    <button class="iconBtn" id="aiBtn" title="Úroveň AI" aria-label="Úroveň AI"><span id="aiSignal" class="signalIcon level3"><i></i><i></i><i></i></span></button>
    <button class="iconBtn" id="playBtn" title="Přehrávač tahů">▶</button>
    <button class="iconBtn" id="langBtn" title="Jazyk">🇬🇧</button>
    <button class="iconBtn" id="helpBtn" title="Nápověda">💡</button>
  </nav>
</header>

  <main class="main">
  <section class="boardArea">
    <canvas id="board"></canvas>
    <div class="boardLegend" id="boardLegend">CUBEO · <span data-i18n="drag">tažením posouvat desku</span></div>
    <div class="coordBadge" id="coordBadge">Souřadnice</div>
    <div class="actionDock" id="actionDock">
      <button class="actionBtn active" data-action="add" title="Přidat kostku (1× klik na kostku)">
        <span class="actIcon" aria-hidden="true">➕</span>
      </button>
      <button class="actionBtn" data-action="move" title="Přesunout kostku (2× klik na kostku)">
        <span class="actIcon" aria-hidden="true">➤</span>
      </button>
      <button class="actionBtn" data-action="merge" title="Spojit kostky (dlouhý stisk + klik na druhou)">
        <span class="actIcon" aria-hidden="true">🔗</span>
      </button>
    </div>
    <div class="playDock" id="playDock">
      <div class="playbar">
        <button id="pFirst" title="Začátek">|◀</button>
        <button id="pPrev" title="Předchozí">◀</button>
        <button id="pPlay" title="Přehrát">▶</button>
        <button id="pNext" title="Další">▶</button>
        <button id="pLast" title="Konec">▶|</button>
        <span class="counter" id="pCounter">0 / 0</span>
      </div>
      <button class="closePlay" id="closePlay" title="Zavřít přehrávač">×</button>
    </div>
    <div class="zoom"><button id="zoomOut">−</button><button id="zoomReset" title="Vycentrovat">□</button><button id="zoomIn">+</button></div>
  </section>
</main>
</div>

<div class="toastBox" id="toastBox"></div>

<div class="modalBack" id="logModal">
  <div class="modal" role="dialog">
    <div class="modalHead"><h2 data-i18n="logTitle">Herní log</h2><div class="modalBtns"><button class="iconBtn" id="copyLog" title="Kopírovat">⧉</button><button class="iconBtn closeModal" title="Zavřít">×</button></div></div>
    <div class="modalBody"><div id="logList" class="logList"></div></div>
  </div>
</div>

<div class="modalBack" id="helpModal">
  <div class="modal" role="dialog">
    <div class="modalHead"><h2 data-i18n="helpTitle">Nápověda</h2><div class="modalBtns"><button class="iconBtn closeModal" title="Zavřít">×</button></div></div>
    <div class="modalBody">
      <div class="rulesText" id="rulesText"></div>
    </div>
  </div>
</div>

<div class="modalBack" id="aiModal">
  <div class="modal" role="dialog" style="height:auto;max-height:80dvh">
    <div class="modalHead"><h2 data-i18n="aiTitle">Umělá inteligence</h2><div class="modalBtns"><button class="iconBtn closeModal">×</button></div></div>
    <div class="modalBody"><p class="rulesText" id="aiInfo"></p></div>
  </div>
</div>

<script>
'use strict';

/* =========================
   CUBEO — self-contained
   Rules implemented from Cubeo_rules.pdf:
   - two distinguishable sets of six D6
   - single formation / pinning / slide rules
   - add, move, merge
   - win by merge > 6 or blocking opponent
   ========================= */

const I18N = {
  cs:{
    turnTitle:"Na tahu",onBoard:"na desce",pool:"zásoba",actionTitle:"Akce",
    add:"Přidat kostku",addHint:"vždy hodnota 1",move:"Přesunout kostku",moveHint:"1 pole za každý pip",
    merge:"Spojit dvě kostky",mergeHint:"součet hodnot",diceTitle:"Zásoby",white:"Bílý",black:"Černý",
    aiTitle:"Umělá inteligence",howTitle:"Ovládání",
    howText:"Zvolte akci a klikněte na zvýrazněné pole. Desku lze tažením posouvat. Kliknutí na název CUBEO zobrazí souřadnice.",
    drag:"tažením posouvat desku",logTitle:"Herní log",helpTitle:"Nápověda",playTitle:"Přehrávač tahů",
    playInfo:"Během přehrávání je hrací deska zablokována. Po opuštění přehrávače se vrátíte do aktuální pozice hry.",
    whiteTurn:"Bílý",blackTurn:"Černý",aiThinking:"AI přemýšlí…",saved:"Hra uložena.",loaded:"Hra načtena.",
    noSave:"Uložená hra nebyla nalezena.",newGame:"Nová hra.",illegal:"Tento tah není podle pravidel.",
    coords:"Souřadnice",winMerge:"vítězí spojením na hodnotu",winBlock:"vítězí zablokováním soupeře",
    chooseDie:"Nejprve vyberte kostku.",noMoves:"Soupeř nemá žádný platný tah.",
    ai1:"AI 1 — mělký minimax (depth 1), základní hodnocení.",ai2:"AI 2 — minimax depth 2, sleduje hrozby spojení.",ai3:"AI 3 — minimax depth 3 + alpha-beta; agresivní závod ke spojení > 6 a blokování hrozeb.",
    addOk:"Kostka přidána.",moveOk:"Kostka přesunuta.",mergeOk:"Kostky spojeny.",
    helpHtml:`<h3>Základní informace o hře Cubeo</h3>
<p style="font-style:italic;color:var(--muted);margin-top:0">© 2016 Designer: Marek Kolcun</p>
<ul class="infoList">
<li><b>Počet hráčů:</b> 2</li>
<li><b>Věk:</b> 7+</li>
<li><b>Doba hraní:</b> 5–15 min</li>
<li><b>Komponenty:</b> 2 sady (6 ks) D6 kostek ve dvou odlišných barvách</li>
</ul>

<h3>Cíl hry</h3>
<p>Kostkami se nehází — hodnota kostky určuje délku přesunu, při spojení kostek se hodnoty sčítají. Vyhrajete, když jako první <b>spojíte dvě kostky na hodnotu větší než 6</b> (součet dá 7 a více). Výsledná kostka zobrazí svou hodnotu a na jejím poli bliká pohár. Prohrajete, když nemáte žádný platný tah.</p>
<p class="ruleLegend">Spojení = sečtete hodnoty dvou sousedních vlastních kostek. Jedna zůstane na desce s novou hodnotou, druhá se vrátí do zásoby.</p>
<div class="diagramRow">
  <div class="ruleDiagram" style="grid-template-columns:repeat(3,36px)">
    <div class="rc empty"></div><div class="rc w sel">4</div><div class="rc empty"></div>
    <div class="rc w">1</div><div class="rc w sel">3</div><div class="rc empty"></div>
    <div class="rc empty"></div><div class="rc empty"></div><div class="rc empty"></div>
  </div>

function clone(o){return JSON.parse(JSON.stringify(o))}
function boardEntries(s=state){if(!s||!s.board)return [];return Object.entries(s.board).map(([k,d])=>{let [x,y]=parseKey(k);return {x,y,...d,key:k}})}
function occupied(s=state){return new Set(Object.keys(s.board))}
function neighbors(x,y){return DIRS.map(([dx,dy])=>[x+dx,y+dy])}
function sideAdjacent(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y)===1}

function connectedAfterRemove(s,key){
  const keys=Object.keys(s.board).filter(k=>k!==key);
  if(keys.length<=1)return true;
  const seen=new Set([keys[0]]), q=[keys[0]];
  while(q.length){
    const k=q.shift(),[x,y]=parseKey(k);
    for(const [nx,ny] of neighbors(x,y)){
      const nk=KEY(nx,ny);
      if(nk!==key && s.board[nk] && !seen.has(nk)){seen.add(nk);q.push(nk)}
    }
  }
  return seen.size===keys.length;
}
function canSlideOut(s,key){
  const [x,y]=parseKey(key);
  const occ=occupied(s); occ.delete(key);
  for(const [dx,dy] of DIRS){
    let cx=x+dx,cy=y+dy;
    let clear=true;
    while(Math.abs(cx)<=60 && Math.abs(cy)<=60){
      if(occ.has(KEY(cx,cy))){clear=false;break}
      // Once outside a practical formation envelope, the ray is open.
      if(Math.abs(cx)>12 || Math.abs(cy)>12)break;
      cx+=dx;cy+=dy;
    }
    if(clear)return true;
  }
  return false;
}
function removable(s,key){return connectedAfterRemove(s,key)&&canSlideOut(s,key)}

function canSlideIn(s,x,y){
  const candidate=KEY(x,y);
  if(s.board[candidate])return false;
  // The added die must be able to slide straight into the formation from
  // at least one side without crossing another die.
  for(const [dx,dy] of DIRS){
    let cx=x+dx,cy=y+dy,clear=true;
    while(Math.abs(cx)<=60 && Math.abs(cy)<=60){
      if(s.board[KEY(cx,cy)]){clear=false;break}
      cx+=dx;cy+=dy;
    }
    if(clear)return true;
  }
  return true;
}
function legalAdd(s,player){
  if(s.pool[player]<=0)return [];
  const own=boardEntries(s).filter(d=>d.owner===player);
  const opp=player===1?2:1;
  const out=[];
  const seen=new Set();
  for(const d of own){
    for(const [x,y] of neighbors(d.x,d.y)){
      const k=KEY(x,y);
      if(seen.has(k)||s.board[k])continue;
      let touchesOwn=false,touchesOpp=false;
      for(const [nx,ny] of neighbors(x,y)){
        const q=s.board[KEY(nx,ny)];
        if(q){if(q.owner===player)touchesOwn=true;else touchesOpp=true}
      }
      if(touchesOwn&&!touchesOpp&&canSlideIn(s,x,y)){out.push({type:"add",x,y});seen.add(k)}
    }
  }

  // - final cell must touch the formation by SIDE (so the die reconnects properly)
  // - simple path (no cell revisited)
  // - destination ≠ start; final formation stays orthogonally connected
  const out=[];

  }else if(a.type==="merge"){
    const A=ns.board[a.from],B=ns.board[a.to];
    const sum=A.value+B.value;
    // Prefer removing "from" if it is removable; otherwise remove "to".
    let remove=a.from,keep=a.to;
    if(!removable(s,remove)&&removable(s,a.to)){remove=a.to;keep=a.from}

/** Best immediate merge sum available to player (0 if none). */
function bestMergeSum(s, player){
  let best=0;
  const own=boardEntries(s).filter(d=>d.owner===player);
  if(Object.keys(s.board).length<3) return 0;
  for(const a of own){
    for(const [x,y] of neighbors(a.x,a.y)){
      const bk=KEY(x,y), b=s.board[bk];
      if(!b||b.owner!==player||a.key>=bk) continue;
      if(removable(s,a.key)||removable(s,bk)){

function evaluate(s,root){
  if(s.gameOver) return s.winner===root ? 100000 : -100000;

  const myDice=boardEntries(s).filter(d=>d.owner===root);
  const opDice=boardEntries(s).filter(d=>d.owner===op);
  const myValue=myDice.reduce((n,d)=>n+d.value,0);
  const opValue=opDice.reduce((n,d)=>n+d.value,0);
  const myMax=myDice.reduce((n,d)=>Math.max(n,d.value),0);
  const opMax=opDice.reduce((n,d)=>Math.max(n,d.value),0);
  const myMerge=bestMergeSum(s,root);
  const opMerge=bestMergeSum(s,op);

  // Immediate tactical threats
  if(myMerge>6) return 90000 + myMerge;          // can win now
  if(opMerge>6) return -85000 - opMerge;         // opponent wins next if we pass

  let score=0;
  // Race to high single die (path to merge > 6)
  score += myMax * 55;

  score += myValue * 6;

  if(opMax>=4) score -= opMax * 25;

}
function orderActions(s,actions,root){

    else if(a.type==="merge") score += a.sum * 80 + (a.sum>=5 ? 40 : 0);
    // Moves that free/position high dice
    if(a.type==="move") score += a.value * 6;
    if(a.type==="add") score += 8;
    const ns=applyAction(s,a);
    if(ns.gameOver && ns.winner===root) score += 100000;
    // After our move, does opponent still threaten a winning merge?

      else score -= threat * 20;
      score += bestMergeSum(ns, root) * 25;

  moves=orderActions(s,moves,root).slice(0,cap);

  if(maximizing){
    let value=-Infinity;
    for(const a of moves){
      const ns=applyAction(s,a);
      const r=minimax(ns,depth-1,alpha,beta,false,root).score;

      const r=minimax(ns,depth-1,alpha,beta,true,root).score;
      if(r<value){value=r;best=a}

async function aiTurn(){
  if(state.gameOver||state.player!==2||playback)return;
  try{
    toast(I18N[lang].aiThinking);
    await new Promise(r=>setTimeout(r,80));
    const depth=Math.max(1, Math.min(3, Number(aiLevel)||3));
    const result=minimax(clone(state),depth,-Infinity,Infinity,true,2);
    const a=result && result.action;
    if(!a){
      state.gameOver=true;state.winner=1;state.winPair=null;state.winSum=null;
      const msg=winLogLine(state);
      addLog(msg);history.push({label:msg,state:clone(state)});renderAll();announceWin(state);return;
    }
    const p=state.player;
    enrichAction(state,a,p);
    state=applyAction(state,a);
    log.push(actionLabel(a,p));
    history.push({label:actionLabel(a,p),state:clone(state)});
    if(state.gameOver){
      const line=winLogLine(state);
      addLog(line);
      history.push({label:line,state:clone(state)});
      renderAll();
      announceWin(state);
      return;
    }
    checkBlocked(state);

  }catch(err){
    console.error("AI error", err);

  }
}

function resize(){

function cellSize(){return Math.min(64,Math.max(34,Math.min(board.clientWidth,board.clientHeight)/11))*camera.zoom}

function draw(){
  if(!ctx||!state)return;

    ctx.save();ctx.fillStyle=h.kind==="add"?"rgba(99,213,154,.22)":h.kind==="merge"?"rgba(242,201,109,.24)":"rgba(113,199,255,.22)";
    ctx.strokeStyle=h.kind==="add"?"rgba(99,213,154,.7)":h.kind==="merge"?"rgba(242,201,109,.75)":"rgba(113,199,255,.75)";
    ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(p.x+3,p.y+3,s-6,s-6,8);ctx.fill();ctx.stroke();ctx.restore();
  }
  for(const d of boardEntries()){
    const p=worldToScreen(d.x,d.y);
    const k=d.key;
    const isWin=!!(state.winPair && state.winPair.includes(k));
    const isPinned=!isWin && !removable(state,k);
    if(isWin){
      // Blink: alternate player-coloured die with value ↔ trophy
      const showTrophy = Math.floor(performance.now()/550) % 2 === 1;
      if(showTrophy){
        drawWinTrophy(p.x, p.y, cs, d.owner);
      }else{
        drawDie(p.x,p.y,cs,d.owner,d.value,false,false,true,false);
      }
    }else{
      drawDie(p.x,p.y,cs,d.owner,d.value,selected===k,false,false,isPinned);
    }
    if(coords){
      // slight offset down+right from the corner; black bold on white dice
      const cx=p.x+cs*0.14, cy=p.y+cs*0.28;
      if(d.owner===1){
        ctx.fillStyle="#12151c";
        ctx.font="bold 10px ui-monospace,monospace";
      }else{
        ctx.fillStyle="rgba(225,232,241,.85)";
        ctx.font="10px ui-monospace,monospace";
      }
      ctx.fillText(`${d.x},${d.y}`,cx,cy);
    }
  }
  const op=worldToScreen(0,0);
  if(coords){
    ctx.fillStyle="rgba(190,202,219,.62)";ctx.font="9px ui-monospace,monospace";
    const range=Math.ceil(Math.max(W,H)/cs)+2;
    const cc=screenToWorld(W/2,H/2);
    for(let x=cc.x-range;x<=cc.x+range;x++)for(let y=cc.y-range;y<=cc.y+range;y++){
      const p=worldToScreen(x,y);
      if(p.x+cs<0||p.x>W||p.y+cs<0||p.y>H)continue;
      ctx.fillText(`${x},${y}`,p.x+4,p.y+11);
    }
  }
}
function getHints(){
  if(!state||playback||state.gameOver||state.player!==1)return [];
  const all=legalMoves(state,1),out=[];
  if(actionMode==="add")for(const a of all)if(a.type==="add")out.push({x:a.x,y:a.y,kind:"add"});
  if(actionMode==="move"){
    if(selected){
      for(const a of all)if(a.type==="move"&&a.from===selected) {const [x,y]=parseKey(a.to);out.push({x,y,kind:"move"})}
    }else{
      for(const a of all)if(a.type==="move"){const [x,y]=parseKey(a.from);out.push({x,y,kind:"move"})}
    }
  }
  if(actionMode==="merge"){
    if(selected){
      for(const a of all)if(a.type==="merge"&&(a.from===selected||a.to===selected)){
        const k=a.from===selected?a.to:a.from,[x,y]=parseKey(k);out.push({x,y,kind:"merge"});
      }
    }else{
      for(const a of all)if(a.type==="merge"){const [x,y]=parseKey(a.from);out.push({x,y,kind:"merge"});const [x2,y2]=parseKey(a.to);out.push({x:x2,y:y2,kind:"merge"})}
    }
  }
  const m=new Map();out.forEach(x=>m.set(KEY(x.x,x.y),x));return [...m.values()];
}

/* Gesture / command layer
   - 1× click on own die     → add mode (hint fields to place a new die)
   - 2× click on own die     → move mode for that die (hint destinations)
   - long-press on own die   → merge mode for that die (then click partner)
   Action buttons still switch modes manually.
*/
let pendingSingle=null; // {key, timer}
let longPress={timer:null, key:null, fired:false};
const DBL_MS=300;
const LONG_MS=480;
function clearPendingSingle(){
  if(pendingSingle){clearTimeout(pendingSingle.timer);pendingSingle=null}
}
function clearLongPress(){
  if(longPress.timer){clearTimeout(longPress.timer);longPress.timer=null}
  longPress.key=null; longPress.fired=false;
}
function setActionMode(mode, sel=null){
  actionMode=mode;
  selected=sel;
  clearPendingSingle();
  renderSide();
  draw();
}
function tryStartLongPress(clientX, clientY){
  clearLongPress();
  if(playback||state.gameOver||state.player!==1)return;
  const r=board.getBoundingClientRect();
  const w=screenToWorld(clientX-r.left, clientY-r.top);
  const k=KEY(w.x,w.y);
  const die=state.board[k];
  if(!die || die.owner!==1) return;
  longPress.key=k;
  longPress.fired=false;
  longPress.timer=setTimeout(()=>{
    longPress.timer=null;
    longPress.fired=true;
    // Long-press → merge mode
    clearPendingSingle();
    const all=legalMoves(state,1);
    const canMerge=all.some(x=>x.type==="merge"&&(x.from===k||x.to===k));
    if(!canMerge){
      toast(lang==="cs"
        ?"Tuto kostku nelze použít ke spojení (soused + aspoň jedna volná, ≥3 kostky na desce)."
        :"This die cannot be used in a merge (need adjacent free partner, ≥3 dice on board).");
      setActionMode("add",null);
      return;
    }
    setActionMode("merge",k);
    toast(lang==="cs"?"Spojení: klikněte na sousední vlastní kostku.":"Merge: click an adjacent friendly die.");
  }, LONG_MS);
}
function handleBoardTap(e){
  if(playback||state.gameOver||state.player!==1)return;
  // If long-press already fired, ignore the following click
  if(longPress.fired){ clearLongPress(); return; }
  clearLongPress();
  const r=board.getBoundingClientRect(),w=screenToWorld(e.clientX-r.left,e.clientY-r.top),k=KEY(w.x,w.y);
  const all=legalMoves(state,1);
  const die=state.board[k];

  // --- Click on own die ---
  if(die && die.owner===1){
    // Merge mode: second die
    if(selected && actionMode==="merge"){
      clearPendingSingle();
      if(selected===k){ return; }
      const merge=all.find(x=>x.type==="merge"&&((x.from===selected&&x.to===k)||(x.to===selected&&x.from===k)));
      if(merge){execute(merge);selected=null;renderSide();return}
      toast(lang==="cs"
        ? "Tyto kostky nelze spojit (musí sousedit, aspoň jedna volná)."
        : "These dice cannot be merged (must be adjacent, at least one free).");
      return;
    }
    // Move mode with selection: second die used to mean merge only via long-press now
    if(selected && actionMode==="move" && selected!==k){
      clearPendingSingle();
      // Allow merge as convenience if legal, else toast
      const merge=all.find(x=>x.type==="merge"&&((x.from===selected&&x.to===k)||(x.to===selected&&x.from===k)));
      if(merge){execute(merge);selected=null;renderSide();return}
      toast(lang==="cs"?"Pro spojení použijte dlouhý stisk na kostku.":"Use a long-press on a die to merge.");
      return;
    }
    // Double-click same die → move mode
    if(pendingSingle && pendingSingle.key===k){
      clearPendingSingle();
      const canMove=all.some(x=>x.type==="move"&&x.from===k);
      if(!canMove){
        toast(lang==="cs"?"Tuto kostku nelze přesunout (je připnutá nebo nemá platnou cestu).":"This die cannot move (pinned or no legal path).");
        setActionMode("add",null);
        return;
      }
      setActionMode("move",k);
      return;
    }
    // First click: wait for possible double, then fall back to add mode
    clearPendingSingle();
    pendingSingle={
      key:k,
      timer:setTimeout(()=>{
        pendingSingle=null;
        setActionMode("add",null);
      }, DBL_MS)
    };
    return;
  }

  // --- Empty / other cell: execute current mode ---
  clearPendingSingle();
  if(actionMode==="add"){
    const a=all.find(x=>x.type==="add"&&x.x===w.x&&x.y===w.y);
    if(a){execute(a);return}
    return;
  }
  if(actionMode==="move"){
    if(selected){
      const a=all.find(x=>x.type==="move"&&x.from===selected&&x.to===k);
      if(a){execute(a);selected=null;renderSide();return}
      toast(I18N[lang].illegal);
    }else{
      toast(lang==="cs"?"Nejdřív 2× klikněte na kostku k přesunu.":"Double-click a die to move first.");
    }
    return;
  }
  if(actionMode==="merge"){
    if(selected){
      toast(lang==="cs"?"Klikněte na sousední vlastní kostku ke spojení.":"Click an adjacent friendly die to merge.");
    }else{
      toast(lang==="cs"?"Dlouhý stisk na kostku zahájí spojení.":"Long-press a die to start a merge.");
    }
  }
}

/* =========================
   Board pointer / touch handling
   Single finger/mouse = pan + click.
   Two fingers = pinch zoom, with the zoom anchor kept under the fingers.
   ========================= */
const pointers=new Map();
let gesture={
  mode:"none", moved:false, x:0,y:0,sx:0,sy:0,
  pinchStartDistance:0,pinchStartZoom:1,pinchWorldX:0,pinchWorldY:0
};
function pointerPoint(e){
  const r=board.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}
function pointerDistance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function pointerMidpoint(a,b){return {x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
function beginPinch(){
  const pts=[...pointers.values()];
  if(pts.length<2)return;
  const a=pts[0],b=pts[1],mid=pointerMidpoint(a,b);
  const w=screenToWorld(mid.x,mid.y),cs=cellSize();
  // Keep the exact world point under the initial finger midpoint fixed.
  gesture.mode="pinch";
  gesture.moved=true;
  gesture.pinchStartDistance=Math.max(1,pointerDistance(a,b));
  gesture.pinchStartZoom=camera.zoom;
  gesture.pinchWorldX=w.x+(mid.x-(board.clientWidth/2+camera.x))/cs;
  gesture.pinchWorldY=w.y+(mid.y-(board.clientHeight/2+camera.y))/cs;
}
function updatePinch(){
  const pts=[...pointers.values()];
  if(pts.length<2)return;
  const a=pts[0],b=pts[1],mid=pointerMidpoint(a,b);
  const dist=pointerDistance(a,b);
  const z=Math.max(.65,Math.min(1.8,gesture.pinchStartZoom*(dist/gesture.pinchStartDistance)));
  camera.zoom=z;
  const cs=cellSize();
  camera.x=mid.x-board.clientWidth/2-gesture.pinchWorldX*cs;
  camera.y=mid.y-board.clientHeight/2-gesture.pinchWorldY*cs;
  draw();
}
board.addEventListener("pointerdown",e=>{
  if(playback)return;
  const p=pointerPoint(e);
  pointers.set(e.pointerId,p);
  try{board.setPointerCapture(e.pointerId)}catch(_){ }
  if(pointers.size>=2){clearLongPress();beginPinch();board.classList.remove("dragging");return}
  gesture={mode:"pan",moved:false,x:p.x,y:p.y,sx:p.x,sy:p.y,pinchStartDistance:0,pinchStartZoom:camera.zoom,pinchWorldX:0,pinchWorldY:0};
  board.classList.add("dragging");
  tryStartLongPress(e.clientX, e.clientY);
});
board.addEventListener("pointermove",e=>{
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,pointerPoint(e));
  if(pointers.size>=2){
    if(gesture.mode!=="pinch")beginPinch();
    updatePinch();
    return;
  }
  if(gesture.mode!=="pan")return;
  const p=pointers.get(e.pointerId);
  const dx=p.x-gesture.x,dy=p.y-gesture.y;
  if(Math.abs(p.x-gesture.sx)+Math.abs(p.y-gesture.sy)>6){
    gesture.moved=true;
    clearLongPress(); // cancel long-press when panning
  }
  camera.x+=dx;camera.y+=dy;gesture.x=p.x;gesture.y=p.y;draw();
});
function finishPointer(e,cancel=false){
  const p=pointers.get(e.pointerId);
  const wasSingle=pointers.size===1 && gesture.mode==="pan";
  const longFired=longPress.fired;
  const shouldClick=wasSingle&&!cancel&&!gesture.moved&&!longFired;
  pointers.delete(e.pointerId);
  if(pointers.size===0){
    board.classList.remove("dragging");
    if(shouldClick)handleBoardTap(e);
    else clearLongPress();
    if(longFired) clearLongPress();
    gesture.mode="none";
  }else if(pointers.size===1){
    clearLongPress();
    // Do not generate a click after a pinch. Continue with a fresh pan
    // reference if the user keeps one finger on the board.
    const q=[...pointers.values()][0];
    gesture.mode="pan";gesture.moved=true;gesture.x=q.x;gesture.y=q.y;gesture.sx=q.x;gesture.sy=q.y;
  }
}
board.addEventListener("pointerup",e=>finishPointer(e,false));
board.addEventListener("pointercancel",e=>finishPointer(e,true));
board.addEventListener("pointerleave",()=>{});

function stopPlayback(){if(playTimer){clearInterval(playTimer);playTimer=null}playback=false;$("pPlay").textContent="▶"}
function showPlayback(){
  if(!history.length){toast(lang==="cs"?"Žádné tahy k přehrání.":"No moves to replay.");return}
  playback=true;playIndex=0;
  $("actionDock").style.display="none";

  $("playBtn").classList.add("active");

}
function updatePlayback(){
  const max=Math.max(0,history.length-1);playIndex=Math.max(0,Math.min(playIndex,max));
  $("pCounter").textContent=`${playIndex} / ${max}`;
  const snap=history[playIndex];if(snap){state=clone(snap.state);renderSide();renderLog();draw()}
}

  $("actionDock").style.display="";
  $("playBtn").classList.remove("active");

}

function togglePlayback(){
  if(!playback){showPlayback();return}
  if(playTimer){clearInterval(playTimer);playTimer=null;$("pPlay").textContent="▶"}
  else{
    $("pPlay").textContent="Ⅱ";
    playTimer=setInterval(()=>{
      if(playIndex>=history.length-1){clearInterval(playTimer);playTimer=null;$("pPlay").textContent="▶";return}
      playIndex++;updatePlayback();
    },650);
  }
}

function resetBoardView(){

function changeZoomAt(factor,anchorX=board.clientWidth/2,anchorY=board.clientHeight/2){
  const oldCs=cellSize();
  const ox=board.clientWidth/2+camera.x,oy=board.clientHeight/2+camera.y;
  const wx=(anchorX-ox)/oldCs,wy=(anchorY-oy)/oldCs;
  camera.zoom=Math.max(.65,Math.min(1.8,camera.zoom*factor));
  const cs=cellSize();
  camera.x=anchorX-board.clientWidth/2-wx*cs;
  camera.y=anchorY-board.clientHeight/2-wy*cs;
  draw();
}

  if(state && !state.gameOver && state.player===2) setTimeout(aiTurn, 200);
});
(function winPulseLoop(){
  if(state && state.gameOver && state.winPair && state.winPair.length) draw();
  requestAnimationFrame(winPulseLoop);
})();

</script>
