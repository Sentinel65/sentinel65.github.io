<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ni-Ju 二十</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ece5d3;
  --paper-deep:#e1d8c0;
  --board-bg:#d9cfb2;
  --board-line:#c3b795;
  --ink:#232a2e;
  --ink-soft:#5b6570;
  --line:#c0b493;
  --accent:#b5392c;
  --accent-soft:#c96a5a;
  --accent-glow:rgba(181,57,44,.45);
  --tile-w-bg:#faf7ee;
  --tile-w-border:#c7bc9c;
  --tile-w-ink:#2a2a28;
  --tile-b-bg:#24262b;
  --tile-b-border:#45464b;
  --tile-b-ink:#e9e6dc;
  --panel:#f5f0e2;
  --panel-border:#d3c7a3;
  --shadow:0 6px 18px rgba(35,25,10,.18);
  --radius:14px;
  font-size:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 15% -10%, #f4eeda 0%, transparent 60%),
    var(--paper);
  color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  overscroll-behavior:none;
  overflow:hidden;
}
.app{
  height:100vh; height:100dvh;
  display:flex; flex-direction:column;
}

/* ---------- Header ---------- */
.topbar{
  display:flex; align-items:center; justify-content:center; gap:8px;
  padding:8px 8px calc(8px + env(safe-area-inset-top,0)) 8px;
  padding-top:calc(8px + env(safe-area-inset-top,0));
  background:linear-gradient(180deg, var(--panel), var(--paper-deep));
  border-bottom:1px solid var(--line);
  flex-wrap:nowrap;
  overflow-x:auto; overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  position:relative; z-index:20;
}
.topbar::-webkit-scrollbar{ display:none; }
.brand{
  display:flex; align-items:baseline; justify-content:center; gap:5px;
  user-select:none;
  flex: 1 1 0;
}
.brand .latin{
  font-family:'Noto Serif JP',serif; font-weight:700;
  font-size:1.18rem; letter-spacing:.02em; color:var(--ink); white-space:nowrap;
}
.brand .kanji{
  font-family:'Noto Serif JP',serif; font-weight:500;
  font-size:.98rem; color:var(--accent); white-space:nowrap;
}
.iconbtn{
  width:44px; height:44px; border-radius:12px; flex:none;
  border:1px solid var(--panel-border);
  background:var(--panel);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:var(--ink);
  transition:transform .12s ease, background .15s ease;
}
.iconbtn:active{ transform:scale(.9); }
.iconbtn.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
.iconbtn svg{ width:22px; height:22px; }

/* ---------- Status bar ---------- */
.statusbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:7px 14px; font-size:.9rem; color:var(--ink-soft);
  background:var(--paper-deep); border-bottom:1px solid var(--line);
  min-height:44px;
}
.status-left{
  display:flex;
  align-items:center;
  gap:8px;
  flex: 1 1 0;
  min-width:0;
}

.status-right{
  display:flex;
  align-items:center;
  gap:8px;
  justify-content:flex-end;
  flex: 1 1 0;
  min-width:0;
}

.statusbar .dot{
  width:20px;
  height:20px;
  border-radius:4px;
  flex:none;
  border:2px solid var(--line);
}

.dot.w{ background:var(--tile-w-bg); border-color:var(--tile-w-border); }
.dot.b{ background:var(--tile-b-bg); border-color:var(--tile-b-border); }

.statusbar .turncount{
  display:none;
}

#scoreCounter{
  font-weight:bold;
  color:var(--accent);
  margin-left:0;
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* ---------- Board ---------- */
.boardscroll{
  flex:1; overflow:auto; position:relative;
  background:
    repeating-linear-gradient(0deg, transparent 0 41px, rgba(0,0,0,.02) 41px 42px),
    repeating-linear-gradient(90deg, transparent 0 41px, rgba(0,0,0,.02) 41px 42px),
    var(--board-bg);
  touch-action:pan-x pan-y;
}

.board{ position:relative; }

.cell{ position:absolute; border-radius:0; }

.cell.legal{
  background:rgba(120,120,120,.14);
  border:2px dashed #8a8a8a;
  animation:pulse 1.6s ease-in-out infinite;
  cursor:pointer;
}

.cell.origin {
  background: rgba(64, 224, 208, 0.14);
  border: 2px dashed #40e0d0;
  pointer-events: none;
}

@keyframes pulse{
  0%,100%{opacity:.55}
  50%{opacity:1}
}

.tile{
  position:absolute;
  cursor:default;
  transition:left .18s ease, top .18s ease, transform .15s ease;
}

.tile svg{
  display:block;
  width:100%;
  height:100%;
}

.tile.movable{ cursor:pointer; }
.tile.selected svg > rect:first-of-type { fill: #fff59d !important; transition: fill 0.2s ease; }

@keyframes stamp{
  0%{ transform:scale(1.5) rotate(-8deg); opacity:0; }
  60%{ transform:scale(.95) rotate(2deg); opacity:1; }
  100%{ transform:scale(1) rotate(0); }
}

.tile.winning{ z-index:7; animation:stamp .6s ease; filter:drop-shadow(0 0 8px rgba(46,158,79,.45)); }
.tile.winning::before{
  content:''; position:absolute; inset:2px; border-radius:0; border:3px solid #2e9e4f; pointer-events:none;
  box-shadow: 0 0 0 2px rgba(46,158,79,.22), 0 0 10px rgba(46,158,79,.65), 0 0 24px rgba(46,158,79,.45);
  animation:winGlow 1.1s ease-in-out infinite;
}
.tile.winning.static::before { animation: none !important; }

.tile.winpart{ z-index:6; }
.tile.winpart:not(.winning)::after{
  content:''; position:absolute; inset:2px; border-radius:0; border:3px solid #e0b400; pointer-events:none;
  box-shadow: 0 0 0 2px rgba(224,180,0,.18), 0 0 8px rgba(224,180,0,.55), 0 0 18px rgba(224,180,0,.38);
  animation:partGlow 1.4s ease-in-out infinite; z-index:6;
}
.tile.winpart.static:not(.winning)::after { animation: none !important; }

@keyframes winGlow{
  0%,100%{ transform:scale(1); box-shadow: 0 0 0 2px rgba(46,158,79,.18), 0 0 8px rgba(46,158,79,.45), 0 0 18px rgba(46,158,79,.28); }
  50%{ transform:scale(1.05); box-shadow: 0 0 0 3px rgba(46,158,79,.34), 0 0 18px rgba(46,158,79,.85), 0 0 36px rgba(46,158,79,.60); }
}

@keyframes partGlow{
  0%,100%{ transform:scale(1); box-shadow: 0 0 0 2px rgba(224,180,0,.16), 0 0 6px rgba(224,180,0,.34), 0 0 14px rgba(224,180,0,.22); }
  50%{ transform:scale(1.02); box-shadow: 0 0 0 3px rgba(224,180,0,.28), 0 0 14px rgba(224,180,0,.72), 0 0 28px rgba(224,180,0,.48); }
}

.tile.blocked::after{
  content:''; position:absolute; inset:2px; border-radius:0; border:3px solid var(--accent); pointer-events:none;
}

.tile.unmovable-split::after{
  content:''; position:absolute; inset:2px; border-radius:0; border:3px solid lightblue; pointer-events:none; z-index: 5;
}
.tile.unmovable-split.blocked::after {
  border: 3px solid lightblue; box-shadow: inset 0 0 0 3px var(--accent);
}

.tile.appear{ animation:appear .22s ease; }
@keyframes appear{ from{ transform:scale(.4); opacity:0; } to{ transform:scale(1); opacity:1; } }

.last-placed-marker{
  position:absolute; top:38%; left:38%; width:24%; height:24%; background-color:lightblue; border-radius:50%; opacity:.85; pointer-events:none; z-index:10;
}

/* ---------- Tray ---------- */
.tray-wrap{
  border-top:1px solid var(--line); background:var(--panel);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom,0)) 8px; display:none;
}
.tray-wrap.show{ display:block; }
.tray{
  display:flex; gap:8px; overflow-x:auto; padding:2px 2px 6px 2px; scroll-snap-type:x proximity;
}
.tray::-webkit-scrollbar{ height:5px; }
.tray::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }
.traytile{
  flex:none; width:56px; height:56px; cursor:pointer; border-radius:0;
  scroll-snap-align:start; transition:transform .12s ease; border:2px solid transparent;
}
.traytile.sel{ border-color:var(--accent); transform:translateY(-4px); }
.traytile:active{ transform:scale(.92); }
/* Změna chování pro dotyk v disabled stavu */
.traytile.disabled{ opacity:0.35; cursor:default; }
.traytile.disabled:active{ transform:none; }

/* ---------- Modals ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(30,22,12,.5); display:none; align-items:center; justify-content:center; z-index:50; padding:18px; backdrop-filter:blur(2px);
}
.overlay.show{ display:flex; animation:fadein .18s ease; }
@keyframes fadein{ from{opacity:0} to{opacity:1} }
.modal{
  background:var(--panel); border-radius:18px; box-shadow:var(--shadow); max-width:560px; width:100%; max-height:86vh; display:flex; flex-direction:column; border:1px solid var(--panel-border);
}
.modal-head{
  display:flex; align-items:center; gap:10px; padding:16px 18px 8px 18px; border-bottom:1px solid var(--line);
}
.modal-head h2{ font-family:'Noto Serif JP',serif; font-size:1.25rem; margin:0; flex:1; color:var(--ink); }
.modal-body{ padding:14px 18px 20px 18px; overflow-y:auto; line-height:1.55; font-size:.94rem; }
.modal-body h3{ font-size:1.05rem; margin:20px 0 6px; color: #d32f2f; font-weight: 700; }
.modal-body p{ margin:6px 0; }
.copyright-line{
  font-style:italic; color:var(--ink-soft); font-size:.82rem; margin:2px 0 14px 0; border-left:3px solid var(--accent-soft); padding-left:10px;
}
.modal .closebtn{
  width:34px; height:34px; border-radius:9px; border:none; background:var(--paper-deep); cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.logline{
  padding:6px 0; border-bottom:1px dashed var(--line); font-size:.86rem; display:flex; align-items:center; gap:8px;
}
.logline.system{ color: var(--ink); font-weight: 600; }
.logline:last-child{ border-bottom:none; }
.logline b{ font-variant-numeric:tabular-nums; color:var(--ink-soft); }
.logcoords{ font-variant-numeric:tabular-nums; color:var(--ink-soft); white-space:nowrap; }
.logtile{ width:30px; height:30px; line-height:0; }
.lognote{ color:var(--accent); font-style:italic; font-size:.82rem; }

/* winner banner */
.winbanner{ text-align:center; }
.winbanner .big{ font-family:'Noto Serif JP',serif; font-size:1.7rem; margin:10px 0 4px; }
.winbanner .sub{ color:var(--ink-soft); margin-bottom:16px; font-weight:bold; }
.winbanner .actions{ display:flex; gap:10px; justify-content:center; }
.btnprimary{
  background:var(--accent); color:#fff; border:none; padding:11px 20px; border-radius:11px; font-weight:600; cursor:pointer; font-size:.92rem;
}
.btnghost{
  background:transparent; color:var(--ink); border:1px solid var(--panel-border); padding:11px 20px; border-radius:11px; cursor:pointer; font-size:.92rem;
}

/* toast */
.toast{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:11px;
  font-size:.86rem; opacity:0; pointer-events:none; transition:all .25s ease; z-index:80;
  text-align: center; max-width: 90%;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

/* stats table */
.stats-table { width: 100%; border-collapse: collapse; margin-top: 10px; table-layout: fixed; }
.stats-table th, .stats-table td { border: 1px solid var(--line); padding: 8px 4px; text-align: center; }
.stats-table th { background: var(--paper-deep); color: var(--ink-soft); font-weight: 600; vertical-align: middle; }
.stats-table th svg { width: 20px; height: 20px; display: block; margin: 0 auto; color: var(--ink); }
.stats-table td { font-variant-numeric: tabular-nums; font-weight: 500; }

@media (max-width:480px){
  :root{ font-size:15px; }
  .topbar{ gap:4px; padding-left:2px; padding-right:2px; }
  .iconbtn{ width:34px; height:34px; border-radius:10px; }
  .iconbtn svg{ width:18px; height:18px; }
  .stats-table th, .stats-table td { padding: 6px 2px; }
}
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001s !important; transition-duration:.001s !important; }
}
</style>
</head>
<body>
<div class="app">

  <div class="topbar" id="topbar">
    <button class="iconbtn" id="btnModeToggle" title="Mode"></button>
    <button class="iconbtn" id="btnNew" title="New game"></button>
    <button class="iconbtn" id="btnSave" title="Save"></button>
    <button class="iconbtn" id="btnLoad" title="Load"></button>
    <button class="iconbtn" id="btnLog" title="Log"></button>
    <button class="iconbtn" id="btnStats" title="Statistics"></button>
    <button class="iconbtn" id="btnDiffToggle" title="Difficulty"></button>
    <button class="iconbtn" id="btnLangToggle" title="Language"></button>
    <button class="iconbtn" id="btnHelp" title="Help"></button>
  </div>

  <div class="statusbar" id="statusbar">
    <div class="status-left">
      <span class="dot w" id="turnDot"></span>
      <span class="turncount" id="turnCount"></span>
      <span id="scoreCounter"></span>
    </div>
    <div class="brand"><span class="latin">Ni-Ju</span><span class="kanji">二十</span></div>
    <div class="status-right">
      <button class="iconbtn" id="btnZoomOut" style="width:36px;height:36px;border-radius:8px;"></button>
      <button class="iconbtn" id="btnZoomIn" style="width:36px;height:36px;border-radius:8px;"></button>
    </div>
  </div>

  <div class="boardscroll" id="boardscroll">
    <div class="board" id="board"></div>
  </div>

  <div class="tray-wrap" id="trayWrap">
    <div class="tray" id="tray"></div>
  </div>
</div>

<!-- Help modal -->
<div class="overlay" id="helpOverlay">
  <div class="modal">
    <div class="modal-head"><h2 id="helpTitle"></h2><button class="closebtn" data-close="help"></button></div>
    <div class="modal-body" id="helpBody"></div>
  </div>
</div>

<!-- Log modal -->
<div class="overlay" id="logOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="logTitle"></h2>
      <button class="closebtn" id="btnCopyLog"></button>
      <button class="closebtn" data-close="log"></button>
    </div>
    <div class="modal-body" id="logBody"></div>
  </div>
</div>

<!-- Stats modal -->
<div class="overlay" id="statsOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="statsTitle"></h2>
      <button class="closebtn" data-close="stats"></button>
    </div>
    <div class="modal-body" id="statsBody"></div>
  </div>
</div>

<!-- Winner modal -->
<div class="overlay" id="winOverlay">
  <div class="modal">
    <div class="modal-body winbanner">
      <div class="big" id="winBig"></div>
      <div class="sub" id="winSub"></div>
      <div class="actions">
        <button class="btnprimary" id="winNewGame"></button>
        <button class="btnghost" id="winClose"></button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* =========================================================================
   ENGINE — pure game logic
   ========================================================================= */
const DIR_VEC = {
  N:{dx:0,dy:-1}, NE:{dx:1,dy:-1}, E:{dx:1,dy:0}, SE:{dx:1,dy:1},
  S:{dx:0,dy:1}, SW:{dx:-1,dy:1}, W:{dx:-1,dy:0}, NW:{dx:-1,dy:-1}
};
const PATTERN_DIRS = [
  ['NW','N','NE','E'], ['NW','N','NE','SE'], ['NW','N','NE','S'], ['NW','N','NE','SW'],
  ['NW','N','NE','W'], ['NW','N','E','SE'], ['NW','N','E','S'], ['NW','N','E','SW'],
  ['NW','N','W','E'], ['NW','N','S','SE'], ['NW','N','SW','SE'], ['NW','N','W','SE'],
  ['NW','N','SW','S'], ['NW','N','W','S'], ['NW','E','SW','SE'], ['NW','W','E','SE'],
  ['NW','E','SW','S'], ['NW','W','E','S'], ['N','W','E','S'], ['NW','NE','SW','SE'],
];
const PATTERNS = PATTERN_DIRS.map(a=>a.map(d=>DIR_VEC[d]));
const NPATTERNS = PATTERNS.length;

const PROVERBS = [
  { jp: "一意専心", cs: "Zaměřit se celým srdcem na jediný cíl", en: "Focus whole-heartedly on a single goal" },
  { jp: "一石二鳥", cs: "Zabít dvě mouchy jednou ranou", en: "Kill two birds with one stone" },
  { jp: "以心伝心", cs: "Porozumění beze slov", en: "Heart-to-heart communication" },
  { jp: "不言実行", cs: "Činy mluví hlasitěji než slova", en: "Actions speak louder than words" },
  { jp: "弱肉強食", cs: "Zákon džungle", en: "Law of the jungle" },
  { jp: "一期一会", cs: "Neopakovatelný okamžik", en: "Once-in-a-lifetime encounter" },
  { jp: "七転八起", cs: "Sedmkrát padni, osmkrát vstaň", en: "Fall seven times, stand up eight" },
  { jp: "十人十色", cs: "Deset lidí, deset chutí", en: "Ten people, ten colors" },
  { jp: "四面楚歌", cs: "Být obklíčen nepřáteli", en: "Surrounded by enemies on all sides" },
  { jp: "臨機応変", cs: "Schopnost přizpůsobit se situaci", en: "Adapting to circumstances" },
  { jp: "自業自得", cs: "Sklízet to, co člověk sám zaseje", en: "You reap what you sow" },
  { jp: "切磋琢磨", cs: "Navzájem se zdokonalovat", en: "Cultivating one's character by friendly competition" },
  { jp: "油断大敵", cs: "Nepozornost je největší nepřítel", en: "Carelessness is the greatest enemy" },
  { jp: "風林火山", cs: "Rychlý jako vítr, tichý jako les, dravý jako oheň, nehybný jako hora", en: "Fast as wind, quiet as forest, daring as fire, immovable as mountain" },
  { jp: "臥薪嘗胆", cs: "Snášet útrapy pro budoucí úspěch", en: "Enduring hardship for future success" },
  { jp: "三日坊主", cs: "Ten, kdo u ničeho nevydrží", en: "A quitter (monk for three days)" },
  { jp: "試行錯誤", cs: "Metoda pokusu a omylu", en: "Trial and error" },
  { jp: "正々堂々", cs: "Bojovat čestně", en: "Fair and square" },
  { jp: "適者生存", cs: "Přežití nejschopnějších", en: "Survival of the fittest" },
  { jp: "温故知新", cs: "Hledat poučení v minulosti", en: "Learn from the past to understand new things" }
];

function rotateOffset(o, steps){
  let dx=o.dx, dy=o.dy;
  const n=((steps%4)+4)%4;
  for(let i=0;i<n;i++){ const ndx=-dy, ndy=dx; dx=ndx; dy=ndy; }
  return {dx,dy};
}
function key(x,y){ return x + ',' + y; }
function parseKey(k){ const i=k.indexOf(','); return {x:+k.slice(0,i), y:+k.slice(i+1)}; }
function neighbors4(x,y){ return [{x:x-1,y:y},{x:x+1,y:y},{x:x,y:y-1},{x:x,y:y+1}]; }
function other(c){ return c==='w'?'b':'w'; }
function shuffleArray(arr) {
  const array = [...arr];
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function getRequiredCells(tile,x,y){
  return PATTERNS[tile.pattern].map(o=>{ const r=rotateOffset(o,tile.rot); return {x:x+r.dx,y:y+r.dy}; });
}
function isLegalEmptyCell(board,x,y){
  if(board.size===0) return x===0 && y===0;
  if(board.has(key(x,y))) return false;
  return neighbors4(x,y).some(n=>board.has(key(n.x,n.y)));
}
function frontierCells(board){
  if(board.size===0) return [{x:0,y:0}];
  const set=new Set();
  for(const k of board.keys()){
    const {x,y}=parseKey(k);
    for(const n of neighbors4(x,y)){ const nk=key(n.x,n.y); if(!board.has(nk)) set.add(nk); }
  }
  return [...set].map(parseKey);
}
function isConnectedWithout(board,removeKey){
  const keys=[...board.keys()].filter(k=>k!==removeKey);
  if(keys.length<=1) return true;
  const start=keys[0]; const visited=new Set([start]); const stack=[start];
  while(stack.length){
    const k=stack.pop(); const {x,y}=parseKey(k);
    for(const n of neighbors4(x,y)){
      const nk=key(n.x,n.y);
      if(nk!==removeKey && board.has(nk) && !visited.has(nk)){ visited.add(nk); stack.push(nk); }
    }
  }
  return visited.size===keys.length;
}
function isMovable(board,x,y){
  if (GAME_MODE !== 'classic' && GAME_MODE !== 'blind') return false; 
  const k=key(x,y); const tile=board.get(k); if(!tile) return false;
  const hasFreeSide = neighbors4(x,y).some(n=>!board.has(key(n.x,n.y)));
  if(!hasFreeSide) return false;
  return isConnectedWithout(board,k);
}
function checkWinClassic(board,color){
  for(const [k,tile] of board){
    if(tile.color!==color) continue;
    const {x,y}=parseKey(k);
    const req=getRequiredCells(tile,x,y);
    if(req.every(c=>{ const t=board.get(key(c.x,c.y)); return t && t.color===color; })) return k;
  }
  return null;
}
function calculatePoints(board, color){
  let pts = 0;
  for(const [k,tile] of board){
    if(tile.color!==color) continue;
    const {x,y}=parseKey(k);
    const req=getRequiredCells(tile,x,y);
    if(req.every(c=>{ const t=board.get(key(c.x,c.y)); return t && t.color===color; })) pts++;
  }
  return pts;
}

function computeRedDiscs(board){
  const discs=new Set();
  for(const [k,tile] of board){
    const {x,y}=parseKey(k); const req=getRequiredCells(tile,x,y);
    let blocked=false, complete=true;
    for(const c of req){
      const t=board.get(key(c.x,c.y));
      if(!t) {
        complete=false;
      } else if(t.color!==tile.color){
        blocked=true; complete=false;
      }
    }
    if(blocked && !complete) discs.add(k);
  }
  return discs;
}
function computePhase(pool){ 
  if (GAME_MODE !== 'classic' && GAME_MODE !== 'blind') return 'placing';
  return (pool.w.size===0 && pool.b.size===0) ? 'movement' : 'placing'; 
}

function genActions(board,pool,phase,color){
  const actions=[];
  if(phase==='placing'){
    const frontier=frontierCells(board);
    const legalCells = frontier.filter(f=>isLegalEmptyCell(board,f.x,f.y));
    for(const pat of pool[color]){
      for(let rot=0; rot<4; rot++){
        for(const f of legalCells) actions.push({type:'place',pattern:pat,rot,x:f.x,y:f.y});
      }
    }
  } else if(phase==='movement'){
    for(const [k,tile] of board){
      if(tile.color!==color) continue;
      const {x,y}=parseKey(k);
      if(!isMovable(board,x,y)) continue;
      const tmp=new Map(board); tmp.delete(k);
      const frontier2=frontierCells(tmp).filter(f=>isLegalEmptyCell(tmp,f.x,f.y));
      for(const f of frontier2){
        if(f.x===x && f.y===y) continue;
        actions.push({type:'move',fromX:x,fromY:y,rot:tile.rot,toX:f.x,toY:f.y});
      }
    }
  }
  return actions;
}
function applyActionSim(board,pool,color,action){
  const b=new Map(board), p={w:new Set(pool.w), b:new Set(pool.b)};
  if(action.type==='place'){
    b.set(key(action.x,action.y), {color,pattern:action.pattern,rot:action.rot});
    p[color].delete(action.pattern);
  } else {
    const k=key(action.fromX,action.fromY); const tile=b.get(k);
    b.delete(k);
    b.set(key(action.toX,action.toY), {color,pattern:tile.pattern,rot:action.rot});
  }
  return {board:b, pool:p};
}

/* =========================================================================
   AI
   ========================================================================= */
function evaluateState(board, forColor){
  const discs = computeRedDiscs(board);
  const weights=[0,1,3,9];
  let score=0;
  for(const [k,tile] of board){
    const {x,y}=parseKey(k); const req=getRequiredCells(tile,x,y);
    let filled=0;
    for(const c of req){ const t=board.get(key(c.x,c.y)); if(t && t.color===tile.color) filled++; }
    if(filled>=4) filled=3;
    let val=weights[filled];
    if(discs.has(k)) val*=0.35;
    score += (tile.color===forColor) ? val : -val*1.05;
  }
  return score;
}
function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function chooseAIAction(board,pool,phase,color,difficulty){
  const opp = other(color);
  
  let rootPool = pool;
  if (GAME_MODE === 'blind' && phase === 'placing') {
     const availablePatterns = [...pool[color]];
     const chosenPattern = pickRandom(availablePatterns);
     rootPool = { w: new Set(pool.w), b: new Set(pool.b) };
     rootPool[color] = new Set([chosenPattern]);
  }

  const actions = genActions(board,rootPool,phase,color);
  if(actions.length===0) return null;

  if (GAME_MODE === 'classic' || GAME_MODE === 'blind') {
    const winners = actions.filter(a=>{
      const sim = applyActionSim(board,pool,color,a);
      return checkWinClassic(sim.board,color)!==null;
    });
    if(winners.length) return pickRandom(winners);
  }

  if(difficulty==='easy') return pickRandom(actions);

  function scoreAction(a){
    const sim = applyActionSim(board,pool,color,a);
    const simPhase = computePhase(sim.pool);
    const oppActions = genActions(sim.board, sim.pool, simPhase, opp);
    let danger=0;
    if (GAME_MODE === 'classic' || GAME_MODE === 'blind') {
      for(const oa of oppActions){
        const oppSim = applyActionSim(sim.board, sim.pool, opp, oa);
        if(checkWinClassic(oppSim.board,opp)){ danger=-100000; break; }
      }
    }
    return { a, sim, simPhase, val: evaluateState(sim.board,color)+danger };
  }
  let scored = actions.map(scoreAction);
  scored.sort((x,y)=>y.val-x.val);

  if(difficulty==='medium'){
    const bestVal = scored[0].val;
    const top = scored.filter(o=>o.val >= bestVal-1.5);
    return pickRandom(top.slice(0,4)).a;
  }

  const beam = scored.slice(0, Math.min(10, scored.length));
  let bestAction = beam[0].a, bestWorst = -Infinity;
  for(const cand of beam){
    const oppActions = genActions(cand.sim.board, cand.sim.pool, cand.simPhase, opp);
    if(oppActions.length===0){ if(cand.val>bestWorst){bestWorst=cand.val; bestAction=cand.a;} continue; }
    let oppScored = oppActions.map(oa=>{
      const oppSim = applyActionSim(cand.sim.board, cand.sim.pool, opp, oa);
      const win = (GAME_MODE==='classic' || GAME_MODE==='blind') ? checkWinClassic(oppSim.board,opp) : false;
      return { oppSim, val: win?1e6:evaluateState(oppSim.board,opp), win };
    });
    oppScored.sort((x,y)=>y.val-x.val);
    const oppBeam = oppScored.slice(0, Math.min(8, oppScored.length));
    let worst = Infinity;
    for(const os of oppBeam){
      const ourVal = os.win ? -1e6 : evaluateState(os.oppSim.board, color);
      if(ourVal < worst) worst = ourVal;
    }
    if(worst > bestWorst){ bestWorst = worst; bestAction = cand.a; }
  }
  return bestAction;
}

    <p>The midgame is where the winner is decided. Here you must combine attack with defense.</p>
    <ul>
      <li><b>Forking strategy:</b> The most effective tactic. Try to place tiles so that one move advances the completion of two different patterns at once. The opponent can usually only block one spot, leaving the other free for you.</li>
      <li><b>Active defense and blocking:</b> As soon as you see your opponent is only one or two tiles away from completing their pattern (surrounding a specific tile), you must intervene immediately. Occupy the critical space with a tile of your own that disrupts the opponent's concept.</li>
      <li><b>Utilizing tile rotation:</b> Since Ni-Ju contains dozens of different combinations thanks to tile rotations, <b>always check all tile orientations before placing</b>. The correct rotation can unlock an unexpected position that fits into your scheme.</li>
      <li><b>Forcing moves (Tempo):</b> Place tiles so your opponent has to react defensively. This takes away their initiative and forces them to waste turns putting out your fires instead of building their own winning pattern.</li>
    </ul>

    <h3>🏁 Endgame</h3>
    <ul>
      <li><b>Counting remaining resources:</b> In the endgame, keep track of exactly what tiles you and your opponent have left. If you know the opponent has exhausted a specific type of pattern, you no longer need to worry about that direction and can fully focus on your final attack.</li>
    </ul>
  `
}
};
let LANG = 'en';
function t(key, vars){
  let s = STR[LANG][key] || key;
  if(vars) for(const k in vars) s = s.replace('{'+k+'}', vars[k]);
  return s;
}

/* =========================================================================
   TILE VISUALS
   ========================================================================= */
function tileFaceSVG(patternIdx, rot, color, size, isFaceDown = false){
  const bg = color==='w' ? 'var(--tile-w-bg)' : 'var(--tile-b-bg)';
  const border = color==='w' ? 'var(--tile-w-border)' : 'var(--tile-b-border)';
  const ink = color==='w' ? 'var(--tile-w-ink)' : 'var(--tile-b-ink)';

  if (isFaceDown) {
    const pIdx = (typeof ST !== 'undefined' && ST && ST.proverbMap) ? ST.proverbMap[patternIdx] : patternIdx;
    const chars = PROVERBS[pIdx].jp;
    const fs = size * 0.32;
    const cx1 = size * 0.30;
    const cx2 = size * 0.70;
    const cy1 = size * 0.30;
    const cy2 = size * 0.70;
    return `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
      <rect x="1.2" y="1.2" width="${size-2.4}" height="${size-2.4}" fill="${bg}" stroke="${border}" stroke-width="1.6"/>
      <text x="${cx1}" y="${cy1}" font-size="${fs}" font-family="'Noto Serif JP',serif" fill="${ink}" text-anchor="middle" dominant-baseline="central">${chars[0]}</text>
      <text x="${cx2}" y="${cy1}" font-size="${fs}" font-family="'Noto Serif JP',serif" fill="${ink}" text-anchor="middle" dominant-baseline="central">${chars[1]}</text>
      <text x="${cx1}" y="${cy2}" font-size="${fs}" font-family="'Noto Serif JP',serif" fill="${ink}" text-anchor="middle" dominant-baseline="central">${chars[2]}</text>
      <text x="${cx2}" y="${cy2}" font-size="${fs}" font-family="'Noto Serif JP',serif" fill="${ink}" text-anchor="middle" dominant-baseline="central">${chars[3]}</text>
    </svg>`;
  }

  const offsets = PATTERNS[patternIdx].map(o=>rotateOffset(o,rot));
  const cell = size/3;
  let sq='';
  for(const o of offsets){
    const col=o.dx+1, row=o.dy+1;
    const pad=cell*0.24;
    const x=col*cell+pad, y=row*cell+pad, s=cell-2*pad;
    sq += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${s.toFixed(1)}" height="${s.toFixed(1)}" fill="none" stroke="${ink}" stroke-width="${Math.max(1,size*0.045).toFixed(1)}"/>`;
  }
  return `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
    <rect x="1.2" y="1.2" width="${size-2.4}" height="${size-2.4}" fill="${bg}" stroke="${border}" stroke-width="1.6"/>
    ${sq}
  </svg>`;
}

const SAVE_KEY = 'niju_save_v2';

let MODES_ORDER = ['classic', 'blind', 'tournament', 'solo'];

let DEBUG_COORDS = false;

let soloEndAnimationIndex = 0;
let soloEndPatterns = [];
let soloEndInterval = null;

function resetEndAnimation() {
  if (soloEndInterval) clearInterval(soloEndInterval);
  soloEndInterval = null;
  soloEndAnimationIndex = 0;
  soloEndPatterns = [];
}

function checkEndAnimations() {
  resetEndAnimation();
  if (ST.ended && (GAME_MODE === 'solo' || GAME_MODE === 'tournament')) {
    for(const [k,tile] of ST.board){
        const req = getRequiredCells(tile, parseKey(k).x, parseKey(k).y).map(c=>key(c.x,c.y));
        const isComplete = req.every(rk => {
            const t = ST.board.get(rk);
            return t && t.color === tile.color;
        });
        if (isComplete) soloEndPatterns.push({ center: k, parts: req });
    }
    if (soloEndPatterns.length > 1) {
        soloEndInterval = setInterval(() => {
            soloEndAnimationIndex = (soloEndAnimationIndex + 1) % soloEndPatterns.length;
            safeRender(true);
        }, 1800);
    }
  }
}

function freshPool(){ const s=new Set(); for(let i=0;i<NPATTERNS;i++) s.add(i); return s; }

function newGame(){
  const settings = loadSettings();
  const startColor = settings.nextStartColor || 'w';
  const poolW = freshPool();
  const poolB = GAME_MODE==='solo' ? new Set() : freshPool();
  
  ST = {
    board: new Map(),
    pool: { w: poolW, b: poolB },
    blindOrder: { w: shuffleArray(Array.from(poolW)), b: shuffleArray(Array.from(poolB)) },
    proverbMap: shuffleArray(Array.from({length: NPATTERNS}, (_, i) => i)),
    phase: 'placing',
    turn: GAME_MODE==='solo' ? 'w' : startColor,
    humanColor: 'w',
    aiColor: GAME_MODE==='solo' ? null : 'b',
    winner: null, winningTileKey: null, winPatternKeys: null,
    pointsW: 0, pointsB: 0,
    lastMove: null,
    lastMoveOrigin: null,
    log: [],
    turnCounter: 0,
    ended:false,
  };
  
  if (GAME_MODE === 'solo') {
    addLog({type: 'system', msgKey: 'log_sys_start_solo'});
  } else {
    addLog({type: 'system', msgKey: 'log_sys_start', hasDiff: true, diff: DIFFICULTY});
  }

  UI.selection = null;
  UI.movementPlies = 0;
  if(GAME_MODE !== 'solo') settings.nextStartColor = other(startColor);
  saveSettings(settings);
  closeOverlay('winOverlay');
  lastRenderedKeys.clear();
  resetEndAnimation();
  safeRender(true);
  maybeTriggerAI();
}

function loadSettings(){
  try{
    const raw = localStorage.getItem(SETTINGS_KEY);
    if(!raw) return { lang:'en', difficulty:'medium', nextStartColor:'w', mode:'classic' };
    const s = JSON.parse(raw);
    return { lang:s.lang||'en', difficulty:s.difficulty||'medium', nextStartColor:s.nextStartColor||'w', mode:s.mode||'classic' };
  }catch(e){ return { lang:'en', difficulty:'medium', nextStartColor:'w', mode:'classic' }; }
}
function saveSettings(s){ try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }catch(e){} }

function getStats() {
  try { return JSON.parse(localStorage.getItem(STATS_KEY)) || {}; }
  catch(e) { return {}; }
}
function saveStats(mode, diff, result, pts) {
  if (mode === 'solo') diff = 'none';
  const allStats = getStats();
  if(!allStats[mode]) allStats[mode] = {};
  if(!allStats[mode][diff]) allStats[mode][diff] = { played:0, win:0, loss:0, draw:0, pts:0 };
  
  const s = allStats[mode][diff];
  s.played++;
  if(result) s[result]++;
  s.pts = Math.max(s.pts, pts);
  localStorage.setItem(STATS_KEY, JSON.stringify(allStats));
}

function serializeState(){
  return JSON.stringify({
    board: [...ST.board.entries()], pool: { w:[...ST.pool.w], b:[...ST.pool.b] },
    blindOrder: ST.blindOrder, proverbMap: ST.proverbMap,
    phase: ST.phase, turn: ST.turn, humanColor: ST.humanColor, aiColor: ST.aiColor,
    winner: ST.winner, winningTileKey: ST.winningTileKey, winPatternKeys: ST.winPatternKeys, log: ST.log,
    pointsW: ST.pointsW, pointsB: ST.pointsB, lastMove: ST.lastMove, lastMoveOrigin: ST.lastMoveOrigin,
    turnCounter: ST.turnCounter, ended: ST.ended,
    difficulty: DIFFICULTY, lang: LANG, mode: GAME_MODE, zoom: UI.zoom,
  });
}
function deserializeState(json){
  const d = JSON.parse(json);
  ST = {
    board: new Map(d.board), pool: { w:new Set(d.pool.w), b:new Set(d.pool.b) },
    blindOrder: d.blindOrder || { w: [...d.pool.w], b: [...d.pool.b] },
    proverbMap: d.proverbMap || Array.from({length: NPATTERNS}, (_, i) => i),
    phase: d.phase, turn: d.turn, humanColor: d.humanColor, aiColor: d.aiColor,
    winner: d.winner, winningTileKey: d.winningTileKey, winPatternKeys: d.winPatternKeys||null, log: d.log||[],
    pointsW: d.pointsW||0, pointsB: d.pointsB||0, lastMove: d.lastMove||null, lastMoveOrigin: d.lastMoveOrigin||null,
    turnCounter: d.turnCounter||0, ended: !!d.ended,
  };
  UI.selection = null; UI.movementPlies = 0;
  if(d.difficulty) DIFFICULTY = d.difficulty;
  if(d.lang) LANG = d.lang;
  if(d.mode) GAME_MODE = d.mode;
  if(d.zoom) UI.zoom = d.zoom;
}

function doSave(){ try{ localStorage.setItem(SAVE_KEY, serializeState()); toast(t('saved')); }catch(e){} }
function doLoad(){
  const raw = localStorage.getItem(SAVE_KEY);
  if(!raw){ toast(t('no_save')); return; }
  deserializeState(raw);
  syncControlsFromState(); closeOverlay('winOverlay'); 
  lastRenderedKeys.clear();
  checkEndAnimations();
  safeRender(true); maybeTriggerAI(); toast(t('loaded'));
}

/* =========================================================================
   TURN / ACTION HANDLING
   ========================================================================= */
function performAction(color, action){
  if(action.type==='place'){
    ST.board.set(key(action.x,action.y), {color, pattern:action.pattern, rot:action.rot});
    ST.pool[color].delete(action.pattern);
    ST.lastMove = {x:action.x, y:action.y};
    ST.lastMoveOrigin = null;
    addLog({type:'place', color, pattern:action.pattern, rot:action.rot, x:action.x, y:action.y});
  } else {
    const k = key(action.fromX, action.fromY); const tile = ST.board.get(k);
    ST.board.delete(k);
    ST.board.set(key(action.toX,action.toY), {color, pattern:tile.pattern, rot:action.rot});
    ST.lastMove = {x:action.toX, y:action.toY};
    ST.lastMoveOrigin = {x:action.fromX, y:action.fromY};
    addLog({type:'move', color, pattern:tile.pattern, rot:action.rot, fromX:action.fromX, fromY:action.fromY, toX:action.toX, toY:action.toY});
  }
  ST.phase = computePhase(ST.pool);
  if(ST.phase==='movement') UI.movementPlies++;

  if (GAME_MODE === 'classic' || GAME_MODE === 'blind') {
    const winKey = checkWinClassic(ST.board, color);
    if(winKey){
      const wTile = ST.board.get(winKey); const {x:wx,y:wy} = parseKey(winKey);
      const patternKeys = getRequiredCells(wTile,wx,wy).map(c=>key(c.x,c.y));
      ST.winner = color; ST.winningTileKey = winKey; ST.winPatternKeys = patternKeys; ST.ended = true; ST.phase='ended';
      addLog({type:'system', msgKey: color === ST.humanColor ? 'log_sys_win_you' : 'log_sys_win_ai'});
      saveStats(GAME_MODE, DIFFICULTY, ST.humanColor===color?'win':'loss', 1);
    } else if(ST.phase==='movement' && UI.movementPlies > 500){
      ST.winner = 'draw'; ST.ended = true; ST.phase='ended';
      addLog({type:'system', msgKey: 'log_sys_draw'});
      saveStats(GAME_MODE, DIFFICULTY, 'draw', 0);
    }
  } else if (GAME_MODE === 'tournament') {
    if(ST.pool.w.size===0 && ST.pool.b.size===0) {
      ST.pointsW = calculatePoints(ST.board, 'w');
      ST.pointsB = calculatePoints(ST.board, 'b');
      if (ST.pointsW > ST.pointsB) ST.winner = 'w';
      else if (ST.pointsB > ST.pointsW) ST.winner = 'b';
      else ST.winner = 'draw';
      ST.ended = true; ST.phase='ended';
      addLog({type:'system', msgKey: 'log_sys_end_tour', vars: {ai: ST.pointsB, you: ST.pointsW}});
      const r = ST.winner==='draw' ? 'draw' : (ST.winner===ST.humanColor ? 'win' : 'loss');
      const bestPts = Math.max(ST.pointsW, ST.pointsB);
      saveStats('tournament', DIFFICULTY, r, bestPts);
    }
  } else if (GAME_MODE === 'solo') {
    if(ST.pool.w.size===0) {
      ST.pointsW = calculatePoints(ST.board, 'w');
      ST.winner = 'w';
      ST.ended = true; ST.phase='ended';
      addLog({type:'system', msgKey: 'log_sys_end_solo', vars: {you: ST.pointsW}});
      saveStats('solo', 'none', 'win', ST.pointsW);
    }
  }

  if (!ST.ended) {
    if (GAME_MODE === 'solo') {
      ST.turn = 'w';
    } else {
      ST.turn = other(color);
      let guard = 0;
      while(!ST.ended && guard < 4){
        const acts = genActions(ST.board, ST.pool, ST.phase, ST.turn);
        if(acts.length>0) break;
        addLog({type:'pass', color:ST.turn});
        ST.turn = other(ST.turn);
        guard++;
      }
    }
  }
  
  UI.selection = null;
  if(ST.ended) checkEndAnimations();
  safeRender(true);
  if(!ST.ended) maybeTriggerAI();
  if(ST.ended) showWinner();
}

function addLog(entry){ 
  if(entry.type !== 'system' && entry.type !== 'start') {
    ST.turnCounter++; 
    entry.n = ST.turnCounter; 
  }
  ST.log.push(entry); 
}
function safeRender(center = false){ try{ render(center); }catch(e){} }

function maybeTriggerAI(){
  if(ST.ended || ST.turn !== ST.aiColor || ST.aiColor === null) return;
  setTimeout(()=>{
    const action = chooseAIAction(ST.board, ST.pool, ST.phase, ST.aiColor, DIFFICULTY);
    if(action) performAction(ST.aiColor, action);
  }, 420 + Math.random()*380);
}

const BASE_CELL = 62;
function getCellSize(){ return Math.round(BASE_CELL*UI.zoom); }

function boardBounds(){
  let minX=-3,maxX=3,minY=-3,maxY=3;
  if(ST.board.size){
    minX=Infinity;maxX=-Infinity;minY=Infinity;maxY=-Infinity;
    for(const k of ST.board.keys()){
      const {x,y}=parseKey(k);
      if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;
    }
    minX-=3;maxX+=3;minY-=3;maxY+=3;
  }
  return {minX,maxX,minY,maxY};
}
function legalDestinationSet(){
  if(!UI.selection) return null;
  const set = new Set();
  if(UI.selection.mode==='place'){
    const frontier = frontierCells(ST.board);
    for(const f of frontier) if(isLegalEmptyCell(ST.board,f.x,f.y)) set.add(key(f.x,f.y));
  } else if(UI.selection.mode==='move'){
    const k = key(UI.selection.fromX, UI.selection.fromY);
    const tmp = new Map(ST.board); tmp.delete(k);
    const frontier = frontierCells(tmp);
    for(const f of frontier){
      if(f.x===UI.selection.fromX && f.y===UI.selection.fromY) continue;
      if(isLegalEmptyCell(tmp,f.x,f.y)) set.add(key(f.x,f.y));
    }
  }
  return set;
}

function centerBoardOnTarget(target, minX, minY, cell, padX, padY){
  if(!target) return;
  const scroll = document.getElementById('boardscroll');
  const cx = padX + (target.x - minX) * cell + cell / 2;
  const cy = padY + (target.y - minY) * cell + cell / 2;
  const left = Math.max(0, cx - scroll.clientWidth / 2);
  const top  = Math.max(0, cy - scroll.clientHeight / 2);
  scroll.scrollTo({ left, top, behavior: 'smooth' });
}

function render(center = false){
  document.getElementById('turnDot').className = 'dot '+ (ST.ended ? (ST.winner==='draw' ? ST.turn : ST.winner) : ST.turn);
  document.getElementById('turnCount').textContent = '';
  
  const scoreCounter = document.getElementById('scoreCounter');
  if (GAME_MODE === 'solo') {
      scoreCounter.style.display = 'inline';
      scoreCounter.textContent = `⭐ ${calculatePoints(ST.board, 'w')}`;
  } else if (GAME_MODE === 'tournament') {
      scoreCounter.style.display = 'inline';
      scoreCounter.textContent = `⚪ ${calculatePoints(ST.board, 'w')} : ${calculatePoints(ST.board, 'b')} ⚫`;
  } else {
      scoreCounter.style.display = 'none';
  }

  const boardEl = document.getElementById('board');
  const scrollEl = document.getElementById('boardscroll');
  
  const {minX,maxX,minY,maxY} = boardBounds();
  const cell = getCellSize();
  
  const calcW = (maxX-minX+1)*cell;
  const calcH = (maxY-minY+1)*cell;
  
  const scrollW = scrollEl.clientWidth;
  const scrollH = scrollEl.clientHeight;
  
  const padX = calcW < scrollW ? (scrollW - calcW) / 2 : 0;
  const padY = calcH < scrollH ? (scrollH - calcH) / 2 : 0;
  
  boardEl.style.width = Math.max(calcW, scrollW)+'px'; 
  boardEl.style.height = Math.max(calcH, scrollH)+'px';
  boardEl.innerHTML = '';

  const legalSet = legalDestinationSet();
  if(legalSet){
    for(const k of legalSet){
      const {x,y} = parseKey(k); const d = document.createElement('div');
      d.className='cell legal';
      d.style.left = (padX + (x-minX)*cell)+'px'; d.style.top = (padY + (y-minY)*cell)+'px';
      d.style.width = cell+'px'; d.style.height = cell+'px';
      d.style.margin='3px'; d.style.width=(cell-6)+'px'; d.style.height=(cell-6)+'px';
      d.addEventListener('click', ()=>onDestinationTap(x,y));
      
      if (DEBUG_COORDS) {
        const c = document.createElement('div');
        c.textContent = `${x},${y}`;
        c.style.position = 'absolute';
        c.style.inset = '0';
        c.style.display = 'flex';
        c.style.alignItems = 'center';
        c.style.justifyContent = 'center';
        c.style.fontSize = '11px';
        c.style.color = '#8a8a8a';
        c.style.pointerEvents = 'none';
        d.appendChild(c);
      }
      boardEl.appendChild(d);
    }
  }

  if ((GAME_MODE === 'classic' || GAME_MODE === 'blind') && ST.phase === 'movement' && ST.lastMoveOrigin) {
    const ox = ST.lastMoveOrigin.x;
    const oy = ST.lastMoveOrigin.y;
    const d = document.createElement('div');
    d.className = 'cell origin';
    d.style.left = (padX + (ox - minX) * cell) + 'px';
    d.style.top = (padY + (oy - minY) * cell) + 'px';
    d.style.margin = '3px'; 
    d.style.width = (cell - 6) + 'px'; 
    d.style.height = (cell - 6) + 'px';
    boardEl.appendChild(d);
  }

  const discs = (GAME_MODE === 'classic' || GAME_MODE === 'blind' || GAME_MODE === 'tournament')
  ? computeRedDiscs(ST.board)
  : new Set();
  const humanCanAct = !ST.ended && ST.turn===ST.humanColor;
  
  const activeCenters = new Set();
  const activeWinParts = new Set();
  let centerTarget = ST.lastMove; 
  let isSingleWin = false; 
  
  if (ST.ended && (GAME_MODE === 'solo' || GAME_MODE === 'tournament') && soloEndPatterns.length > 0) {
      const p = soloEndPatterns[soloEndAnimationIndex];
      activeCenters.add(p.center);
      p.parts.forEach(rk => activeWinParts.add(rk));
      
      centerTarget = parseKey(p.center);
      if (soloEndPatterns.length === 1) isSingleWin = true;

  } else if (ST.ended && (GAME_MODE === 'classic' || GAME_MODE === 'blind')) {
      activeCenters.add(ST.winningTileKey);
      if (ST.winPatternKeys) ST.winPatternKeys.forEach(k => activeWinParts.add(k));
      centerTarget = parseKey(ST.winningTileKey);
      isSingleWin = true;

  } else if (!ST.ended && (GAME_MODE === 'solo' || GAME_MODE === 'tournament') && ST.lastMove) {
    const lx = ST.lastMove.x;
    const ly = ST.lastMove.y;
    const lk = key(lx, ly);

    for(const [k,tile] of ST.board){
        const req = getRequiredCells(
            tile,
            parseKey(k).x,
            parseKey(k).y
        ).map(c => key(c.x,c.y));

        const isComplete = req.every(rk => {
            const t = ST.board.get(rk);
            return t && t.color === tile.color;
        });

        if (!isComplete) continue;
        if (k !== lk && !req.includes(lk)) continue;

        activeCenters.add(k);
        req.forEach(rk => activeWinParts.add(rk));
    }
  }

  const newKeys = new Set();

  for(const [k,tile] of ST.board){
    const {x,y} = parseKey(k);
    newKeys.add(k);
    const div = document.createElement('div');
    div.className='tile' + (lastRenderedKeys.has(k) ? '' : ' appear');
    div.style.left = (padX + (x-minX)*cell)+'px'; div.style.top = (padY + (y-minY)*cell)+'px';
    div.style.width = cell+'px'; div.style.height = cell+'px';
    div.style.padding='3px';
    const inner = document.createElement('div');
    inner.style.width='100%'; inner.style.height='100%'; inner.style.position='relative';
    inner.innerHTML = tileFaceSVG(tile.pattern, tile.rot, tile.color, cell-6, false);
    div.appendChild(inner);

    if(ST.lastMove && ST.lastMove.x===x && ST.lastMove.y===y) {
      const marker = document.createElement('div');
      marker.className = 'last-placed-marker';
      inner.appendChild(marker);
    }

    if (DEBUG_COORDS) {
      const c = document.createElement('div');
      c.textContent = `${x},${y}`;
      c.style.position = 'absolute';
      c.style.top = '2px';
      c.style.left = '2px';
      c.style.background = 'rgba(255,255,255,0.8)';
      c.style.color = '#d32f2f';
      c.style.fontSize = '10px';
      c.style.fontWeight = 'bold';
      c.style.padding = '1px 3px';
      c.style.borderRadius = '3px';
      c.style.pointerEvents = 'none';
      c.style.zIndex = '15';
      inner.appendChild(c);
    }

    if(discs.has(k)) div.classList.add('blocked');
    if(activeCenters.has(k)) {
        div.classList.add('winning');
        if (isSingleWin) div.classList.add('static');
    }
    if(activeWinParts.has(k)) {
        div.classList.add('winpart');
        if (isSingleWin) div.classList.add('static');
    }

    if (ST.phase === 'movement' && (GAME_MODE === 'classic' || GAME_MODE === 'blind')) {
      if (!isConnectedWithout(ST.board, k)) {
        div.classList.add('unmovable-split');
      }
    }

    if(UI.selection && UI.selection.mode==='move' && key(UI.selection.fromX,UI.selection.fromY)===k){
      div.classList.add('selected'); div.addEventListener('click', ()=>onOwnTileTap(x,y));
    } else if(humanCanAct && ST.phase==='movement' && tile.color===ST.humanColor && isMovable(ST.board,x,y)){
      div.classList.add('movable'); div.addEventListener('click', ()=>onOwnTileTap(x,y));
    }
    boardEl.appendChild(div);
  }
  
  lastRenderedKeys = newKeys;

  // Tray
  const trayWrap = document.getElementById('trayWrap'), tray = document.getElementById('tray');
  const showTray = !ST.ended && ST.phase==='placing' && ST.turn===ST.humanColor;
  trayWrap.classList.toggle('show', showTray);
  tray.innerHTML='';
  if(showTray){
    let poolArray;
    if (GAME_MODE === 'blind') {
      poolArray = ST.blindOrder[ST.humanColor].filter(p => ST.pool[ST.humanColor].has(p));
    } else {
      poolArray = [...ST.pool[ST.humanColor]].sort((a,b)=>a-b);
    }

    for(const pat of poolArray){
      const isSel = (UI.selection && UI.selection.mode==='place' && UI.selection.pattern===pat);
      const rot = isSel ? UI.selection.rot : 0;
      
      let isFaceDown = false;
      let isDisabled = false;
      
      if (GAME_MODE === 'blind') {
        if (UI.selection && UI.selection.mode === 'place') {
          if (!isSel) {
            isFaceDown = true;
            isDisabled = true;
          }
        } else {
          isFaceDown = true;
        }
      }

      const div = document.createElement('div');
      div.className='traytile' + (isSel ? ' sel':'') + (isDisabled ? ' disabled':'');
      div.innerHTML = tileFaceSVG(pat, rot, ST.humanColor, 56, isFaceDown);
      
      let longPressed = false;
      
      if (isFaceDown) {
        const pIdx = ST.proverbMap[pat];
        const trans = PROVERBS[pIdx][LANG];
        // Klasický tooltip pro zobrazení při najetí myší na PC
        div.setAttribute('title', trans);
        
        // Logika pro detekci dlouhého podržení na dotykovém zařízení
        let pressTimer;
        div.addEventListener('touchstart', (e) => {
            longPressed = false;
            pressTimer = setTimeout(() => {
                longPressed = true;
                toast(trans);
                if (navigator.vibrate) navigator.vibrate(30);
            }, 500);
        }, {passive: true});
        
        div.addEventListener('touchend', () => clearTimeout(pressTimer), {passive: true});
        div.addEventListener('touchmove', () => clearTimeout(pressTimer), {passive: true});
        
        // Zabrání zobrazení nativního kontextového menu po podržení na mobilech
        div.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });
      }

      if (!isDisabled) {
        div.addEventListener('click', (e) => {
            // Zabraňuje výběru dlaždice, pokud na ní uživatel jen dlouze podržel prst pro tooltip
            if (longPressed) {
                e.preventDefault();
                e.stopPropagation();
                return;
            }
            onTrayTap(pat);
        });
      }
      tray.appendChild(div);
    }
  }
  
  if (center) {
      centerBoardOnTarget(centerTarget, minX, minY, cell, padX, padY);
  }
}

/* =========================================================================
   INTERACTION
   ========================================================================= */
function onTrayTap(pattern){
  if(ST.ended || ST.turn!==ST.humanColor || ST.phase!=='placing') return;
  if (GAME_MODE === 'solo' || GAME_MODE === 'tournament') {
    ST.lastMove = null;
  }
  
  if (GAME_MODE === 'blind') {
    if (UI.selection && UI.selection.mode === 'place') {
        if (UI.selection.pattern === pattern) {
            UI.selection.rot = (UI.selection.rot + 1) % 4;
            safeRender(false);
        }
        return; 
    } else {
        UI.selection = { mode: 'place', pattern, rot: 0 };
        safeRender(false);
        return;
    }
  }

  if(UI.selection && UI.selection.mode==='place' && UI.selection.pattern===pattern) UI.selection.rot = (UI.selection.rot+1)%4;
  else UI.selection = { mode:'place', pattern, rot:0 };
  safeRender(false);
}
function onOwnTileTap(x,y){
  if(ST.ended || ST.turn!==ST.humanColor || ST.phase!=='movement') return;
  const tile = ST.board.get(key(x,y));
  if(!tile || tile.color!==ST.humanColor || !isMovable(ST.board,x,y)) return;
  if(UI.selection && UI.selection.mode==='move' && UI.selection.fromX===x && UI.selection.fromY===y) UI.selection = null;
  else UI.selection = { mode:'move', fromX:x, fromY:y, rot:tile.rot };
  safeRender(false);
}
function onDestinationTap(x,y){
  if(!UI.selection) return;
  if(UI.selection.mode==='place') performAction(ST.humanColor, {type:'place', pattern:UI.selection.pattern, rot:UI.selection.rot, x, y});
  else performAction(ST.humanColor, {type:'move', fromX:UI.selection.fromX, fromY:UI.selection.fromY, rot:UI.selection.rot, toX:x, toY:y});
}

function setZoom(z){ UI.zoom = Math.max(0.55, Math.min(2.0, z)); safeRender(false); }
document.getElementById('btnZoomIn').addEventListener('click', ()=>setZoom(UI.zoom+0.15));
document.getElementById('btnZoomOut').addEventListener('click', ()=>setZoom(UI.zoom-0.15));

document.querySelector('.brand').addEventListener('click', () => {
  DEBUG_COORDS = !DEBUG_COORDS;
  safeRender(false);
});

/* =========================================================================
   MODALS / TOAST
   ========================================================================= */
function openOverlay(id){ document.getElementById(id).classList.add('show'); }
function closeOverlay(id){ document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', ()=>closeOverlay(b.dataset.close+'Overlay')));

document.getElementById('btnHelp').addEventListener('click', ()=>{ 
  document.getElementById('helpTitle').textContent = t('help_title');
  document.getElementById('helpBody').innerHTML = t('rules'); 
  openOverlay('helpOverlay'); 
});

function padTurn(n){ return String(n).padStart(3,'0'); }
function logLineHTML(entry){
  if(entry.type === 'system') {
    let text = entry.text;
    if (entry.msgKey) {
      text = t(entry.msgKey, entry.vars);
      if (entry.hasDiff) {
        text += `<span style="width:20px;height:20px;display:inline-block;vertical-align:middle;margin-top:-2px;">${icon(DIFF_ICON[entry.diff])}</span>`;
      }
    }
    return `<div class="logline system">⚙️ ${text}</div>`;
  }
  
  const num = padTurn(entry.n);
  let coords = '', tileSvg = '', note = '';
  
  if(entry.type==='place'){ 
    coords = `[${entry.x}, ${entry.y}]`; 
    tileSvg = tileFaceSVG(entry.pattern, entry.rot, entry.color, 30, false); 
  }
  else if(entry.type==='move'){ 
    coords = `[${entry.fromX}, ${entry.fromY}]:[${entry.toX}, ${entry.toY}]`; 
    tileSvg = tileFaceSVG(entry.pattern, entry.rot, entry.color, 30, false); 
  }
  else if(entry.type==='pass') { 
    coords = '—'; 
    note = t('no_move_pass'); 
  }
  
  let html = `<div class="logline"><b>${num}.</b><span class="logcoords">${coords}</span>`;
  if (note) html += `<span class="lognote">${note}</span>`;
  if (tileSvg) html += `<span style="margin-left:auto" class="logtile">${tileSvg}</span>`;
  html += `</div>`;
  
  return html;
}

document.getElementById('btnLog').addEventListener('click', ()=>{ 
  document.getElementById('logTitle').textContent = t('log_title');
  document.getElementById('logBody').innerHTML = ST.log.length ? ST.log.slice().reverse().map(logLineHTML).join('') : '<p style="opacity:.6">—</p>';
  openOverlay('logOverlay'); 
});

document.getElementById('btnCopyLog').addEventListener('click', () => {
  if (!ST.log.length) return;
  const textLines = ST.log.slice().reverse().map(entry => {
    if (entry.type === 'system') {
      let text = entry.text;
      if (entry.msgKey) {
        text = t(entry.msgKey, entry.vars);
        if (entry.hasDiff) text += ' [' + t('diff_' + entry.diff) + ']';
      }
      const tmp = document.createElement('div');
      tmp.innerHTML = text;
      return `⚙️ ${tmp.textContent}`;
    }
    const num = padTurn(entry.n);
    let coords = '';
    if (entry.type === 'place' || entry.type === 'win') {
      coords = `[${entry.x}, ${entry.y}]`;
    } else if (entry.type === 'move') {
      coords = `[${entry.fromX}, ${entry.fromY}]:[${entry.toX}, ${entry.toY}]`;
    } else if (entry.type === 'pass' || entry.type === 'draw') {
      coords = '—';
    }
    return `${num}.${coords}`;
  });
  
  navigator.clipboard.writeText(textLines.join('\n'))
    .then(() => toast(t('copied')))
    .catch(() => toast('Chyba při kopírování'));
});

document.getElementById('btnStats').addEventListener('click', ()=>{
  document.getElementById('statsTitle').textContent = t('stats_title');
  const body = document.getElementById('statsBody');
  const s = getStats();
  let html = '';
  
  MODES_ORDER.forEach(m => {
    if (!s[m]) return;
    html += `<h3>${t('mode_'+m)}</h3><table class="stats-table">
      <tr>
        <th title="${t('stats_diff')}">${icon('stats')}</th>
        <th title="${t('stats_played')}">${icon('hdr_played')}</th>
        <th title="${t('stats_won')}">${icon('hdr_won')}</th>
        <th title="${t('stats_lost')}">${icon('hdr_lost')}</th>
        <th title="${t('stats_draws')}">${icon('hdr_draws')}</th>
        <th title="${t('stats_pts')}">${icon('hdr_pts')}</th>
      </tr>`;
    ['easy','medium','hard', 'none'].forEach(d => {
      if(s[m][d]) {
        const x = s[m][d];
        const dn = d === 'none' ? '-' : `<span style="width:18px;height:18px;display:inline-block;vertical-align:middle;">${icon(DIFF_ICON[d])}</span>`;
        const lossStr = m === 'solo' ? '-' : x.loss;
        const drawStr = m === 'solo' ? '-' : x.draw;
        html += `<tr><td>${dn}</td><td>${x.played}</td><td>${x.win}</td><td>${lossStr}</td><td>${drawStr}</td><td>${x.pts}</td></tr>`;
      }
    });
    html += '</table>';
  });
  
  body.innerHTML = html || '<p>—</p>';
  openOverlay('statsOverlay');
});

let toastTimer=null;
function toast(msg){
  const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}

function showWinner(){
  document.getElementById('winNewGame').textContent = t('new_game');
  document.getElementById('winClose').textContent = t('view_board');
  const big = document.getElementById('winBig');
  const sub = document.getElementById('winSub');
  
  if(ST.winner==='draw'){ big.textContent = t('draw'); sub.textContent=''; }
  else {
    big.textContent = ST.winner===ST.humanColor ? t('win_you') : (ST.winner==='w' ? t('win_you') : t('win_ai'));
    if (GAME_MODE === 'classic' || GAME_MODE === 'blind') {
      const {x,y} = parseKey(ST.winningTileKey); const tile = ST.board.get(ST.winningTileKey);
      sub.textContent = t('win_sub_tile', {p:tile.pattern+1, x, y});
    } else if (GAME_MODE === 'tournament') {
      sub.textContent = t('win_sub_pts', {you: ST.pointsW, ai: ST.pointsB});
    } else if (GAME_MODE === 'solo') {
      sub.textContent = t('win_sub_pts_solo', {you: ST.pointsW});
    }
  }
  openOverlay('winOverlay');
}
document.getElementById('winClose').addEventListener('click', ()=>closeOverlay('winOverlay'));
document.getElementById('winNewGame').addEventListener('click', ()=>{ closeOverlay('winOverlay'); newGame(); });

/* =========================================================================
   TOOLBAR WIRING
   ========================================================================= */
function setupIcons() {
  document.getElementById('btnNew').innerHTML = icon('refresh');
  document.getElementById('btnSave').innerHTML = icon('save');
  document.getElementById('btnLoad').innerHTML = icon('load');
  document.getElementById('btnLog').innerHTML = icon('log');
  document.getElementById('btnStats').innerHTML = icon('stats');
  document.getElementById('btnHelp').innerHTML = icon('help');
  document.getElementById('btnZoomIn').innerHTML = icon('zoomin');
  document.getElementById('btnZoomOut').innerHTML = icon('zoomout');
  document.querySelectorAll('.closebtn[data-close]').forEach(b=>{ if(!b.innerHTML) b.innerHTML = icon('close'); });
  document.getElementById('btnCopyLog').innerHTML = icon('copy');
}
setupIcons();

document.getElementById('btnNew').addEventListener('click', ()=>{ newGame(); });
document.getElementById('btnSave').addEventListener('click', doSave);
document.getElementById('btnLoad').addEventListener('click', doLoad);

const DIFF_ORDER = ['easy','medium','hard'];
const DIFF_ICON = { easy:'bars1', medium:'bars2', hard:'bars3' };
document.getElementById('btnDiffToggle').addEventListener('click', ()=>{
  DIFFICULTY = DIFF_ORDER[(DIFF_ORDER.indexOf(DIFFICULTY)+1)%DIFF_ORDER.length];
  const s = loadSettings(); s.difficulty = DIFFICULTY; saveSettings(s);
  syncControlsFromState();
  if(ST && !ST.ended && GAME_MODE !== 'solo') {
     addLog({type: 'system', msgKey: 'log_sys_diff', hasDiff: true, diff: DIFFICULTY});
  }
});

document.getElementById('btnModeToggle').addEventListener('click', ()=>{
  GAME_MODE = MODES_ORDER[(MODES_ORDER.indexOf(GAME_MODE)+1)%MODES_ORDER.length];
  const s = loadSettings(); s.mode = GAME_MODE; saveSettings(s);
  toast(t('mode_'+GAME_MODE));
  syncControlsFromState();
  newGame();
});

document.getElementById('btnLangToggle').addEventListener('click', ()=>{
  LANG = (LANG==='cs') ? 'en' : 'cs';
  const s = loadSettings(); s.lang = LANG; saveSettings(s);
  document.documentElement.lang = LANG;
  syncControlsFromState(); 
  safeRender(false);
});

function syncControlsFromState(){
  const diffBtn = document.getElementById('btnDiffToggle');
  if (GAME_MODE === 'solo') {
    diffBtn.style.display = 'none';
  } else {
    diffBtn.style.display = 'flex';
    diffBtn.innerHTML = icon(DIFF_ICON[DIFFICULTY]);
  }
  
  document.getElementById('btnLangToggle').innerHTML = icon(LANG==='cs' ? 'flagEn' : 'flagCs');
  document.getElementById('btnModeToggle').innerHTML = icon('mode_'+GAME_MODE);
  document.getElementById('btnModeToggle').title = t('mode_'+GAME_MODE);
}

/* =========================================================================
   INIT
   ========================================================================= */
(function init(){
  const settings = loadSettings();
  LANG = settings.lang; DIFFICULTY = settings.difficulty; GAME_MODE = settings.mode || 'classic';
  
  if(!MODES_ORDER.includes(GAME_MODE)) GAME_MODE = 'classic';
  
  document.documentElement.lang = LANG;
  syncControlsFromState();
  newGame();
})();

})();
</script>
