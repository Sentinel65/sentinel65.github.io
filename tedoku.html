<!DOCTYPE html>
<html lang="cs">
<head>

<title>Tedoku</title>
<link href="https://fonts.googleapis.com/css2?family=Stardos+Stencil:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf7ea;--fg:#1d2a63;--mut:#5b6390;--line:#cfc8b0;--acc:#e8202a;--card:#fff;--nav:#263a8f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14172b;--fg:#e8eaff;--mut:#9aa1d0;--line:#363b66;--acc:#ff5a62;--card:#1d2140;--nav:#3b52c4}}
:root[data-theme="dark"]{--bg:#14172b;--fg:#e8eaff;--mut:#9aa1d0;--line:#363b66;--acc:#ff5a62;--card:#1d2140;--nav:#3b52c4}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior-y:contain}
[hidden]{display:none!important}
main{max-width:640px;margin:0 auto;padding:10px 10px 40px}
nav{display:flex;flex-wrap:nowrap;gap:4px;justify-content:center;margin-bottom:6px;max-width:100%}#menu{--mb:clamp(34px,calc((100vw - 52px)/7),50px)}#menu button{width:var(--mb);height:var(--mb);border-radius:9px;flex:0 1 auto}#menu .ic{width:calc(var(--mb)*.6);height:calc(var(--mb)*.6)}#menu2{flex-wrap:wrap}main{touch-action:pan-y}
.seg{display:flex;border-radius:10px;overflow:hidden}
.seg button{border-radius:0}
button{font:inherit;cursor:pointer;border:0;color:#fff;background:var(--nav);width:46px;height:46px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0}
button.on{background:var(--acc)}
#mbody button.setting-toggle{width:100%;min-height:42px;padding:7px 12px;justify-content:space-between;border-radius:9px;color:#fff;font-weight:700;text-align:left}
#mbody button.setting-toggle.enabled{background:#168447}
#mbody button.setting-toggle.disabled{background:#d85b91}
#mbody button.setting-choice{width:auto;min-height:38px;padding:6px 10px;margin:2px;border-radius:8px;background:#d85b91;color:#fff}
#mbody button.setting-choice.enabled{background:#168447}
#mbody .setting-row{margin:0 0 8px}
#mbody .setting-state{font-size:12px;opacity:.95;margin-left:10px}
button:disabled{opacity:.35;cursor:default}
button.ok{background:#1f8a4c}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.ic{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#info{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin:4px 0 6px}
.pt{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:4px 10px;font:700 18px/1 "Stardos Stencil",Impact,sans-serif;min-height:36px}
.pt.r{justify-content:flex-end}.pt.turn{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}.pt[data-view]{cursor:pointer;user-select:none;-webkit-user-select:none}.pt.view{outline:3px solid #168447;outline-offset:1px}.pt[data-view]:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.pt .ic{color:var(--mut);width:20px;height:20px}.pt.turn .ic{color:var(--acc)}
.mid{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:4px 12px;min-width:90px;min-height:36px;justify-content:center;font:700 18px/1 "Stardos Stencil",Impact,sans-serif}
.mid svg{height:22px;width:auto}
#boards{display:flex;flex-direction:column;align-items:center;gap:10px}
.sheet{width:100%;aspect-ratio:700/690;display:block;border-radius:10px;border:1.5px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
#bd2{display:none!important}
.sheet{--blue:#263a8f;--red:#e8202a;--reddk:#a8121a;--paper:#fffaf0;--zone:#b9c6f2;--req:#ffe08a;--wm:#d9cfbc}
.sheet .t{font-family:"Stardos Stencil",Impact,"Arial Black",sans-serif;font-weight:700}
.bf{fill:var(--blue)}.bs{fill:none;stroke:var(--blue)}.rs{fill:none;stroke:var(--red)}
.wm{color:var(--wm)}.pc{fill:var(--red);stroke:var(--paper);stroke-width:2}.pd{fill:var(--reddk);stroke:var(--paper);stroke-width:2}
.gok{fill:var(--blue);opacity:.6}.gbad{fill:var(--red);opacity:.35;stroke:var(--red);stroke-width:3}
#transformControls{display:none;justify-content:center;gap:7px;margin:5px 0 2px;align-items:center;width:100%}#transformControls.show{display:flex}#transformControls button{flex:1 1 0;min-width:0;max-width:100px;height:46px;border:2px solid var(--line);border-radius:10px;background:#263a8f;color:#fff;font-size:23px;font-weight:700;box-shadow:0 2px 4px #0003}#transformControls button[data-c="ok"]{background:#1f8a4c}#transformControls button[data-c="skip"]{background:#e8202a}
#rp{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin-top:10px}
#rp input{flex:1 1 140px;min-width:100px;accent-color:var(--acc)}
#rp b{font:700 18px "Stardos Stencil",Impact,sans-serif;min-width:64px;text-align:center}
#act{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px;align-items:center}
#act .sp{width:10px}
#act button.ch{width:auto;min-width:56px;min-height:56px;padding:6px 8px;background:linear-gradient(145deg,#fff,#f0eee8);border:2px solid #555;border-radius:12px;color:var(--fg);box-shadow:0 2px 4px #0002}
#act button.ch.on{border-color:#111;box-shadow:0 0 0 3px #355c7d55,0 3px 7px #0003;transform:translateY(-2px)}
#act button.ch:disabled{opacity:.35;filter:grayscale(.6)}
#msg{min-height:26px;text-align:center;color:var(--mut);margin-top:8px;font-size:14px}
#trayHint{display:none!important}
.ghostFloat{position:fixed;pointer-events:none;z-index:50;opacity:.7;display:grid}
.ghostFloat .gc{border:1px solid #222}
.ghostFloat .gc.bad{background:#d33!important}
#end{margin-top:8px;background:var(--card);border:2px solid var(--fg);border-radius:12px;padding:12px 14px;text-align:center;font-size:17px;overflow-x:auto}#end .result-title{font-weight:800;font-size:20px;margin:0 0 10px}#end table{width:100%;border-collapse:collapse;text-align:left;font-size:14px}#end th,#end td{padding:8px 7px;border-bottom:1px solid var(--line)}#end thead th{background:var(--nav);color:#fff}#end td:not(:first-child),#end th:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}#end tr.total th,#end tr.total td{font-weight:800;font-size:16px;border-top:2px solid var(--fg);border-bottom:0}#end .result-note{font-size:12px;color:var(--mut);margin-top:8px}
#modal{position:fixed;inset:0;background:rgba(10,14,40,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal .box{background:var(--card);border-radius:14px;max-width:560px;width:100%;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
#modal header{display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1.5px solid var(--line)}
#modal header button{width:42px;height:42px}
#mbody{padding:12px 14px;overflow:auto;font-size:14px}
#mbody pre{margin:0;white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
#mbody p{margin:0 0 10px}
#mbody h4{margin:14px 0 4px;font:700 15px/1.2 system-ui,sans-serif;color:var(--acc);text-transform:uppercase;letter-spacing:.04em}#mbody ul{margin:0 0 8px;padding-left:20px}#mbody li{margin:0 0 5px}
</style>

<script>
const $=id=>document.getElementById(id);
const IC={user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>',
bot:'<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4"/><circle cx="12" cy="3.5" r="1"/><circle cx="9" cy="14" r="1.2"/><circle cx="15" cy="14" r="1.2"/>',
star:'<path d="M12 3l2.8 6 6.2.8-4.6 4.4 1.2 6.8L12 17.7 6.4 21l1.2-6.8L3 9.8 9.2 9z"/>',
req:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>',
wall:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18M3 12h18" stroke-width="1" /><path d="M5 8h14" stroke-width="4" stroke="#ff7b83"/>',
irr:'<path d="M4 4h9v6h7v10H9v-6H4z"/>',
save:'<path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h7V3M8 21v-7h8v7"/>',
load:'<path d="M3 7h7l2 2h9v10H3z"/><path d="M12 12v5m-2.5-2.5L12 17l2.5-2.5"/>',
redo:'<path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/>',
log:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/>',
play:'<circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z"/>',
help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.6 2.6 0 1 1 3.6 2.4c-.7.4-1.1 1-1.1 1.8M12 17v.2"/>',
copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
x:'<path d="M6 6l12 12M18 6L6 18"/>',check:'<path d="M5 12.5l4.5 4.5L19 7"/>',
rot:'<path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/>',flip:'<path d="M12 3v18" stroke-dasharray="2 3"/><path d="M9 7L3 17h6zM15 7l6 10h-6z"/>',
skip:'<path d="M5 5l9 7-9 7zM17 5v14"/>',first:'<path d="M6 5v14M18 5l-9 7 9 7z"/>',prev:'<path d="M17 5l-9 7 9 7z"/>',next:'<path d="M7 5l9 7-9 7z"/>',last:'<path d="M18 5v14M6 5l9 7-9 7z"/>',pause:'<path d="M8 5v14M16 5v14"/>',
bonus:'<rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/>'};
const ico=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
function rng32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const nb=i=>{const r=i/9|0,c=i%9,o=[];if(r>0)o.push(i-9);if(r<8)o.push(i+9);if(c>0)o.push(i-1);if(c<8)o.push(i+1);return o};
/* ---------- generátory mřížky ---------- */
function standard(){return Array.from({length:81},(_,i)=>(i/27|0)*3+((i%9)/3|0))}
function relabel(reg){const m={};let n=0;return reg.map(k=>{if(!(k in m))m[k]=n++;return m[k]})}
function span(reg,k){let r0=9,r1=-1,c0=9,c1=-1;for(let i=0;i<81;i++)if(reg[i]===k){const r=i/9|0,c=i%9;r0=Math.min(r0,r);r1=Math.max(r1,r);c0=Math.min(c0,c);c1=Math.max(c1,c)}return[r1-r0+1,c1-c0+1]}
function connected(reg,k){const s=reg.indexOf(k),seen=new Set([s]),st=[s];while(st.length){const x=st.pop();for(const j of nb(x))if(reg[j]===k&&!seen.has(j)){seen.add(j);st.push(j)}}return seen.size===9}
// Nepravidelné sektory: start z 3×3, náhodné výměny polí; platí jen když zůstanou oba sektory souvislé s 9 poli.
function generate(seed,depth=0){
 const rnd=rng32(seed),reg=standard();
 for(let it=0;it<6000;it++){
  const a=rnd()*81|0,A=reg[a],ns=nb(a).filter(j=>reg[j]!==A);if(!ns.length)continue;
  const B=reg[ns[rnd()*ns.length|0]],cand=[];
  for(let i=0;i<81;i++)if(reg[i]===B&&nb(i).some(j=>reg[j]===A))cand.push(i);
  const b=cand[rnd()*cand.length|0];reg[a]=B;reg[b]=A;
  let ok=connected(reg,A)&&connected(reg,B);
  if(ok)for(const k of[A,B]){const[h,w]=span(reg,k);if(h>6||w>6)ok=false}
  if(!ok){reg[a]=A;reg[b]=B}}
 for(let k=0;k<9;k++){const[h,w]=span(reg,k);if(h===3&&w===3&&depth<5)return generate(seed+7919,depth+1)}
 return relabel(reg)}
// Nepřekročitelné hranice: 3 čáry po 2 polích, každá v jiném sektoru, uvnitř sektoru, nedotýkají se okraje, od sebe ≥3 pole.
function genWalls(rnd){
 for(let t=0;t<1000;t++){
  const secs=[...Array(9).keys()];for(let i=8;i>0;i--){const j=rnd()*(i+1)|0;[secs[i],secs[j]]=[secs[j],secs[i]]}
  const segs=[];let ok=true;
  for(const k of secs.slice(0,3)){
   const sr=k/3|0,sc=k%3,hor=rnd()<.5,lb=(hor?sr:sc)*3,ob=(hor?sc:sr)*3;
   const L=lb+(rnd()*2|0),opts=[ob,ob+1].filter(s=>s>0&&s+2<9);
   if(!opts.length){ok=false;break}
   const s0=opts[rnd()*opts.length|0];
   segs.push({hor,L,s0,cells:[0,1].flatMap(a=>[0,1].map(b=>hor?[L+a,s0+b]:[s0+a,L+b]))})}
  if(!ok)continue;
  for(let i=0;i<3&&ok;i++)for(let j=i+1;j<3&&ok;j++)for(const p of segs[i].cells)for(const q of segs[j].cells)if(Math.max(Math.abs(p[0]-q[0]),Math.abs(p[1]-q[1]))<3)ok=false;
  if(ok)return new Set(segs.flatMap(g=>[0,1].map(a=>g.hor?`h${g.L}_${g.s0+a}`:`v${g.s0+a}_${g.L}`)))}
 return new Set()}
// Povinné oblasti: řádek + sloupec + jeden ze 4 sektorů, které je neprotínají (26 polí).
function genReq(rnd){
 const r=rnd()*9|0,c=rnd()*9|0,ks=[...Array(9).keys()].filter(k=>(k/3|0)!==(r/3|0)&&k%3!==(c/3|0)),k=ks[rnd()*ks.length|0],s=new Set();
 for(let i=0;i<9;i++){s.add(r*9+i);s.add(i*9+c)}
 for(let i=0;i<81;i++)if(((i/27|0)*3+((i%9)/3|0))===k)s.add(i);
 return s}
/* ---------- tvary ---------- */
const SH={D1:[[0,0]],T:[[0,1],[1,0],[1,1],[1,2]],O:[[0,0],[0,1],[1,0],[1,1]],S:[[0,1],[0,2],[1,0],[1,1]],I:[[0,0],[0,1],[0,2],[0,3]],L:[[0,0],[1,0],[1,1],[1,2]],B1:[[0,0]],B2:[[0,0],[0,1]],B4:[[0,0],[0,1],[1,0],[1,1]]};
const FACES=['T','O','S','I','L','*'],ALL5=['T','O','S','I','L'],BONUS=['B1','B2','B4'],NAMES=['Tykev','Geta','Tomoe','Čtyřlístek','Hvězdice','Hřeben','Leknín','Vějíř','Lotos'],LET='ABCDEFGHI';
const COLORS={T:'#e8202a',O:'#263a8f',S:'#1f8a4c',I:'#c45c26',L:'#7b3fa0',B1:'#e8b923',B2:'#e8b923',B4:'#e8b923',D1:'#e8b923'};
const norm=cs=>{const mr=Math.min(...cs.map(a=>a[0])),mc=Math.min(...cs.map(a=>a[1]));return cs.map(([r,c])=>[r-mr,c-mc]).sort((a,b)=>a[0]-b[0]||a[1]-b[1])};
const rotC=cs=>norm(cs.map(([r,c])=>[c,-r])),flipC=cs=>norm(cs.map(([r,c])=>[r,-c]));
function orient(shape,rot,flip){let cs=norm(shape.map(p=>[...p]));if(flip)cs=flipC(cs);for(let i=0;i<rot;i++)cs=rotC(cs);return cs}
function orients(key){let cs=norm(SH[key]);const out=[],seen=new Set();for(let f=0;f<2;f++){for(let r=0;r<4;r++){const k=JSON.stringify(cs);if(!seen.has(k)){seen.add(k);out.push(cs)}cs=rotC(cs)}cs=flipC(cs)}return out}

function shapeCellsAt(anc){
 if(!G.cs||anc<0)return[];
 return place0(G.cs,anc).map(([r,c])=>r*9+c);
}
function canSkipTurn(){
 // A diagonal reward is mandatory and cannot be skipped.
 if(G.pendingDiag)return false;
 // Judge the currently selected shape FIRST. A different bonus shape may have
 // legal moves, but that must not keep Skip disabled when this shape has none.
 if(G.sel&&G.cs){
  return genMoves(G.ownP,[G.sel],G.mask,true).length===0;
 }
 // With no selected shape, check only the die's shapes (not bonus shapes).
 // If the die shape cannot be placed, the player may either choose a bonus
 // shape or skip; an available bonus must not disable Skip.
 const dieShapes=G.die==='*'?ALL5:[G.die];
 return genMoves(G.ownP,dieShapes,G.mask,true).length===0;
}
function paintBoard(){
 const ai=boardView==='A'&&CFG.ai;
 const tc=$('transformControls');
 tc.classList.toggle('show',!ai&&canPlay());
 tc.querySelector('[data-c=rot]').disabled=!(G.float&&G.cs&&G.anc>=0);
 tc.querySelector('[data-c=flp]').disabled=!(G.float&&G.cs&&G.anc>=0);
 tc.querySelector('[data-c=ok]').disabled=!(G.float&&G.cs&&G.anc>=0);
 tc.querySelector('[data-c=skip]').disabled=!canSkipTurn();
 $('bd').innerHTML=boardSVG(ai?G.ownA:G.ownP,G.card,{uid:ai?'a':'p',keys:ai?G.keyA:G.keyP,ghost:!ai&&canPlay()&&G.float&&!!G.cs&&G.anc>=0,noMove:!ai&&canPlay()&&!G.pendingDiag&&canSkipTurn()});
 $('bd').setAttribute('aria-label',ai?'Mřížka AI':'Vaše mřížka 9×9');
}
function paintTray(){
 const act=$('act');if(!act||act.hidden)return;
 const can=canPlay();
 // tray: tvar z kostky (nebo výběr při ★) a za ním bonusové tvary
 let keys;
 if(G.pendingDiag) keys=['D1'];
 else if(G.die==='*'&&G.sel){keys=[G.sel,...(CFG.bonus?BONUS.filter(k=>!G.bonusP[k]&&k!==G.sel):[])];}
 else keys=dieKeys(G.die,'P'); // tvar z kostky vždy první, za ním nepoužité bonusové tvary
 const shapeBtns=keys.map((k,idx)=>{
  const sel=G.sel===k;
  const gap=idx>0&&BONUS.includes(k)&&!BONUS.includes(keys[idx-1])?'<span class="sp"></span>':'';
  const ok=can&&(G.pendingDiag?k==='D1'&&G.ownP.some(v=>v<0):genMoves(G.ownP,[k],G.mask,true).length>0);
  return gap+`<button type="button" class="ch ${sel?'on':''}" data-k="${k}" ${ok&&!(G.pendingDiag&&sel)?'':'disabled'}>${mini(k,14,0,false)}</button>`;
 }).join('');
 act.innerHTML=shapeBtns;
 $('trayHint').textContent='';
}
function selectShape(k){
 boardView='P';resetOutsideTaps();floatShape(k);paintTray();paintBoard();
}
function rotateSelected(){
 if(!G.float||!G.sel)return;
 resetOutsideTaps();G.rot=((G.rot||0)+1)%4;syncCS();paintTray();paintBoard();
}
function flipSelected(){
 if(!G.float||!G.sel)return;
 resetOutsideTaps();G.flip=!G.flip;syncCS();paintTray();paintBoard();
}
// tray buttons
$('act').addEventListener('click',e=>{
 if(drag.moved){drag.moved=false;return}
 const b=e.target.closest('button');if(!b||b.disabled||!canPlay())return;
 if(b.dataset.k){selectShape(b.dataset.k);return}
 if(b.dataset.c==='rot')rotateSelected();
 else if(b.dataset.c==='flp')flipSelected();
 else if(b.dataset.c==='ok'&&G.float)put();
 else if(b.dataset.c==='skip'&&canSkipTurn()){apply('P',null,null);after('P')}
});
// Rotation and flip controls stay below the board.
$('transformControls').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled||!canPlay())return;if(b.dataset.c==='rot')rotateSelected();else if(b.dataset.c==='flp')flipSelected();else if(b.dataset.c==='ok'&&G.float)put();else if(b.dataset.c==='skip'&&canSkipTurn()){apply('P',null,null);after('P')}});
// board: drag floating shape; outside tap places (1× desktop, 2× mobile)
const isTouchUI=()=>window.matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
let outsideTaps=0,outsideTapTimer=null;
function resetOutsideTaps(){outsideTaps=0;if(outsideTapTimer){clearTimeout(outsideTapTimer);outsideTapTimer=null}}
$('bd').addEventListener('pointerdown',e=>{
 if(boardView!=='P'||!canPlay()||!G.float||!G.cs||e.button!==0)return;e.preventDefault();
 const i=cellAt(e);if(i<0)return;
 const cells=shapeCellsAt(G.anc);
 if(cells.includes(i)){
  resetOutsideTaps();
  drag={on:true,moved:false,x:e.clientX,y:e.clientY,startAnc:G.anc};
  try{$('bd').setPointerCapture(e.pointerId)}catch(err){}
 }else{
  // mobile: 2 taps outside to confirm; desktop: 1 tap
  if(isTouchUI()){
   outsideTaps++;
   if(outsideTaps>=2){resetOutsideTaps();put()}
   else{
    G.msg='Znovu klepněte mimo tvar pro potvrzení umístění.';
    $('msg').textContent=G.msg;
    if(outsideTapTimer)clearTimeout(outsideTapTimer);
    outsideTapTimer=setTimeout(()=>{resetOutsideTaps();if(G.msg&&G.msg.indexOf('Znovu klepněte')===0){G.msg='';$('msg').textContent=''}},2500);
   }
  }else{resetOutsideTaps();put()}
 }
});
$('bd').addEventListener('pointermove',e=>{
 if(!drag.on||!G.float||boardView!=='P')return;e.preventDefault();
 if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8)drag.moved=true;
 if(!drag.moved)return;
 const i=cellAt(e);
 if(i>=0&&i!==G.anc){
  const h=Math.max(...G.cs.map(p=>p[0]))+1,w=Math.max(...G.cs.map(p=>p[1]))+1;
  const rr=Math.max(0,Math.min(9-h,(i/9|0))),cc=Math.max(0,Math.min(9-w,i%9));
  const a=rr*9+cc;if(a!==G.anc){resetOutsideTaps();G.anc=a;paintBoard()}
 }
});
$('bd').addEventListener('pointerup',e=>{
 if(!drag.on)return;e.preventDefault();
 drag.on=false;
 // if only a tiny movement on the shape, do nothing (stay floating)
});
$('info').addEventListener('click',e=>{const p=e.target.closest('[data-view]');if(!p)return;const v=p.dataset.view;if(v==='A'&&!CFG.ai)return;boardView=v;draw()});
$('info').addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const p=e.target.closest('[data-view]');if(!p)return;e.preventDefault();const v=p.dataset.view;if(v==='A'&&!CFG.ai)return;boardView=v;draw()});
$('menu').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
 if(a==='ai'){CFG.ai=!CFG.ai;restart()}
 else if(a==='bonus'){CFG.bonus=!CFG.bonus;restart()}
 else if(a==='promo'){CFG.promo=!CFG.promo;restart()}else if(a==='settings')openSettings()
 else if(a==='save')save();else if(a==='load')load();else if(a==='restart')restart();
 else if(a==='log')openLog();else if(a==='help')openHelp();
 else if(a==='rep'){if(G.rep){clearInterval(TM);G.rep=null}else G.rep={step:0,playing:false};draw()}});
$('menu2').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;CFG.pm=b.dataset.a.slice(3);restart()});
function repStep(s){G.rep.step=Math.max(0,Math.min(G.log.length,s));if(G.rep.step>=G.log.length&&G.rep.playing){G.rep.playing=false;clearInterval(TM)}draw()}
$('rp').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const r=b.dataset.r,st=G.rep.step;
 if(r==='first')repStep(0);else if(r==='prev')repStep(st-1);else if(r==='next')repStep(st+1);else if(r==='last')repStep(G.log.length);
 else if(r==='pp'){clearInterval(TM);G.rep.playing=!G.rep.playing;if(G.rep.playing){if(st>=G.log.length)G.rep.step=0;TM=setInterval(()=>G.rep&&repStep(G.rep.step+1),800)}draw()}});
$('rp').addEventListener('input',e=>{if(e.target.type==='range'){clearInterval(TM);G.rep.playing=false;repStep(+e.target.value)}});
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='escape')closeModal();else if(!$('modal').hidden)return;else if(k==='r')rotateSelected();else if(k==='f')flipSelected();else if(k==='enter'&&e.target.tagName!=='BUTTON'){e.preventDefault();put()}});
try{const savedSettings=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'null');if(savedSettings&&typeof savedSettings==='object')CFG={...CFG,...savedSettings}}catch(e){}
init();
</script>
</body>
</html>
