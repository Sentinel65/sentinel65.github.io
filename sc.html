 if(flip){

  if(!board[r][c]){

function minimaxAI(board,deck,cards,depth,alpha,beta,maximizing){

  player:null, ai:null, viewBoard:'player', firstFailed:null,
  soloBoards:[]
 };
 state.player=createPlayerState();
 if(mode==='ai'){
  state.ai=createPlayerState();
  autoPlaceStart(state.ai);
  document.getElementById('subTitle').textContent=t('subAi');
  setVisibleBoard('player');
 }else{
  document.getElementById('subTitle').textContent=t('sub');
  setVisibleBoard('player');
 }
 state.board=state.player.board;
 updateModeIcon();
 render();
}
function drawCard(){
 if(!state.deck.length) return null;
 return state.deck.shift();
}
function afterPlayerPlacement(){
 if(state.mode==='solo'){
  if(state.player.phase==='start'){
   state.player.phase='normal';
   state.cards=[drawCard(),drawCard()].filter(Boolean);
   render(); return;
  }
  if(countEmpty(state.player.board)===0){ finishSoloGame(true); return; }
  if(state.player.phase==='second'){
   state.player.phase='normal';
   state.cards=[drawCard(),drawCard()].filter(Boolean);
   nextSoloRound(); return;
  }
  const justPlaced=state.player.used[state.player.used.length-1];
  (state.cards||[]).forEach(cid=>{ if(cid!==justPlaced) state.player.discarded.push(cid); });
  const a=drawCard(), b=drawCard();
  if(a==null||b==null){ if(a!=null) state.player.discarded.push(a); state.cards=[]; finishSoloGame(false); return; }
  state.cards=[a,b];
  nextSoloRound();
 }else{
  // AI mode: shared offer of 2 cards – both may use the same shape.
  // After start is placed, only draw the first pair for the player (AI already placed start).
  if(state.player.phase==='start'){
   state.player.phase='normal';
   state.cards=[drawCard(),drawCard()].filter(Boolean);
   render();
   autoSecondChancePlayer();
   return;
  }
  // Player just placed a normal / second-chance tile → AI plays from the SAME offer, then new pair.
  if(state.player.phase==='second') state.player.phase='normal';
  // Keep a snapshot of the current offer so AI sees the same two cards the player had.
  const offerForAi=state.cards.slice();
  state.aiThinking=true;
  document.getElementById('gameStatus').textContent=t('aiThinking');
  setTimeout(()=>{
   // Temporarily ensure AI evaluates the same offer
   const saved=state.cards;
   state.cards=offerForAi;
   aiChooseAndPlace();
   state.cards=saved;
   state.aiThinking=false;
   afterBothPlayed();
  },500);
 }
}
function afterBothPlayed(){
 // Discard the shared offer (both could have used either card independently)
 if(state.cards&&state.cards.length){
  // Keep discarded for overview (cards that left the table this round)
  state.player.discarded.push(...state.cards);
  if(state.ai) state.ai.discarded.push(...state.cards);
 }
 state.cards=[];
 if(state.player.gameOver && state.ai.gameOver){ finishAiGame(); return; }
 if(state.player.gameOver){ continueAiAlone(); return; }
 const a=drawCard(), b=drawCard();
 if(a==null||b==null){
  if(!state.player.gameOver) state.player.gameOver=true;
  if(!state.ai.gameOver) state.ai.gameOver=true;
  finishAiGame(); return;
 }
 state.cards=[a,b];
 render();
 autoSecondChancePlayer();
}
function continueAiAlone(){
 // Discard previous offer if any
 if(state.cards&&state.cards.length){
  state.player.discarded.push(...state.cards);
  if(state.ai) state.ai.discarded.push(...state.cards);
  state.cards=[];
 }
 const a=drawCard(), b=drawCard();
 if(a==null||b==null){ state.ai.gameOver=true; state.aiThinking=false; finishAiGame(); return; }
 state.cards=[a,b];
 state.aiThinking=true;
 document.getElementById('gameStatus').textContent=t('aiThinking');
 render();
 setTimeout(()=>{
  aiChooseAndPlace();
  if(state.ai.gameOver){ state.aiThinking=false; finishAiGame(); }
  else setTimeout(continueAiAlone,600);
 },400);
}
function nextSoloRound(){
 if(state.cards.length<2){ finishSoloGame(false); return; }
 render();
 autoSecondChancePlayer();
}
function playerCannotContinue(){
 // If AI already wrote the 1, player just ends without writing another 1
 if(state.mode==='ai'){
  if(state.firstFailed){
   state.player.gameOver=true;
   state.player.phase='ended';
   state.cards=[];
   render();
   finishAiGame();
  }else{
   state.player.phase='mark1';
   render();
   toast(t('markOne'));
  }
 }else{
  finishSoloGame(false);
 }
}
function autoSecondChancePlayer(){
 if(state.player.phase!=='normal'||state.cards.length<2) return;
 const board=state.player.board;
 const a=getCard(state.cards[0]), b=getCard(state.cards[1]);
 if(!canFit(a,board)&&!canFit(b,board)){
  toast(t('noFit'));
  setTimeout(()=>{
   state.player.discarded.push(...state.cards);
   state.cards=[];
   const extra=drawCard();
   if(extra==null){
    playerCannotContinue();
    return;
   }
   state.player.phase='second';
   state.cards=[extra];
   state.selected=null; state.rot=0; state.flip=false;
   render();
   if(canFit(getCard(extra),board)) toast(t('secondFit'));
   else setTimeout(()=>{
    if(state.mode==='ai'){
     state.player.discarded.push(extra);
     state.cards=[];
     playerCannotContinue();
    }else{
     state.player.discarded.push(extra); state.cards=[]; finishSoloGame(false);
    }
   },500);
  },500);
 }
}
function finishSoloGame(full){
 const empty=countEmpty(state.player.board);
 state.total+=empty;
 state.player.gameOver=true; state.player.phase='ended';
 state.history.push({end:true,empty,full});
 if(!state.soloBoards) state.soloBoards=[];
 state.soloBoards.push({game:state.game,empty,full,board:clone(state.player.board),lastSeq:state.player.lastSeq||0});
 render();
 roundTimer=setTimeout(()=>{
  if(state.game<3){
   const next=state.game+1, total=state.total;
   toast(t('next')+' '+next);
   roundTimer=setTimeout(()=>{
    state.game=next; state.total=total;
    state.player=createPlayerState();
    state.deck=shuffle(NORMAL_CARDS.map(c=>c.id));
    state.cards=[]; state.board=state.player.board;
    render();
   },900);
  }else showSoloResult();
 },250);
}

function boardHasOne(board){
 for(let r=0;r<9;r++) for(let c=0;c<9;c++) if(board[r][c]&&board[r][c].one) return true;
 return false;
}
function finishAiGame(){
 state.player.gameOver=true;
 state.ai.gameOver=true;
 state.player.phase='ended';
 render();
 const pe=countEmpty(state.player.board);
 const ae=countEmpty(state.ai.board);
 let winner, byOne=false;
 if(pe<ae) winner='player';
 else if(ae<pe) winner='ai';
 else{
  // Equal empties → who has the digit 1 wins (no draws by the rules)
  byOne=true;
  const p1=boardHasOne(state.player.board), a1=boardHasOne(state.ai.board);
  if(p1&&!a1) winner='player';
  else if(a1&&!p1) winner='ai';
  else if(state.firstFailed==='player') winner='player';
  else if(state.firstFailed==='ai') winner='ai';
  else winner='player';
 }
 const msg=byOne?t('winByOne'):(winner==='player'?t('youWin'):t('aiWins'));
 const pIcon=winner==='player'?'🏆👤':'👤';
 const aIcon=winner==='ai'?'🏆🖥️':'🖥️';
 recordHistory('ai',{pe,ae,winner,byOne,snapshot:clone(state)});
 openModal(t('statsTitle'),`
  <div class="result">
   <div class="resultMsg">${msg}</div>
   <div class="resultLine">${pIcon} [${pe}] : ${aIcon} [${ae}]</div>
  </div>
  <div class="actions">
   <button onclick="showBothBoards()">${t('viewBoards')}</button>
  </div>`);
}

function loadHistoryStore(){
 try{ return JSON.parse(localStorage.getItem(HISTORY_STORAGE))||{solo:{},ai:{}}; }
 catch(e){ return {solo:{},ai:{}}; }
}
function recordHistory(mode,data){
 const h=loadHistoryStore();
 if(!h[mode]) h[mode]={};
 const entry={...data,date:new Date().toISOString()};
 h[mode].last=entry;
 if(mode==='solo'){
  if(!h.solo.best||entry.total<(h.solo.best.total??Infinity)) h.solo.best=entry;
 }else{
  const better=!h.ai.best
   || entry.pe<(h.ai.best.pe??Infinity)
   || (entry.pe===h.ai.best.pe&&entry.winner==='player'&&h.ai.best.winner!=='player');
  if(better) h.ai.best=entry;
 }
 try{ localStorage.setItem(HISTORY_STORAGE,JSON.stringify(h)); }catch(e){}
}
function formatHistDate(iso){
 if(!iso) return '';
 try{
  const d=new Date(iso);
  return d.toLocaleString(lang==='cs'?'cs-CZ':'en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
 }catch(e){ return iso; }
}

  if(chart){

function loadHistorySnapshot(snapshot){
 try{
  state=clone(snapshot);
  if(!state.viewBoard) state.viewBoard='player';
  document.getElementById('subTitle').textContent=state.mode==='ai'?t('subAi'):t('sub');

   setTimeout(showSoloResult,80);
  } else if(state.mode==='ai' && state.player && state.ai && state.player.gameOver && state.ai.gameOver){
   setTimeout(showBothBoards,80);
  }

}
function renderBoardTo(el,board,lastSeq){
 el.innerHTML='';
 for(let r=0;r<9;r++) for(let c=0;c<9;c++){
  const q=document.createElement('div'); q.className='cell';
  if(r===4&&c===4) q.classList.add('center');
  const v=board[r][c];
  if(v){
   if(v.one){ q.classList.add('one'); q.textContent='1'; }
   else{
    q.classList.add('filled');
    q.style.setProperty('--fill',v.color||'#777');
    if(v.pattern!=null) q.classList.add('hatch'+(v.pattern%6));
    if(v.start) q.classList.add('start');
    if(v.second) q.classList.add('second');
    // Black dots only on the single last non-start placement
    if(lastSeq&&v.seq===lastSeq&&!v.start) q.classList.add('lastDot');
   }
  }else if(r===4&&c===4) q.classList.add('empty');
  q.dataset.r=r; q.dataset.c=c;
  el.appendChild(q);
 }
}

/* ========== RENDER ========== */
function renderShape(card,scale=1){
 const s=card.shape||card;
 const maxR=Math.max(...s.map(p=>p[0])),maxC=Math.max(...s.map(p=>p[1]));
 const el=document.createElement('div'); el.className='shape';
 const unit=Math.max(10,Math.min(25,22*scale));
 el.style.gridTemplateRows=`repeat(${maxR+1},${unit}px)`;
 el.style.gridTemplateColumns=`repeat(${maxC+1},${unit}px)`;
 for(const [r,c] of s){ const q=document.createElement('div'); q.className='sq'; q.style.gridRow=r+1; q.style.gridColumn=c+1; q.style.background=card.color||'#555'; el.appendChild(q); }
 return el;
}
function renderBoard(){

 renderBoardTo(document.getElementById('board'), state.player?state.player.board:emptyBoard(), pLast);
 if(state.mode==='ai'&&state.ai){
  const aLast=lastPlacedSeq(state.ai);
  renderBoardTo(document.getElementById('aiBoard'), state.ai.board, aLast);
 }
}
function renderTray(){
 const tray=document.getElementById('tray'); tray.innerHTML='';
 const who=state.player;
 const trayTitle=document.querySelector('.trayTitle');
 if(!who) return;
 const noCards=who.phase==='mark1'||who.phase==='ended'||(state.mode==='ai'&&who.gameOver&&state.ai&&state.ai.gameOver);
 trayTitle.classList.toggle('centered', noCards||who.phase==='mark1');
 if(who.phase==='ended'||(state.mode==='ai'&&who.gameOver&&state.ai&&state.ai.gameOver)){
  document.getElementById('trayLabel').textContent='';
  document.getElementById('selectionLabel').textContent='';
  document.getElementById('rotHint').textContent=t('rotHint');

 }
 if(who.phase==='mark1'){
  document.getElementById('trayLabel').textContent=t('markOne');

  document.getElementById('rotHint').textContent='';

 if(who.phase==='start'){

 }else if(who.phase==='second'){

 }else{

 }
 document.getElementById('selectionLabel').textContent=state.selected!=null?`↻ ${state.rot*90}°${state.flip?' ↔':''}`:'';

function cardEl(card,isSecond,isStart=false){
 const el=document.createElement('div'); el.className='card'+(isSecond?' second':'');
 if(state.selected===card.id) el.classList.add('selected');
 const board=state.player?state.player.board:null;
 const nofit=!isStart&&board&&!canFit(card,board);
 if(nofit) el.classList.add('nofit');
 const n=document.createElement('span'); n.className='num'; n.textContent=isStart?'START':'#'+String(card.id).padStart(2,'0'); el.appendChild(n);
 const o=orient(card.shape,state.selected===card.id?state.rot:0,state.selected===card.id?state.flip:false);
 el.appendChild(renderShape({shape:o,color:nofit?'#999':card.color},.65));
 el.dataset.id=card.id;
 if(nofit) return el;
 el.addEventListener('click',e=>{
  e.stopPropagation();
  if(drag.moved){ drag.moved=false; return; }
  if(state.selected!==card.id){ state.selected=card.id; state.rot=0; state.flip=false; renderTray(); return; }
  clearTimeout(rotateTimer);
  rotateTimer=setTimeout(()=>{ state.rot=(state.rot+1)%4; renderTray(); },230);
 });
 el.addEventListener('dblclick',e=>{
  e.preventDefault(); e.stopPropagation(); drag.moved=false; clearTimeout(rotateTimer);
  if(state.selected!==card.id){ state.selected=card.id; state.rot=0; state.flip=false; }
  state.flip=!state.flip; renderTray();
 });
 el.addEventListener('pointerdown',e=>{
  if(e.button!==0) return;
  drag.active=true; drag.id=card.id; drag.moved=false; drag.downX=e.clientX; drag.downY=e.clientY;
  if(state.selected!==card.id){ state.selected=card.id; state.rot=0; state.flip=false; renderTray(); }
  updateGhost(e.clientX,e.clientY);
 });
 return el;
}
function updateGhost(x,y){
 const b=document.getElementById('board'), rect=b.getBoundingClientRect();
 if(x<rect.left||x>rect.right||y<rect.top||y>rect.bottom){ removeGhost(); return; }
 const cellW=rect.width/9, cellH=rect.height/9;
 const c=Math.floor((x-rect.left)/cellW), r=Math.floor((y-rect.top)/cellH);
 const who=state.player;
 const card=(who.phase==='start'&&who.startCard&&(drag.id==='start'||state.selected==='start'))?who.startCard:getCard(drag.id||state.selected);
 if(!card) return;
 const shape=orient(card.shape,state.rot,state.flip);
 const maxR=Math.max(...shape.map(p=>p[0])), maxC=Math.max(...shape.map(p=>p[1]));
 const ghost=document.getElementById('ghost')||document.createElement('div'); ghost.id='ghost'; ghost.className='ghost';
 ghost.style.left=(c*cellW)+'px'; ghost.style.top=(r*cellH)+'px';
 ghost.style.width=((maxC+1)*cellW)+'px'; ghost.style.height=((maxR+1)*cellH)+'px';
 ghost.style.gridTemplateRows=`repeat(${maxR+1},${cellH}px)`; ghost.style.gridTemplateColumns=`repeat(${maxC+1},${cellW}px)`;
 ghost.innerHTML='';
 const ok=fits(shape,r,c,who.board);
 for(const [rr,cc] of shape){ const q=document.createElement('div'); q.className='ghostCell'+(ok?'':' invalid'); q.style.gridRow=rr+1; q.style.gridColumn=cc+1; ghost.appendChild(q); }
 if(!ghost.parentElement) b.appendChild(ghost);
}
function removeGhost(){ document.getElementById('ghost')?.remove(); }
function placeSelectedAt(r,c){
 const who=state.player;
 if(who.phase==='mark1'){
  if(who.board[r][c]) return false;
  // Only the first side that fails second chance writes a 1
  if(!state.firstFailed){
   state.firstFailed='player';
   who.board[r][c]={one:true,color:'#222'};
  }
  who.gameOver=true; who.phase='ended';
  state.selected=null; removeGhost(); render();
  toast(lang==='cs'?'Končíš. AI dohrává.':'You end. AI finishes.');
  state.aiThinking=true;
  document.getElementById('gameStatus').textContent=t('aiThinking');
  // AI still gets the current shared offer (if any), then continues alone
  setTimeout(()=>{
   if(state.cards&&state.cards.length){
    aiChooseAndPlace();
   }
   state.aiThinking=false;
   setTimeout(continueAiAlone,400);
  },500);
  return true;
 }
 const id=state.selected; if(id==null) return false;
 const isStart=id==='start';
 const card=isStart?who.startCard:getCard(id); if(!card) return false;
 const shape=orient(card.shape,state.rot,state.flip);
 if(isStart && !shape.some(([rr,cc])=>r+rr===4&&c+cc===4)){
  toast(lang==='cs'?'Startovní dílek musí zakrývat středové kolečko.':'The starting tile must cover the center circle.'); return false;
 }
 if(!fits(shape,r,c,who.board)){ toast(lang==='cs'?'Tento dílek sem nelze umístit.':'This tile cannot be placed here.'); return false; }
 const snapshot=clone(state); snapshot.undo=null;
 state.undo=snapshot;
 const pattern=isStart?null:pickPattern(shape,r,c,card.color,who.board);
 if(!isStart){ who.placeSeq=(who.placeSeq||0)+1; who.lastSeq=who.placeSeq; }
 const seq=isStart?0:who.placeSeq;
 shape.forEach(([rr,cc])=>who.board[r+rr][c+cc]={color:card.color,pattern,start:isStart,second:who.phase==='second',tileId:isStart?'start':id,seq});
 if(!isStart){ who.used.push(id); who.placed++; }
 who.history.push({id,r,c,rot:state.rot,flip:state.flip,start:isStart});
 state.selected=null; state.rot=0; state.flip=false; removeGhost(); render();
 clearTimeout(roundTimer); roundTimer=setTimeout(afterPlayerPlacement,50); return true;
}
function undoLast(){
 if(!state.undo){ toast(t('noUndo')); return; }
 clearTimeout(roundTimer); clearTimeout(rotateTimer); removeGhost();
 const restored=clone(state.undo); restored.undo=null; state=restored;
 drag={active:false,id:null,moved:false,downX:0,downY:0}; render(); toast(t('undoDone'));
}

/* ========== UI ========== */
function openModal(title,body,size){
 const dlg=document.querySelector('#modal .dialog');
 dlg.classList.remove('narrow','wide');
 if(size==='narrow'||size==='wide') dlg.classList.add(size);
 document.getElementById('modalTitle').textContent=title;
 document.getElementById('modalBody').innerHTML=body;
 document.getElementById('modal').classList.add('open');
 document.getElementById('modal').scrollTop=0;
}
function closeModal(){
 document.getElementById('modal').classList.remove('open');
 const dlg=document.querySelector('#modal .dialog');
 if(dlg) dlg.classList.remove('narrow','wide','boardsFit');
}
function showOverview(){
 const usedP=state.player?state.player.used:[];
 const discP=state.player?state.player.discarded:[];
 const usedA=state.ai?state.ai.used:[];
 const discA=state.ai?state.ai.discarded:[];
 const items=NORMAL_CARDS.map(card=>{
  const isUsed=usedP.includes(card.id)||discP.includes(card.id)||usedA.includes(card.id)||discA.includes(card.id);
  const o=orient(card.shape,0,false);
  const d=document.createElement('div'); d.className='ovCard'+(isUsed?' used':'');
  const row=document.createElement('div'); row.className='ovRow';
  const num=document.createElement('div'); num.className='ovNum'; num.textContent='#'+String(card.id).padStart(2,'0'); row.appendChild(num);
  row.appendChild(renderShape({shape:o,color:isUsed?'#777':card.color},.8)); d.appendChild(row);
  return d.outerHTML;
 }).join('');
 const startItems=START_CARDS.map((sc,i)=>{
  const usedS=(state.player&&state.player.startCardIndex===i)||(state.ai&&state.ai.startCardIndex===i);
  const o=orient(sc.shape,0,false);
  const d=document.createElement('div'); d.className='ovCard'+(usedS?' used':'');
  const row=document.createElement('div'); row.className='ovRow';
  const num=document.createElement('div'); num.className='ovNum'; num.textContent='#'+String(i+1).padStart(2,'0'); row.appendChild(num);
  row.appendChild(renderShape({shape:o,color:usedS?'#ccc':'#555'},.8)); d.appendChild(row);
  return d.outerHTML;
 }).join('');
 openModal(t('overview'),`<p>${lang==='cs'?'Šedé dílky už nejsou v této hře k dispozici (umístěny hráčem/AI nebo zahozeny).':'Grey tiles are no longer available (placed by player/AI or discarded).'}</p><div class="overview">${items}</div><h3 class="ovHeading">${t('startTiles')}</h3><div class="overview">${startItems}</div>`,'wide');
}
function showHelp(){
 openModal(t('helpTitle'),`<div class="helpText">${t('rulesHtml')}</div>`,'narrow');
}
function gameInProgress(){
 if(!state||!state.player) return false;
 if(state.mode==='solo'&&(state.game>1||(state.total||0)>0)) return true;
 if(state.player.phase&&state.player.phase!=='start') return true;
 if(state.player.history&&state.player.history.length) return true;
 if(state.player.used&&state.player.used.length) return true;
 if(state.player.gameOver) return true;
 if(state.ai&&state.ai.gameOver) return true;
 return false;
}
function updateModeIcon(){
 const btn=document.getElementById('settingsBtn');
 if(!btn) return;
 const mode=state&&state.mode?state.mode:'ai';
 btn.textContent=mode==='ai'?'🖥️':'👤';
 btn.title=mode==='ai'?(lang==='cs'?'Režim: Proti AI (klik = SOLO)':'Mode: VS AI (click = SOLO)'):(lang==='cs'?'Režim: SOLO (klik = Proti AI)':'Mode: SOLO (click = VS AI)');
}
function requestNewGame(mode){
 const m=mode||(state&&state.mode)||'ai';
 if(!gameInProgress()){
  newGame(m); toast(t('newGame')); return;
 }
 gameConfirm(t('confirmNewGame'),()=>{ newGame(m); toast(t('newGame')); });
}
function toggleModeAndStart(){
 const cur=state&&state.mode?state.mode:'ai';
 const next=cur==='ai'?'solo':'ai';
 requestNewGame(next);
}
function showModeSelect(){ toggleModeAndStart(); }
function startMode(m){ requestNewGame(m); }
function saveGame(){
 try{ localStorage.setItem(START_STORAGE,JSON.stringify(state)); toast(t('saved')); }catch(e){ toast(t('saveError')); }
}
function loadGame(){
 try{
  const x=JSON.parse(localStorage.getItem(START_STORAGE));
  if(!x||x.version!==3) throw Error();
  state=x;
  if(!state.viewBoard) state.viewBoard='player';
  if(state.mode==='ai'){
   document.getElementById('subTitle').textContent=t('subAi');
   setVisibleBoard(state.viewBoard||'player');
  }else{
   document.getElementById('subTitle').textContent=t('sub');
   setVisibleBoard('player');
  }
  render(); toast(t('loaded'));
 }catch(e){ toast(t('badLoad')); }
}
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toast.timer); toast.timer=setTimeout(()=>el.classList.remove('show'),1900); }
function applyLang(){
 document.documentElement.lang=lang;
 document.getElementById('subTitle').textContent=state&&state.mode==='ai'?t('subAi'):t('sub');
 document.getElementById('undoBtn').title=t('undo');
 document.getElementById('saveBtn').title=t('save'); document.getElementById('loadBtn').title=t('load');
 document.getElementById('statsBtn').title=t('stats'); document.getElementById('restartBtn').title=t('restart');
 document.getElementById('langBtn').title=t('lang'); document.getElementById('helpBtn').title=t('help');
 document.getElementById('historyBtn').title=t('history');
 updateModeIcon();
 document.getElementById('langBtn').textContent=lang==='cs'?'🇬🇧':'🇨🇿';
 document.getElementById('rotHint').textContent=t('rotHint');
 document.getElementById('boardHint').textContent=t('boardSwitchHint');
 if(state&&state.mode==='ai'){
  document.getElementById('boardTitle').textContent=state.viewBoard==='ai'?t('boardAi'):t('boardPlayer');
 }
 render();
}
function render(){
 if(!state||!state.player) return;
 renderBoard(); renderTray();
 if(state.mode==='solo'){
  document.getElementById('gameStatus').textContent=t('game')+' '+state.game+t('of');
 }else if(state.aiThinking){
  document.getElementById('gameStatus').textContent=t('aiThinking');
 }else if(state.player.gameOver){
  document.getElementById('gameStatus').textContent=(state.ai&&state.ai.gameOver)?t('end'):t('aiThinking');
 }else{
  document.getElementById('gameStatus').textContent=t('yourTurn');
 }
 updateStatusCounts();
}

/* ========== EVENTS ========== */
document.addEventListener('pointermove',e=>{ if(!drag.active) return; if(Math.hypot(e.clientX-drag.downX,e.clientY-drag.downY)>6) drag.moved=true; updateGhost(e.clientX,e.clientY); });
document.addEventListener('pointerup',e=>{
 if(!drag.active) return;
 const moved=drag.moved; drag.active=false; removeGhost();
 const b=document.getElementById('board'), rect=b.getBoundingClientRect();
 if(e.clientX>=rect.left&&e.clientX<=rect.right&&e.clientY>=rect.top&&e.clientY<=rect.bottom){
  const c=Math.floor((e.clientX-rect.left)/(rect.width/9)), r=Math.floor((e.clientY-rect.top)/(rect.height/9));
  placeSelectedAt(r,c);
 }
 drag.id=null; if(!moved) drag.moved=false;
});
document.getElementById('board').addEventListener('click',e=>{
 if(state.player&&state.player.phase==='mark1'){
  const cell=e.target.closest('.cell'); if(!cell) return;
  placeSelectedAt(+cell.dataset.r,+cell.dataset.c); return;
 }
 if(!state.selected) return;
 const cell=e.target.closest('.cell'); if(!cell) return;
 placeSelectedAt(+cell.dataset.r,+cell.dataset.c);
});
document.getElementById('saveBtn').onclick=saveGame;
document.getElementById('loadBtn').onclick=loadGame;
document.getElementById('statsBtn').onclick=showOverview;
document.getElementById('settingsBtn').onclick=toggleModeAndStart;
document.getElementById('historyBtn').onclick=showHistory;
document.getElementById('undoBtn').onclick=undoLast;
document.getElementById('helpBtn').onclick=showHelp;
document.getElementById('modalClose').onclick=closeModal;
document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
document.getElementById('confirmYes').onclick=()=>{
 const fn=confirmCallback; closeConfirm(); if(fn) fn();
};
document.getElementById('confirmNo').onclick=closeConfirm;
document.getElementById('confirmModal').addEventListener('click',e=>{ if(e.target.id==='confirmModal') closeConfirm(); });
document.getElementById('restartBtn').onclick=()=>{ requestNewGame(state&&state.mode?state.mode:'ai'); };
document.getElementById('langBtn').onclick=()=>{ lang=lang==='cs'?'en':'cs'; applyLang(); };
document.getElementById('board').addEventListener('dblclick',e=>{ e.preventDefault(); toggleBoardView(); });
document.getElementById('aiBoard').addEventListener('dblclick',e=>{ e.preventDefault(); toggleBoardView(); });
document.addEventListener('keydown',e=>{
 if(e.key==='Escape') closeModal();
 if(e.key==='r'&&state.selected){ state.rot=(state.rot+1)%4; renderTray(); }
});

/* Default: vs AI */
newGame('ai');
</script>
</body>
</html>
