<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Qwirkle – AI & Solo</title>
<style>
:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --surface2: #0f3460;
  --accent: #e94560;
  --accent2: #533483;
  --text: #eaeaea;
  --text-muted: #a0a0b0;
  --tile-bg: #2a2a4a;
  --highlight: #f9c74f;
  --success: #4ade80;
  --danger: #f87171;
  --border: #3a3a5c;
  --header-h: 48px;
  --menu-h: 48px;
  --score-h: 44px;
  --hand-h: 90px;
  --player: #60a5fa;
  --ai: #f472b6;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  overflow: hidden;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
/* ===== TITLE & SCORES ===== */
#game-title {
  position: relative;
  height: var(--header-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 10px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  z-index: 100;
  cursor: default;
}
#btn-title {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  font-size: 26px;
  font-weight: 800;
  letter-spacing: 0.14em;
  background: linear-gradient(90deg, #e94560, #a855f7, #60a5fa);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  padding: 2px 16px;
  border-radius: 6px;
  cursor: pointer;
  user-select: none;
  line-height: 1.1;
  z-index: 1;
}
#btn-title:hover { opacity: 0.85; }

.score-side {
  display: flex;
  align-items: center;
  z-index: 2;
}
.score-side.player { justify-content: flex-start; }
.score-side.ai { justify-content: flex-end; }
.score-side.solo { justify-content: flex-start; }
.score-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 10px;
  transition: background 0.2s, box-shadow 0.2s;
  background: rgba(0,0,0,0.15);
}
.score-badge .score-ico {
  width: 18px; height: 18px;
  flex-shrink: 0;
}
.score-badge .val {
  font-size: 16px;
  font-variant-numeric: tabular-nums;
  font-weight: 700;
}
.score-side.player .score-badge { color: var(--player); }
.score-side.ai .score-badge { color: var(--ai); }
.score-side.solo .score-badge { color: var(--success); }
.score-badge.active-turn {
  background: rgba(255,255,255,0.1);
  box-shadow: 0 0 0 2px currentColor;
}

@media (max-width: 480px) {
  #btn-title { font-size: 20px; letter-spacing: 0.1em; padding: 2px 8px; }
  .score-badge { padding: 2px 6px; gap: 4px; }
  .score-badge .score-ico { width: 16px; height: 16px; }
  .score-badge .val { font-size: 14px; }
}

/* ===== TOP MENU ===== */
#menu {
  height: var(--menu-h);
  background: linear-gradient(135deg, var(--surface), var(--surface2));
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 10px;
  border-bottom: 1px solid var(--border);
  gap: 6px;
  flex-shrink: 0;
  z-index: 100;
}
.menu-btn {
  width: 40px; height: 40px;
  border: none; border-radius: 10px;
  background: rgba(255,255,255,0.08);
  color: var(--text);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, transform 0.1s;
  font-size: 18px;
}
.menu-btn:hover { background: rgba(255,255,255,0.15); }
.menu-btn:active { transform: scale(0.92); }
.menu-btn.active { background: var(--accent); color: #fff; }
.menu-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.menu-btn.mode-ai { color: var(--ai); }
.menu-btn.mode-solo { color: var(--success); }

/* ===== ACTIONS BAR pod menu ===== */
#score-row {
  height: var(--score-h);
  display: flex;
  align-items: center;
  justify-content: center; 
  padding: 0 10px;
  background: rgba(15,52,96,0.45);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  font-size: 13px;
  font-weight: 700;
  gap: 8px;
}
.score-actions {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  flex-shrink: 0;
}
.score-act {
  width: 36px; height: 36px;
  border: none; border-radius: 10px;
  background: rgba(255,255,255,0.08);
  color: var(--text);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, transform 0.1s, opacity 0.15s;
}
.score-act:hover:not(:disabled) { background: rgba(255,255,255,0.16); }
.score-act:active:not(:disabled) { transform: scale(0.92); }
.score-act:disabled { opacity: 0.3; cursor: not-allowed; }
.score-act.primary { background: rgba(233,69,96,0.35); color: #fff; }
.score-act.primary:hover:not(:disabled) { background: rgba(233,69,96,0.55); }
.score-act .icon { width: 18px; height: 18px; }

/* ===== MAIN AREA ===== */
#main {
  height: calc(100% - var(--header-h) - var(--menu-h) - var(--score-h) - var(--hand-h));
  display: flex; flex-direction: column;
  position: relative;
  overflow: hidden;
}
#board-wrapper {
  flex: 1;
  overflow: auto;
  position: relative;
  background:
    radial-gradient(circle at 20% 30%, rgba(83,52,131,0.15) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(233,69,96,0.1) 0%, transparent 50%),
    var(--bg);
  cursor: grab;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: rgba(58,58,92,0.55) transparent;
}
#board-wrapper::-webkit-scrollbar { width: 8px; height: 8px; }
#board-wrapper::-webkit-scrollbar-track { background: transparent; }
#board-wrapper::-webkit-scrollbar-thumb {
  background: rgba(58,58,92,0.5);
  border-radius: 8px;
  border: 2px solid transparent;
  background-clip: padding-box;
}
#board-wrapper::-webkit-scrollbar-thumb:hover { background: rgba(90,90,130,0.7); background-clip: padding-box; }
#board-wrapper.dragging { cursor: grabbing; }
#board-wrapper.locked { pointer-events: none; opacity: 0.7; }
#board {
  position: relative;
  min-width: 100%;
  min-height: 100%;
  transform-origin: 0 0;
}
.tile {
  position: absolute;
  width: 48px; height: 48px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
  background: var(--tile-bg);
  border: 2px solid var(--border);
  box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  transition: box-shadow 0.2s, transform 0.15s;
  z-index: 1;
}
.tile.last-move {
  border: 2px dashed var(--success);
  box-shadow: none;
  z-index: 2;
}
.tile.ghost {
  opacity: 0.55;
  border-style: dashed;
  border-color: var(--highlight);
  pointer-events: none;
  z-index: 3;
}
.tile.board-hit {
  background: transparent;
  border: none;
  box-shadow: none;
  cursor: pointer;
  z-index: 4;
}
.tile.hint-spot {
  background: transparent;
  border: 2px dashed rgba(255,255,255,0.85);
  box-shadow: none;
  cursor: pointer;
  z-index: 4;
}
.tile.hint-spot:hover {
  background: rgba(255,255,255,0.08);
  border-color: #fff;
}
.hint-score {
  font-size: 15px;
  font-weight: 900;
  color: var(--success);
  text-shadow: 0 1px 4px rgba(0,0,0,0.95), 0 0 2px rgba(0,0,0,0.95);
  pointer-events: none;
}
onst moves = generateMoves(state.hand, true);
      if(moves.some(m=>m.placements.length>=2)) break;
      state.bag.push(...state.hand); shuffle(state.bag); state.hand = drawTiles(6); attempts++;
    }
    state.turn = 'player'; log(`=== Nová hra (SOLO) ===`);
    setStatus('Váš tah (SOLO) – vytvořte nejdelší řadu', 'turn-solo');
  } else {
    const pLen = longestSequence(state.hand); const aLen = longestSequence(state.aiHand);
    let starter = state.nextStarter;
    if(pLen > aLen) starter = 'player'; else if(aLen > pLen) starter = 'ai';
    state.turn = starter; state.nextStarter = starter === 'player' ? 'ai' : 'player';
    log(`=== Nová hra (AI) === Začíná: ${starter==='player'?'Hráč':'AI'} (sekvence Hráč ${pLen}, AI ${aLen})`);
    if(starter === 'player'){ setStatus('Váš tah – vytvořte první řadu', 'turn-player'); toast(`Začínáte vy (nejdelší řada v ruce: ${pLen})`); } else { setStatus('AI začíná – přemýšlí…', 'turn-ai'); toast(`Začíná AI (nejdelší řada v ruce: ${aLen})`); }
  }

  refreshLogView(); updateModeButton(); renderBoard(); renderHand(); updateScores(); centerOnLastMove();
  if(state.mode==='ai' && state.turn==='ai') setTimeout(aiTurn, 600);
}

// ---------- Drag scroll ----------
(function(){
  const wrap = document.getElementById('board-wrapper');
  let isDown=false, startX, startY, scrollL, scrollT;
  wrap.addEventListener('mousedown', e=>{
    if(e.target.classList.contains('board-hit') || e.target.classList.contains('hint-spot')) return;
    isDown=true; wrap.classList.add('dragging'); startX=e.pageX; startY=e.pageY; scrollL=wrap.scrollLeft; scrollT=wrap.scrollTop;
  });
  window.addEventListener('mouseup', ()=>{ isDown=false; wrap.classList.remove('dragging'); });
  window.addEventListener('mousemove', e=>{ if(!isDown) return; wrap.scrollLeft = scrollL - (e.pageX-startX); wrap.scrollTop = scrollT - (e.pageY-startY); });
  wrap.addEventListener('touchstart', e=>{
    if(e.target.classList.contains('board-hit') || e.target.classList.contains('hint-spot')) return;
    isDown=true; startX=e.touches[0].pageX; startY=e.touches[0].pageY; scrollL=wrap.scrollLeft; scrollT=wrap.scrollTop;
  }, {passive:true});
  wrap.addEventListener('touchend', ()=>isDown=false);
  wrap.addEventListener('touchmove', e=>{ if(!isDown) return; wrap.scrollLeft = scrollL - (e.touches[0].pageX-startX); wrap.scrollTop = scrollT - (e.touches[0].pageY-startY); }, {passive:true});
})();

// ---------- Event listeners ----------
document.getElementById('btn-save').onclick = saveGame;
document.getElementById('btn-load').onclick = loadGame;
document.getElementById('btn-restart').onclick = async ()=>{ if(await askConfirm('Restart', 'Opravdu restartovat hru?')) newGame(state.mode); };
document.getElementById('btn-log').onclick = ()=>{ refreshLogView(); document.getElementById('modal-log').classList.add('open'); };
document.getElementById('btn-close-log').onclick = ()=>document.getElementById('modal-log').classList.remove('open');
document.getElementById('modal-log').onclick = e=>{ if(e.target.id==='modal-log') e.target.classList.remove('open'); };
document.getElementById('btn-copy-log').onclick = ()=>{ navigator.clipboard.writeText(state.log.join('\n')).then(()=>toast('Log zkopírován')).catch(()=>toast('Nepodařilo se zkopírovat')); };
document.getElementById('btn-log-font-plus').onclick = (e)=>{
  e.stopPropagation();
  logFontSize = Math.min(22, logFontSize + 1);
  applyLogFontSize();
};
document.getElementById('btn-log-font-minus').onclick = (e)=>{
  e.stopPropagation();
  logFontSize = Math.max(10, logFontSize - 1);
  applyLogFontSize();
};
document.getElementById('btn-help').onclick = ()=>document.getElementById('modal-help').classList.add('open');
document.getElementById('btn-close-help').onclick = ()=>document.getElementById('modal-help').classList.remove('open');
document.getElementById('modal-help').onclick = e=>{ if(e.target.id==='modal-help') e.target.classList.remove('open'); };

document.getElementById('btn-replay').onclick = toggleReplay;
document.getElementById('replay-first').onclick = ()=>showSnapshot(0);
document.getElementById('replay-prev').onclick = ()=>showSnapshot(Math.max(0,replay.index-1));
document.getElementById('replay-next').onclick = ()=>showSnapshot(Math.min(replay.snapshots.length-1,replay.index+1));
document.getElementById('replay-last').onclick = ()=>showSnapshot(replay.snapshots.length-1);
document.getElementById('replay-play').onclick = ()=>{
  if(replay.playing){
    replay.playing=false; clearInterval(replay.timer); document.getElementById('replay-play').textContent='▶';
  } else {
    replay.playing=true; document.getElementById('replay-play').textContent='⏸';
    replay.timer = setInterval(()=>{
      if(replay.index >= replay.snapshots.length-1){
        replay.playing=false; clearInterval(replay.timer); document.getElementById('replay-play').textContent='▶'; return;
      }
      showSnapshot(replay.index+1);
    }, 900);
  }
};

function updateModeButton(){
  const btn = document.getElementById('btn-mode'); const icon = document.getElementById('icon-mode');
  if(!btn || !icon) return;
  btn.classList.toggle('mode-ai', state.mode==='ai'); btn.classList.toggle('mode-solo', state.mode==='solo');
  btn.title = state.mode==='ai' ? 'Režim AI – klik pro SOLO' : 'Režim SOLO – klik pro AI';
  if(state.mode === 'ai'){ icon.innerHTML = '<path d="M20 3H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h6l-2 2v1h8v-1l-2-2h6c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 13H4V5h16v11z"/>'; } else { icon.innerHTML = '<path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>'; }
}
document.getElementById('btn-mode').onclick = async ()=>{
  const next = state.mode==='ai' ? 'solo' : 'ai';
  if(await askConfirm('Režim ' + next.toUpperCase(), `Přepnout na ${next.toUpperCase()}? (nová hra)`)){ newGame(next); updateModeButton(); }
};
document.getElementById('btn-title').onclick = ()=>{ state.showCoords = !state.showCoords; toast(state.showCoords ? 'Souřadnice zapnuty' : 'Souřadnice vypnuty'); renderBoard(); };
document.getElementById('btn-confirm').onclick = ()=>{ confirmMove(); };
document.getElementById('btn-cancel').onclick = cancelSelection;
document.getElementById('btn-exchange').onclick = startExchange;

// ---------- Start ----------
newGame('ai');
</script>
</body>
</html>
