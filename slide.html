<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ŠOUPEJ / SLIDE</title>
<style>
:root {
  --bg: #14080c;
  --panel: #2a1018;
  --accent: #9b1e42;
  --accent2: #d44568;
  --text: #f8ecef;
  --muted: #a88a92;
  --card: min(15vw, 64px);
  --edge: 20px;
  --gap: 3px;
  --revealed-h: calc(var(--card) * 0.7 + 4px);
  --btn: 32px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  overflow-x: hidden; touch-action: manipulation;
}
body { display: flex; flex-direction: column; min-height: 100dvh; align-items: center; }

.title-bar {
  width: 100%; text-align: center; padding: 8px 6px 2px;
  background: linear-gradient(180deg, #3d1525, #220e16);
}
.logo {
  font-weight: 800; font-size: 1.4rem; letter-spacing: 1px;
  background: linear-gradient(90deg,#fff,#f8b4c4);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}

.topbar {
  width: 100%; max-width: 640px;
  background: linear-gradient(180deg, #220e16, #1a0a10);
  padding: 5px 4px 7px;
  display: flex; align-items: center; justify-content: center;
  gap: 3px; flex-wrap: nowrap;
  border-bottom: 2px solid var(--accent);
  position: sticky; top: 0; z-index: 50;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.icon-btn {
  width: var(--btn); height: var(--btn); min-width: var(--btn);
  border: 1.5px solid #6b3045; border-radius: 8px;
  background: linear-gradient(180deg, #4a2030, #2d1520);
  color: #f8b4c4; font-size: 0.9rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, border-color .15s, transform .1s;
  font-weight: 700; flex-shrink: 0; padding: 0;
}
.icon-btn:hover { background: var(--accent); border-color: #f8b4c4; color: #fff; }
.icon-btn:active { transform: scale(0.93); }
.icon-btn.lang {
  width: auto; min-width: var(--btn); padding: 0 6px;
  font-size: 0.72rem; letter-spacing: 0.5px;
}
.icon-btn.mode-btn {
  width: auto; min-width: var(--btn); padding: 0 7px;
  font-size: 0.8rem;
}

.main {
  flex: 1; display: flex; flex-direction: column; gap: 6px;
  padding: 6px; max-width: 640px; width: 100%; margin: 0 auto;
}

.tabs { display: flex; gap: 2px; overflow-x: auto; }
.tab {
  flex: 1; min-width: 0; padding: 7px 4px; border: none; border-radius: 9px 9px 0 0;
  background: #2a1520; color: var(--muted); font-weight: 600; font-size: 0.75rem;
  cursor: pointer; white-space: nowrap; text-overflow: ellipsis; overflow: hidden;
}
.tab.active { background: var(--panel); color: #fff; box-shadow: 0 -2px 0 var(--accent) inset; }
.tab.you { color: #f8b4c4; }
.tab.winner-tab { color: #4ade80; }
.tab.current-pick { outline: 2px solid #4ade80; outline-offset: -2px; }
.tab.disabled-tab {
  opacity: 0.55;
}

.board-panel {
  background: var(--panel); border-radius: 0 0 12px 12px; padding: 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.35);
}
.revealed-row {
  display: flex; gap: 5px; justify-content: center; align-items: center; flex-wrap: nowrap;
  height: var(--revealed-h); min-height: var(--revealed-h); max-height: var(--revealed-h);
  margin-bottom: 6px; overflow: hidden;
}
.revealed-row .card {
  width: calc(var(--card) * 0.7); height: calc(var(--card) * 0.7);
  border-radius: 6px; flex-shrink: 0;
}

.grid-wrap {
  display: grid;
  grid-template-columns: var(--edge) repeat(4, var(--card)) var(--edge);
  grid-template-rows: var(--edge) repeat(4, var(--card)) var(--edge);
  gap: var(--gap); justify-content: center; margin: 0 auto; max-width: 100%;
}
.edge {
  background: #3d2030; border-radius: 6px; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: #f8b4c4; font-size: 0.85rem; font-weight: 700;
  transition: background .15s, transform .1s; opacity: 0.3; pointer-events: none;
  line-height: 1;
}
.edge.active {
  opacity: 1; pointer-events: auto; background: var(--accent);
  box-shadow: 0 0 0 2px #fbbf24;
  font-size: 1rem; color: #fff;
}
.edge.active:hover { background: var(--accent2); transform: scale(1.05); }
.corner { background: transparent; pointer-events: none; }

.card {
  width: var(--card); height: var(--card);
  border-radius: 7px; background-size: cover; background-position: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.4); position: relative;
  transition: transform .12s, outline .1s, opacity .2s, filter .2s; user-select: none;
}
.card.face-down { cursor: pointer; }
.card.face-down:hover { transform: scale(1.05); }
.card.selected { outline: 3px solid #4ade80; outline-offset: 2px; z-index: 3; }
.card.empty { background: #1a0a0f; border: 2px dashed #5a3045; box-shadow: none; }
.card.selectable { cursor: pointer; outline: 2px solid #fbbf24; outline-offset: 1px; }
.card.selectable:hover { transform: scale(1.08); }
.card.cancelled {
  opacity: 0.28; filter: grayscale(0.85) brightness(0.6);
  box-shadow: none; outline: 1px solid #5a3045;
}

.board-status {
  display: flex; justify-content: center; align-items: center; gap: 8px;
  margin-top: 6px; flex-wrap: wrap; font-size: 0.78rem;
}
.board-status .badge {
  background: #3d2030; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem;
}
.board-status .badge.hl { background: var(--accent); }
#msgBar {
  text-align: center; font-size: 0.78rem; color: var(--muted);
  min-height: 1.15em; padding: 2px 4px;
}

.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.78);
  display: none; align-items: center; justify-content: center;
  z-index: 200; padding: 12px;
}
.overlay.show { display: flex; }
.modal {
  background: var(--panel); border-radius: 14px; padding: 0;
  max-width: 520px; width: 100%; max-height: 85vh;
  border: 1px solid #5a3045; box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  display: flex; flex-direction: column; overflow: hidden;
}
.modal-header {
  display: flex; align-items: center; gap: 6px;
  padding: 10px 12px; border-bottom: 1px solid #4a2030; flex-shrink: 0;
}
.modal-header h2 { flex: 1; margin: 0; color: #f8b4c4; font-size: 1rem; }
.modal-header .icon-btn { width: 30px; height: 30px; min-width: 30px; font-size: 0.9rem; }
.modal-body { padding: 12px 14px; overflow-y: auto; flex: 1; }
.modal-body p, .modal-body li { margin-bottom: 6px; line-height: 1.4; font-size: 0.85rem; }
.modal-body ul { padding-left: 16px; }
.modal-actions {
  display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 14px;
  border-top: 1px solid #4a2030; justify-content: flex-end; flex-shrink: 0;
}
.btn {
  background: var(--accent); color: #fff; border: none; border-radius: 8px;
  padding: 7px 12px; font-size: 0.82rem; font-weight: 600; cursor: pointer;
}
.btn:hover { background: var(--accent2); }
.btn.secondary { background: #3d2030; }

.log-content {
  font-size: 0.8rem; color: var(--muted); line-height: 1.4;
  max-height: 50vh; overflow-y: auto;
}
.log-content div {
  margin-bottom: 3px; border-bottom: 1px solid #2a1520; padding-bottom: 3px;
}

.stats-table {
  width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-bottom: 12px;
}
.stats-table th, .stats-table td {
  padding: 6px 4px; text-align: left; border-bottom: 1px solid #4a2030;
}
.stats-table th { color: #f8b4c4; font-weight: 600; }
.stats-table tr.clickable { cursor: pointer; }
.stats-table tr.clickable:hover { background: #3d2030; }
.stats-section { margin-bottom: 14px; }
.stats-section h3 {
  font-size: 0.85rem; color: #f8b4c4; margin-bottom: 6px;
}

@media (min-width: 400px) {
  :root { --btn: 34px; --card: min(14vw, 70px); --edge: 22px; }
  .topbar { gap: 4px; padding: 5px 6px 7px; }
}
@media (min-width: 480px) {
  :root { --card: min(13vw, 76px); --edge: 24px; --btn: 36px; }
}
@media (min-width: 700px) {
  :root { --card: 80px; --edge: 28px; }
  .main { max-width: 720px; }
  .topbar { max-width: 720px; }
}
</style>
</head>
<body>
<div class="title-bar">
  <div class="logo" id="gameTitle">ŠOUPEJ</div>
</div>

<div class="topbar">
  <button class="icon-btn" id="btnNew" title="Restart">⟳</button>
  <button class="icon-btn mode-btn" id="btnMode" title="Mode">4</button>
  <button class="icon-btn" id="btnSave" title="Save">⬇</button>
  <button class="icon-btn" id="btnLoad" title="Load">⬆</button>
  <button class="icon-btn" id="btnLog" title="Log">☰</button>
  <button class="icon-btn" id="btnStats" title="Stats">▦</button>
  <button class="icon-btn" id="btnHelp" title="Help">?</button>
  <button class="icon-btn lang" id="btnLang" title="Language">EN</button>
</div>

<div class="main">
  <div class="tabs" id="tabs"></div>
  <div class="board-panel">
    <div class="revealed-row" id="revealedRow"></div>
    <div class="grid-wrap" id="gridWrap"></div>
    <div class="board-status">
      <span class="badge" id="roundBadge">1/16</span>
      <span class="badge hl" id="phaseBadge">—</span>
      <span class="badge" id="tourBadge" style="display:none"></span>
    </div>
    <div id="viewGameSwitcher" style="display:none;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px;"></div>
    <div id="msgBar"></div>
  </div>
</div>

<div class="overlay" id="logOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="logTitleLabel">Záznam</h2>
      <button class="icon-btn" id="btnCopyLog" title="Copy">⧉</button>
      <button class="icon-btn" id="closeLog" title="Close">✕</button>
    </div>
    <div class="modal-body"><div class="log-content" id="log"></div></div>
  </div>
</div>

<div class="overlay" id="statsOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="statsTitleLabel">Statistiky</h2>
      <button class="icon-btn" id="btnClearStats" title="Clear">🗑</button>
      <button class="icon-btn" id="closeStats" title="Close">✕</button>
    </div>
    <div class="modal-body" id="statsContent"></div>
  </div>
</div>

<div class="overlay" id="helpOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="helpTitleLabel">Pravidla</h2>
      <button class="icon-btn" id="closeHelp" title="Close">✕</button>
    </div>
    <div class="modal-body" id="helpContent"></div>
  </div>
</div>

<div class="overlay" id="confirmOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="confirmTitle">⟳</h2>
      <button class="icon-btn" id="confirmCloseX" title="Close">✕</button>
    </div>
    <div class="modal-body"><p id="confirmMsg"></p></div>
    <div class="modal-actions">
      <button class="btn secondary" id="confirmNo">Zrušit</button>
      <button class="btn" id="confirmYes">Ano</button>
    </div>
  </div>
</div>

const SAVE_KEY = 'soupej_save_v7';
const STATS_KEY = 'soupej_stats_v1';
let state = null;
let activeTab = 0;

function loadStats() {
  try {
    const raw = localStorage.getItem(STATS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { best: {}, lastGames: [] };
}
function saveStats(stats) {
  try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); } catch (e) {}
}

function createDeck() {
  const d = [];
  for (let v = 1; v <= 10; v++) for (let i = 0; i < 10; i++) d.push(v);
  for (let i = d.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [d[i], d[j]] = [d[j], d[i]];
  }
  return d;
}
function dealGrid(deck) {
  const cells = [];
  for (let i = 0; i < 16; i++) cells.push({ value: deck.pop(), faceUp: false });
  return cells;
}

function cycleMode() {
  const idx = MODES.indexOf(selectedMode);
  selectedMode = MODES[(idx + 1) % MODES.length];
  document.getElementById('btnMode').textContent = MODE_LABEL[selectedMode];
}

function playerName(i) {
  if (!state) return '';
  // Unified labels everywhere: tabs, log, messages, stats
  if (state.mode === 'solo' || i === state.humanIndex) return '👤';
  // AI indices: display number = seat index (1..n-1) matching 🖥️1, 🖥️2, ...
  // For human at 0: AI1 is index 1 → 🖥️1
  return '🖥️' + i;
}

function newGame(mode) {
  mode = mode || selectedMode;
  selectedMode = mode;
  document.getElementById('btnMode').textContent = MODE_LABEL[mode];
  viewOnly = false;
  viewSession = null;
  const isT = mode === 'tournament';
  const numPlayers = mode === 'solo' ? 1 : (mode === 'ai2' ? 2 : mode === 'ai3' ? 3 : 4);
  const deck = createDeck();
  const grids = [];
  for (let p = 0; p < numPlayers; p++) grids.push(dealGrid(deck));
  state = {
    mode, numPlayers, humanIndex: 0,
    round: 1, firstPlayer: 0,
    phase: 'select', currentPicker: 0,
    grids, market: [], deck,
    selectedPos: null, pendingCard: null, emptyPos: null,
    slideFromSide: null,
    revealedThisRound: [], scores: null, cancelled: null,
    log: [],
    tournament: isT ? {
      id: Date.now(),
      cumulative: Array(numPlayers).fill(0),
      eliminated: Array(numPlayers).fill(false),
      eliminationGame: Array(numPlayers).fill(null),
      gameNumber: 1
    } : null
  };
  activeTab = 0;
  logMsg('newGameLog', [MODE_LABEL[mode]]);
  startSelectPhase();
}

function startNextTournamentGame() {
  const deck = createDeck();
  const grids = [];
  for (let p = 0; p < state.numPlayers; p++) grids.push(dealGrid(deck));
  state.grids = grids;
  state.deck = deck;
  state.round = 1;
  // first non-eliminated player starts
  state.firstPlayer = 0;
  for (let k = 0; k < state.numPlayers; k++) {
    if (!isEliminated(k)) { state.firstPlayer = k; break; }
  }
  state.phase = 'select';
  state.currentPicker = state.firstPlayer;
  state.market = [];
  state.marketMeta = null;
  state.selectedPos = null;
  state.pendingCard = null;
  state.emptyPos = null;
  state.scores = null;
  state.cancelled = null;
  state.tournament.gameNumber++;
  // Note: tournamentNext is logged once in finishGame before calling this
  if (isEliminated(state.humanIndex)) {
    setMsg('tournamentAutoPlay');
    autoPlayTournamentGame();
  } else {
    startSelectPhase();
  }
}

/** Remaining card values that count toward score (non-cancelled singles) */
function remainingCardValues(cells, cancelledArr) {
  const vals = [];
  for (let i = 0; i < 16; i++) {
    const cell = cells[i];
    if (!cell || cell.value == null) continue;
    if (cancelledArr && cancelledArr[i]) continue;
    vals.push(cell.value);
  }
  vals.sort((a, b) => a - b);
  return vals;
}

function logTournamentSubtotal(gameNum, playedMask) {
  logMsg('tournamentSubtotal', [gameNum]);
  for (let p = 0; p < state.numPlayers; p++) {
    if (playedMask && !playedMask[p]) continue;
    const gameScore = state.scores[p].score;
    const rem = remainingCardValues(state.grids[p], state.cancelled[p]);
    const remStr = rem.length ? rem.join(', ') : '—';
    logMsg('tournamentPlayerResult', [playerName(p), gameScore, remStr]);
  }
}

/** Simulate one full 16-round game for all non-eliminated players (no human input) */
function autoPlayTournamentGame() {
  if (!state || state.mode !== 'tournament') return;
  // Play all 16 rounds synchronously (fast)
  for (let round = 1; round <= 16; round++) {
    state.round = round;
    // Each active player "flips" a card
    const market = [];
    const empties = [];
    for (let p = 0; p < state.numPlayers; p++) {
      if (isEliminated(p)) { empties[p] = null; continue; }
      const pos = aiChooseCardToFlip(p);
      if (pos == null) continue;
      const val = state.grids[p][pos].value;
      const r = Math.floor(pos / 4), c = pos % 4;
      state.grids[p][pos] = { value: null, faceUp: true };
      market.push(val);
      empties[p] = { r, c };
    }
    // Pick order from firstPlayer
    const order = [];
    for (let k = 0; k < state.numPlayers; k++) {
      const p = (state.firstPlayer + k) % state.numPlayers;
      if (!isEliminated(p)) order.push(p);
    }
    for (const p of order) {
      if (!market.length) break;
      const mi = aiChooseFromMarket(p, market);
      const card = market.splice(mi, 1)[0];
      const empty = empties[p] || getEmptyPos(state.grids[p]);
      if (!empty) continue;
      const edge = aiChooseSlide(p, card);
      state.grids[p] = applySlide(state.grids[p], empty.r, empty.c, edge.side, card);
      empties[p] = null;
    }
    // advance first player
    let fp = (state.firstPlayer + 1) % state.numPlayers;
    for (let k = 0; k < state.numPlayers; k++) {
      const p = (fp + k) % state.numPlayers;
      if (!isEliminated(p)) { state.firstPlayer = p; break; }
    }
  }
  finishGame();
}

function logMsg(key, args) {
  if (!state) return;
  state.log.unshift({ key: key, args: args || [] });
  // Keep full tournament history (many games × 16 rounds)
  if (state.log.length > 5000) state.log.length = 5000;
  refreshLogView();
}

function refreshLogView() {
  const el = document.getElementById('log');
  if (!el) return;
  if (!state || !state.log) { el.innerHTML = ''; return; }
  el.innerHTML = state.log.map(entry => {
    if (typeof entry === 'string') return '<div>' + entry + '</div>';
    let text;
    if (entry.key === 'newGameLog' && entry.args && entry.args[0]) {
      text = formatMsg('newGameLog') + ' (' + entry.args[0] + ')';
    } else {
      text = formatMsg(entry.key, entry.args);
    }
    return '<div>' + text + '</div>';
  }).join('');
}

function analyzeGrid(cells) {
  const grid = [];
  for (let r = 0; r < 4; r++) {
    grid[r] = [];
    for (let c = 0; c < 4; c++) {
      const cell = cells[r * 4 + c];
      grid[r][c] = (cell && cell.value != null) ? cell.value : null;
    }
  }
  const visited = Array.from({ length: 4 }, () => Array(4).fill(false));
  const cancelled = Array(16).fill(false);
  let total = 0, remainingCount = 0;
  const dirs = [[0,1],[1,0],[0,-1],[-1,0]];
  for (let r = 0; r < 4; r++) {
    for (let c = 0; c < 4; c++) {
      if (visited[r][c] || grid[r][c] == null) continue;
      const val = grid[r][c];
      const q = [[r,c]]; visited[r][c] = true;
      const group = [[r,c]];
      while (q.length) {
        const [cr,cc] = q.shift();
        for (const [dr,dc] of dirs) {
          const nr = cr+dr, nc = cc+dc;
          if (nr>=0&&nr<4&&nc>=0&&nc<4&&!visited[nr][nc]&&grid[nr][nc]===val) {
            visited[nr][nc] = true; q.push([nr,nc]); group.push([nr,nc]);
          }
        }
      }
      if (group.length >= 2) group.forEach(([gr,gc]) => { cancelled[gr*4+gc] = true; });
      else { total += val; remainingCount++; }
    }
  }
  return { score: total, cards: remainingCount, cancelled };
}

function scoreGrid(cells) {
  const a = analyzeGrid(cells);
  return { score: a.score, cards: a.cards };
}

function getEmptyPos(cells) {
  for (let i = 0; i < 16; i++) {
    if (cells[i].value == null) return { r: Math.floor(i/4), c: i%4 };
  }
  return null;
}

function possibleEdges(emptyR, emptyC) {
  const edges = [];
  if (emptyR > 0) edges.push({ side: 'T' });
  if (emptyR < 3) edges.push({ side: 'B' });
  if (emptyC > 0) edges.push({ side: 'L' });
  if (emptyC < 3) edges.push({ side: 'R' });
  return edges;
}

function applySlide(cells, emptyR, emptyC, side, newValue) {
  const g = cells.map(c => ({ ...c }));
  const idx = (r,c) => r*4 + c;
  if (side === 'T') {
    for (let r = emptyR; r > 0; r--) g[idx(r, emptyC)] = g[idx(r-1, emptyC)];
    g[idx(0, emptyC)] = { value: newValue, faceUp: true };
  } else if (side === 'B') {
    for (let r = emptyR; r < 3; r++) g[idx(r, emptyC)] = g[idx(r+1, emptyC)];
    g[idx(3, emptyC)] = { value: newValue, faceUp: true };
  } else if (side === 'L') {
    for (let c = emptyC; c > 0; c--) g[idx(emptyR, c)] = g[idx(emptyR, c-1)];
    g[idx(emptyR, 0)] = { value: newValue, faceUp: true };
  } else if (side === 'R') {
    for (let c = emptyC; c < 3; c++) g[idx(emptyR, c)] = g[idx(emptyR, c+1)];
    g[idx(emptyR, 3)] = { value: newValue, faceUp: true };
  }
  return g;
}

function entryPosAfterSlide(emptyR, emptyC, side) {
  if (side === 'T') return { r: 0, c: emptyC };
  if (side === 'B') return { r: 3, c: emptyC };
  if (side === 'L') return { r: emptyR, c: 0 };
  return { r: emptyR, c: 3 };
}

function evaluateGridForAI(cells) {
  const a = analyzeGrid(cells);
  let potential = 0;
  let highSingles = 0;
  const g = cells.map(c => c.value);
  for (let r = 0; r < 4; r++) {
    for (let c = 0; c < 4; c++) {
      const v = g[r * 4 + c];
      if (v == null) continue;
      let matched = false;
      if (c < 3 && g[r * 4 + c + 1] === v) { potential += 3 + v; matched = true; }
      if (r < 3 && g[(r + 1) * 4 + c] === v) { potential += 3 + v; matched = true; }
      // near-match: same value one gap away on line (future pairing hint)
      if (c < 2 && g[r * 4 + c + 2] === v && g[r * 4 + c + 1] == null) potential += 1;
      if (r < 2 && g[(r + 2) * 4 + c] === v && g[(r + 1) * 4 + c] == null) potential += 1;
    }
  }
  // Penalize high values that remain as singles in final score
  for (let i = 0; i < 16; i++) {
    if (g[i] != null && a.cancelled && !a.cancelled[i]) highSingles += g[i] * g[i];
  }
  // Lower score is better → higher evaluation
  return -(a.score * 12 + a.cards * 2 + highSingles * 0.15) + potential;
}

function aiChooseCardToFlip(playerIdx) {
  const cells = state.grids[playerIdx];
  const faceDown = [];
  for (let i = 0; i < 16; i++) {
    if (!cells[i].faceUp && cells[i].value != null) faceDown.push(i);
  }
  if (!faceDown.length) return null;
  // Prefer dumping highest cards; slight randomness among top candidates
  faceDown.sort(function (a, b) { return cells[b].value - cells[a].value; });
  const topN = Math.min(3, faceDown.length);
  // Weight toward the highest
  const weights = [];
  let sum = 0;
  for (let i = 0; i < topN; i++) {
    const w = topN - i;
    weights.push(w);
    sum += w;
  }
  let r = Math.random() * sum;
  for (let i = 0; i < topN; i++) {
    r -= weights[i];
    if (r <= 0) return faceDown[i];
  }
  return faceDown[0];
}

function aiBestSlideScore(cells, empty, val) {
  let best = -Infinity;
  const edges = possibleEdges(empty.r, empty.c);
  for (let i = 0; i < edges.length; i++) {
    const sc = evaluateGridForAI(applySlide(cells, empty.r, empty.c, edges[i].side, val));
    if (sc > best) best = sc;
  }
  return best;
}

function aiChooseFromMarket(playerIdx, market) {
  if (market.length === 1) return 0;
  const cells = state.grids[playerIdx];
  const empty = getEmptyPos(cells);
  if (!empty) return 0;
  let bestIdx = 0, bestScore = -Infinity;
  for (let mi = 0; mi < market.length; mi++) {
    const val = market[mi];
    // Prefer lower values when slide quality is similar
    let sc = aiBestSlideScore(cells, empty, val) - val * 0.35;
    if (sc > bestScore) { bestScore = sc; bestIdx = mi; }
  }
  return bestIdx;
}

function aiChooseSlide(playerIdx, cardValue) {
  const cells = state.grids[playerIdx];
  const empty = getEmptyPos(cells);
  const edges = possibleEdges(empty.r, empty.c);
  let best = edges[0], bestScore = -Infinity;
  for (let i = 0; i < edges.length; i++) {
    const e = edges[i];
    const sc = evaluateGridForAI(applySlide(cells, empty.r, empty.c, e.side, cardValue));
    if (sc > bestScore) { bestScore = sc; best = e; }
  }
  return best;
}

function isEliminated(p) {
  return state.tournament && state.tournament.eliminated[p];
}

function startSelectPhase() {
  state.phase = 'select';
  state.selectedPos = null;
  state.market = [];
  state.revealedThisRound = Array(state.numPlayers).fill(null);
  state.pendingCard = null;
  state.emptyPos = null;
  state.slideFromSide = null;
  if (state.mode !== 'solo') {
    for (let p = 0; p < state.numPlayers; p++) {
      if (p === state.humanIndex || isEliminated(p)) continue;
      state.revealedThisRound[p] = aiChooseCardToFlip(p);
    }
  }
  setMsg('selectCard');
  activeTab = state.humanIndex;
  renderAll();
}

function humanSelectCard(r, c) {
  if (viewOnly || state.phase !== 'select') return;
  if (isEliminated(state.humanIndex)) return;
  const cells = state.grids[state.humanIndex];
  const idx = r * 4 + c;
  if (cells[idx].faceUp || cells[idx].value == null) return;
  state.selectedPos = { r, c };
  state.revealedThisRound[state.humanIndex] = idx;

  if (state.mode === 'solo') {
    const val = cells[idx].value;
    cells[idx] = { value: null, faceUp: true };
    state.emptyPos = { r, c };
    const size = ((state.round - 1) % 4) + 1;
    state.market = [val];
    for (let i = 1; i < size; i++) {
      if (state.deck.length) state.market.push(state.deck.pop());
    }
    for (let i = state.market.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [state.market[i], state.market[j]] = [state.market[j], state.market[i]];
    }
    logMsg('youRevealed', [val, posLabel(r, c)]);
    state.phase = 'market';
    state.currentPicker = 0;
    // Use beginMarketPick so last-card auto-select works in SOLO too
    beginMarketPick();
    renderAll();
    return;
  } else {
    state.market = [];
    for (let p = 0; p < state.numPlayers; p++) {
      if (isEliminated(p)) continue;
      const pos = state.revealedThisRound[p];
      if (pos == null) continue;
      const val = state.grids[p][pos].value;
      state.grids[p][pos] = { value: null, faceUp: true };
      state.market.push({ val, fromPlayer: p, fromPos: pos });
    }
    // market as values for UI, keep meta
    state.marketMeta = state.market.slice();
    state.market = state.market.map(m => m.val);
    for (let i = state.market.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [state.market[i], state.market[j]] = [state.market[j], state.market[i]];
      [state.marketMeta[i], state.marketMeta[j]] = [state.marketMeta[j], state.marketMeta[i]];
    }
    const hr = Math.floor(state.revealedThisRound[state.humanIndex] / 4);
    const hc = state.revealedThisRound[state.humanIndex] % 4;
    const hval = state.marketMeta.find(m => m.fromPlayer === state.humanIndex);
    if (hval) logMsg('youRevealed', [hval.val, posLabel(hr, hc)]);
    logMsg('cardsInMarket');
    state.phase = 'market';
    // first non-eliminated from firstPlayer
    state.currentPicker = state.firstPlayer;
    for (let k = 0; k < state.numPlayers; k++) {
      const p = (state.firstPlayer + k) % state.numPlayers;
      if (!isEliminated(p)) { state.currentPicker = p; break; }
    }
    beginMarketPick();
  }
  renderAll();
}

function nextPicker(from) {
  for (let k = 1; k <= state.numPlayers; k++) {
    const p = (from + k) % state.numPlayers;
    if (!isEliminated(p)) return p;
  }
  return from;
}

function beginMarketPick() {
  if (state.phase !== 'market') return;
  if (state.market.length === 0) { endRound(); return; }
  if (state.mode === 'solo') {
    if (state.market.length === 1) {
      setTimeout(function () { humanTakeFromMarket(0); }, 280);
      return;
    }
    setMsg('chooseMarket');
    renderAll();
    return;
  }
  const p = state.currentPicker;
  if (isEliminated(p)) {
    state.currentPicker = nextPicker(p);
    beginMarketPick();
    return;
  }
  activeTab = p;
  if (p === state.humanIndex) {
    if (state.market.length === 1) {
      // Only one card left — auto-select and go to slide
      setTimeout(function () { humanTakeFromMarket(0); }, 280);
      return;
    }
    setMsg('chooseMarket');
    renderAll();
  } else {
    setMsg('aiTurnMsg', [p]);
    renderAll();
    setTimeout(() => {
      const mi = aiChooseFromMarket(p, state.market);
      const card = state.market.splice(mi, 1)[0];
      if (state.marketMeta) state.marketMeta.splice(mi, 1);
      state.emptyPos = getEmptyPos(state.grids[p]);
      const edge = aiChooseSlide(p, card);
      const dest = entryPosAfterSlide(state.emptyPos.r, state.emptyPos.c, edge.side);
      state.grids[p] = applySlide(state.grids[p], state.emptyPos.r, state.emptyPos.c, edge.side, card);
      logMsg('aiPlayed', [p, card, sideLabel(edge.side), posLabel(dest.r, dest.c)]);
      state.currentPicker = nextPicker(p);
      if (state.market.length === 0) endRound();
      else beginMarketPick();
    }, 450);
  }
}

function humanTakeFromMarket(mi) {
  if (viewOnly || state.phase !== 'market') return;
  if (state.mode !== 'solo' && state.currentPicker !== state.humanIndex) return;
  if (mi < 0 || mi >= state.market.length) return;
  const card = state.market.splice(mi, 1)[0];
  if (state.marketMeta) state.marketMeta.splice(mi, 1);
  state.pendingCard = card;
  state.emptyPos = getEmptyPos(state.grids[state.humanIndex]);
  state.phase = 'slide';
  activeTab = state.humanIndex;
  setMsg('chooseSlide');
  renderAll();
}

function humanDoSlide(side) {
  if (viewOnly || state.phase !== 'slide' || state.pendingCard == null) return;
  const p = state.humanIndex;
  const dest = entryPosAfterSlide(state.emptyPos.r, state.emptyPos.c, side);
  state.grids[p] = applySlide(state.grids[p], state.emptyPos.r, state.emptyPos.c, side, state.pendingCard);
  logMsg('youSlid', [state.pendingCard, sideLabel(side), posLabel(dest.r, dest.c)]);
  state.pendingCard = null;
  if (state.mode === 'solo') {
    endRound();
  } else {
    state.currentPicker = nextPicker(p);
    if (state.market.length === 0) endRound();
    else { state.phase = 'market'; beginMarketPick(); }
  }
  renderAll();
}

function endRound() {
  if (state.round >= 16) { finishGame(); return; }
  state.round++;
  // First player token passes to the next non-eliminated player
  let fp = (state.firstPlayer + 1) % state.numPlayers;
  for (let k = 0; k < state.numPlayers; k++) {
    const p = (fp + k) % state.numPlayers;
    if (!isEliminated(p)) { state.firstPlayer = p; break; }
  }
  logMsg('roundLog', [state.round]);
  startSelectPhase();
}

function recordStats() {
  const stats = loadStats();
  const mode = state.mode;
  const date = new Date().toISOString();
  const snapshot = {
    mode,
    date,
    scores: state.scores ? state.scores.map(s => ({ ...s })) : null,
    cumulative: state.tournament ? state.tournament.cumulative.slice() : null,
    eliminated: state.tournament ? state.tournament.eliminated.slice() : null,
    eliminationGame: state.tournament && state.tournament.eliminationGame ? state.tournament.eliminationGame.slice() : null,
    grids: state.grids.map(g => g.map(c => ({ ...c }))),
    cancelled: state.cancelled ? state.cancelled.map(a => a.slice()) : null,
    numPlayers: state.numPlayers,
    humanIndex: state.humanIndex,
    tournamentWinner: null,
    tournamentComplete: false
  };

  if (mode === 'tournament' && state.tournament) {
    const under100 = [];
    for (let p = 0; p < state.numPlayers; p++) {
      if (state.tournament.cumulative[p] < 100) under100.push(p);
    }
    if (under100.length === 1) {
      snapshot.tournamentWinner = under100[0];
      snapshot.tournamentComplete = true;
    } else if (under100.length === 0) {
      let w = 0, best = state.tournament.cumulative[0];
      for (let p = 1; p < state.numPlayers; p++) {
        if (state.tournament.cumulative[p] < best) {
          best = state.tournament.cumulative[p];
          w = p;
        }
      }
      snapshot.tournamentWinner = w;
      snapshot.tournamentComplete = true;
    }
  }

  if (mode !== 'tournament' && state.scores) {
    // Best result in this mode = lowest score by anyone (player or AI)
    let best = Infinity, bestCards = Infinity, winIdx = 0;
    state.scores.forEach(function (s, i) {
      if (s.score < best || (s.score === best && s.cards < bestCards)) {
        best = s.score; bestCards = s.cards; winIdx = i;
      }
    });
    snapshot.winner = winIdx;
    const prev = stats.best[mode];
    if (!prev || best < prev.score || (best === prev.score && bestCards <= (prev.cards != null ? prev.cards : 99))) {
      stats.best[mode] = {
        score: best,
        cards: bestCards,
        winner: winIdx,
        snapshot: snapshot
      };
    }
  }

  // Best tournament: final cumulative + all games for viewing
  if (mode === 'tournament' && snapshot.tournamentComplete && snapshot.tournamentWinner != null) {
    const cum = state.tournament.cumulative[snapshot.tournamentWinner];
    const prev = stats.best.tournament;
    if (!prev || cum <= prev.score) {
      // include current snapshot in games list
      let tgames = (stats.lastGames || []).slice();
      const gnum = state.tournament.gameNumber;
      const tid = state.tournament.id;
      snapshot.tournamentGameNumber = gnum;
      snapshot.tournamentId = tid;
      const ex = tgames.findIndex(g => g.tournamentGameNumber === gnum && g.tournamentId === tid);
      if (ex >= 0) tgames[ex] = snapshot; else tgames = tgames.concat([snapshot]);
      stats.best.tournament = {
        score: cum,
        winner: snapshot.tournamentWinner,
        snapshot: snapshot,
        tournamentGames: tgames
      };
    }
  }

  if (mode === 'tournament' && state.tournament) {
    const tid = state.tournament.id;
    if (stats.currentTournamentId !== tid) {
      stats.currentTournamentId = tid;
      stats.lastGames = [];
    }
    const gnum = state.tournament.gameNumber;
    snapshot.tournamentGameNumber = gnum;
    snapshot.tournamentId = tid;
    const existing = stats.lastGames.findIndex(g => g.tournamentGameNumber === gnum && g.tournamentId === tid);
    if (existing >= 0) stats.lastGames[existing] = snapshot;
    else stats.lastGames.push(snapshot);
  } else {
    stats.currentTournamentId = null;
    stats.lastGames = [snapshot];
  }
  saveStats(stats);
}

function logFinalStandings() {
  // Newest-first: summary first, then worse ranks, winner last → winner on top
  logMsg('gameSummary');
  const places = getPlacementMap();
  const n = state.numPlayers;
  const rows = [];
  for (let p = 0; p < n; p++) {
    const sc = state.scores[p].score;
    rows.push({ p: p, place: places[p] || 99, score: sc });
  }
  rows.sort(function (a, b) { return b.place - a.place; }); // worst first for unshift
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    if (r.place === 1) {
      logMsg(isBestRecord(r.p) ? 'finalWinnerBest' : 'finalWinner', [playerName(r.p), r.score]);
    } else {
      logMsg('finalRank', [playerName(r.p), r.score, r.place]);
    }
  }
}

function finishGame() {
  state.scores = [];
  state.cancelled = [];
  state.grids.forEach((g, pi) => {
    g.forEach(c => { if (c.value != null) c.faceUp = true; });
    const a = analyzeGrid(g);
    state.scores.push({ score: a.score, cards: a.cards });
    state.cancelled.push(a.cancelled);
  });

  if (state.mode === 'tournament' && state.tournament) {
    const finishedGameNum = state.tournament.gameNumber;

    // Who was still in at the START of this game
    const playedMask = state.tournament.eliminated.map(function (e) { return !e; });

    // Zero scores for already-eliminated (they did not play)
    for (let p = 0; p < state.numPlayers; p++) {
      if (!playedMask[p]) {
        state.scores[p] = { score: 0, cards: 0 };
        if (state.cancelled) state.cancelled[p] = Array(16).fill(false);
      }
    }

    // Add scores only for those who played
    for (let p = 0; p < state.numPlayers; p++) {
      if (playedMask[p]) {
        state.tournament.cumulative[p] += state.scores[p].score;
      }
    }

    // Subtotal only for players who played this game
    logTournamentSubtotal(finishedGameNum, playedMask);

    // Eliminate anyone who reached >= 100 this game
    for (let p = 0; p < state.numPlayers; p++) {
      if (playedMask[p] && state.tournament.cumulative[p] >= 100) {
        state.tournament.eliminated[p] = true;
        state.tournament.eliminationGame[p] = finishedGameNum;
        logMsg('tournamentEliminated', [playerName(p), state.tournament.cumulative[p]]);
      }
    }

    const under100 = [];
    for (let p = 0; p < state.numPlayers; p++) {
      if (state.tournament.cumulative[p] < 100) under100.push(p);
    }

    function logTournamentStandings(winnerIdx) {
      // Newest-first log: summary first, then last places, winner last → winner on top
      logMsg('tournamentSummary');
      const order = [];
      for (let p = 0; p < state.numPlayers; p++) order.push(p);
      order.sort(function (a, b) {
        return state.tournament.cumulative[b] - state.tournament.cumulative[a];
      });
      for (let i = 0; i < order.length; i++) {
        const p = order[i];
        if (p === winnerIdx) continue;
        logMsg('tournamentRank', [playerName(p), state.tournament.cumulative[p]]);
      }
      logMsg(isBestRecord(winnerIdx) ? 'tournamentWinnerBest' : 'tournamentWinner',
        [playerName(winnerIdx), state.tournament.cumulative[winnerIdx]]);
    }

    if (under100.length === 1) {
      state.phase = 'end';
      const winnerIdx = under100[0];
      for (let p = 0; p < state.numPlayers; p++) {
        state.tournament.eliminated[p] = (p !== winnerIdx);
      }
      recordStats();
      logTournamentStandings(winnerIdx);
      setMsg(isBestRecord(winnerIdx) ? 'tournamentWinnerBest' : 'tournamentWinner',
        [playerName(winnerIdx), state.tournament.cumulative[winnerIdx]]);
      activeTab = winnerIdx;
      renderAll();
      return;
    }

    if (under100.length === 0) {
      state.phase = 'end';
      let winnerIdx = 0;
      let best = state.tournament.cumulative[0];
      for (let p = 1; p < state.numPlayers; p++) {
        if (state.tournament.cumulative[p] < best) {
          best = state.tournament.cumulative[p];
          winnerIdx = p;
        }
      }
      for (let p = 0; p < state.numPlayers; p++) {
        state.tournament.eliminated[p] = (p !== winnerIdx);
      }
      recordStats();
      logTournamentStandings(winnerIdx);
      setMsg(isBestRecord(winnerIdx) ? 'tournamentWinnerBest' : 'tournamentWinner',
        [playerName(winnerIdx), state.tournament.cumulative[winnerIdx]]);
      activeTab = winnerIdx;
      renderAll();
      return;
    }

    // 2+ still under 100 → next game
    logMsg('tournamentNext', [finishedGameNum + 1]);
    recordStats();
    startNextTournamentGame();
    return;
  }

  state.phase = 'end';
  logMsg('gameEnded');
  recordStats();
  logFinalStandings();
  setMsg('gameEnded');
  activeTab = state.humanIndex;
  renderAll();
}

function setMsg(key, args) {
  currentMsgKey = key;
  currentMsgArgs = args || [];
  document.getElementById('msgBar').textContent = key ? formatMsg(key, currentMsgArgs) : '';
}

function updateStatusUI() {
  if (!state) return;
  document.getElementById('roundBadge').textContent = t('round') + ' ' + state.round + '/16';
  const phaseMap = {
    select: t('phaseSelect'), market: t('phaseMarket'),
    slide: t('phaseSlide'), end: t('phaseEnd'), view: t('phaseView')
  };
  document.getElementById('phaseBadge').textContent = phaseMap[state.phase] || state.phase;
  const tb = document.getElementById('tourBadge');
  if (state.tournament) {
    tb.style.display = '';
    tb.textContent = t('game') + ' ' + state.tournament.gameNumber;
  } else {
    tb.style.display = 'none';
  }
}

function getWinners() {
  if (!state || (state.phase !== 'end' && state.phase !== 'view') || !state.scores) return new Set();
  if (state.mode === 'tournament' && state.tournament) {
    const alive = state.tournament.eliminated.map((e, i) => !e ? i : -1).filter(i => i >= 0);
    if (alive.length === 1) return new Set(alive);
    return new Set();
  }
  let best = Infinity, bestCards = Infinity;
  state.scores.forEach(s => {
    if (s.score < best || (s.score === best && s.cards < bestCards)) {
      best = s.score; bestCards = s.cards;
    }
  });
  const winners = new Set();
  state.scores.forEach((s, i) => {
    if (s.score === best && s.cards === bestCards) winners.add(i);
  });
  return winners;
}

function getPlacementMap() {
  // Returns { playerIndex: place } — 1 = best
  if (!state) return {};
  const n = state.numPlayers;
  const places = {};
  if (state.mode === 'tournament' && state.tournament) {
    const winners = getWinners();
    const rows = [];
    for (let p = 0; p < n; p++) {
      let gamesPlayed;
      if (viewSession && viewSession.games && viewSession.games.length) {
        gamesPlayed = 0;
        viewSession.games.forEach(function (g, gi) {
          if (playerPlayedInGame(g, gi, p, viewSession.games)) gamesPlayed++;
        });
      } else if (state.tournament.eliminationGame && state.tournament.eliminationGame[p] != null) {
        gamesPlayed = state.tournament.eliminationGame[p];
      } else if (!state.tournament.eliminated[p] || winners.has(p)) {
        gamesPlayed = state.tournament.gameNumber || 99;
      } else {
        gamesPlayed = 0;
      }
      rows.push({
        p: p,
        isWinner: winners.has(p),
        gamesPlayed: gamesPlayed,
        score: state.tournament.cumulative[p]
      });
    }
    rows.sort(function (a, b) {
      if (a.isWinner !== b.isWinner) return a.isWinner ? -1 : 1;
      if (a.gamesPlayed !== b.gamesPlayed) return b.gamesPlayed - a.gamesPlayed;
      return a.score - b.score;
    });
    rows.forEach(function (r, i) { places[r.p] = i + 1; });
    return places;
  }
  // Single game: lowest score, then fewer remaining cards
  if (state.scores) {
    const rows = [];
    for (let p = 0; p < n; p++) {
      rows.push({ p: p, score: state.scores[p].score, cards: state.scores[p].cards });
    }
    rows.sort(function (a, b) {
      if (a.score !== b.score) return a.score - b.score;
      return a.cards - b.cards;
    });
    rows.forEach(function (r, i) { places[r.p] = i + 1; });
  }
  return places;
}

function isBestRecord(p) {
  try {
    const stats = loadStats();
    if (state.mode === 'tournament' && state.tournament) {
      const b = stats.best.tournament;
      if (!b) return false;
      return b.winner === p && b.score === state.tournament.cumulative[p];
    }
    const b = stats.best[state.mode];
    if (!b || !state.scores) return false;
    return b.winner === p && b.score === state.scores[p].score;
  } catch (e) { return false; }
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  if (!state) { tabs.innerHTML = ''; return; }
  const winners = getWinners();
  let order = [];
  if (state.mode === 'solo' || state.numPlayers === 1) {
    order = [0];
  } else if (state.phase === 'market' || state.phase === 'slide') {
    for (let k = 0; k < state.numPlayers; k++) {
      order.push((state.firstPlayer + k) % state.numPlayers);
    }
  } else {
    for (let i = 0; i < state.numPlayers; i++) order.push(i);
  }

  let html = '';
  for (const p of order) {
    let name = playerName(p);
    // Only square-bracket scores on tabs (no place numbers — too tight on mobile)
    if (state.tournament) {
      name += ' [' + state.tournament.cumulative[p] + ']';
    } else if ((state.phase === 'end' || state.phase === 'view') && state.scores) {
      name += ' [' + state.scores[p].score + ']';
    }
    if (winners.has(p)) name = '🏆 ' + name;
    const elim = isEliminated(p);
    const isCurrentPick = state.phase === 'market' && state.currentPicker === p && !elim;
    const cls = 'tab'
      + (p === activeTab ? ' active' : '')
      + (p === state.humanIndex ? ' you' : '')
      + (winners.has(p) ? ' winner-tab' : '')
      + (isCurrentPick ? ' current-pick' : '')
      + (elim ? ' disabled-tab' : '');
    html += '<button class="' + cls + '" data-tab="' + p + '">' + name + '</button>';
  }
  tabs.innerHTML = html;
  // Eliminated players stay visible (no strikethrough); tabs always clickable to view boards
  tabs.querySelectorAll('.tab').forEach(btn => {
    btn.onclick = () => {
      activeTab = +btn.dataset.tab;
      renderBoard();
      renderTabs();
      if (viewOnly) renderViewGameSwitcher();
    };
  });
}

function renderBoard() {
  if (!state) return;
  const p = activeTab;
  const cells = state.grids[p];
  const isHuman = p === state.humanIndex;
  const empty = (state.phase === 'slide' && isHuman && state.emptyPos && !viewOnly) ? state.emptyPos
              : (state.phase !== 'select' && state.phase !== 'end' && state.phase !== 'view' ? getEmptyPos(cells) : null);
  const cancelled = ((state.phase === 'end' || state.phase === 'view') && state.cancelled) ? state.cancelled[p] : null;

  const rev = document.getElementById('revealedRow');
  rev.innerHTML = '';
  if (isHuman && state.market && state.market.length && state.phase !== 'end' && state.phase !== 'view') {
    state.market.forEach((val, mi) => {
      const d = document.createElement('div');
      d.className = 'card';
      d.style.backgroundImage = 'url(' + CARD_IMAGES[val] + ')';
      if (!viewOnly && state.phase === 'market' && (state.mode === 'solo' || state.currentPicker === state.humanIndex)) {
        d.classList.add('selectable');
        d.onclick = () => humanTakeFromMarket(mi);
      }
      rev.appendChild(d);
    });
  } else if (isHuman && state.pendingCard != null) {
    const d = document.createElement('div');
    d.className = 'card selected';
    d.style.backgroundImage = 'url(' + CARD_IMAGES[state.pendingCard] + ')';
    rev.appendChild(d);
  }

  const wrap = document.getElementById('gridWrap');
  wrap.innerHTML = '';
  const edges = (state.phase === 'slide' && isHuman && empty && !viewOnly)
    ? possibleEdges(empty.r, empty.c) : [];
  const edgeMap = {};
  edges.forEach(e => { edgeMap[e.side] = e; });

  function makeEdge(side, rowOrCol, active) {
    const btn = document.createElement('button');
    btn.className = 'edge' + (active ? ' active' : '');
    if (side === 'T') {
      btn.style.gridRow = '1'; btn.style.gridColumn = String(rowOrCol + 2);
      btn.textContent = active ? '▼' : '';
    } else if (side === 'B') {
      btn.style.gridRow = '6'; btn.style.gridColumn = String(rowOrCol + 2);
      btn.textContent = active ? '▲' : '';
    } else if (side === 'L') {
      btn.style.gridColumn = '1'; btn.style.gridRow = String(rowOrCol + 2);
      btn.textContent = active ? '▶' : '';
    } else {
      btn.style.gridColumn = '6'; btn.style.gridRow = String(rowOrCol + 2);
      btn.textContent = active ? '◀' : '';
    }
    if (active) btn.onclick = () => humanDoSlide(side);
    return btn;
  }

  [[1,1],[1,6],[6,1],[6,6]].forEach(([r,c]) => {
    const d = document.createElement('div');
    d.className = 'corner';
    d.style.gridRow = r; d.style.gridColumn = c;
    wrap.appendChild(d);
  });
  for (let c = 0; c < 4; c++) {
    wrap.appendChild(makeEdge('T', c, !!(edgeMap.T && empty && empty.c === c)));
    wrap.appendChild(makeEdge('B', c, !!(edgeMap.B && empty && empty.c === c)));
  }
  for (let r = 0; r < 4; r++) {
    wrap.appendChild(makeEdge('L', r, !!(edgeMap.L && empty && empty.r === r)));
    wrap.appendChild(makeEdge('R', r, !!(edgeMap.R && empty && empty.r === r)));
  }

  for (let i = 0; i < 16; i++) {
    const r = Math.floor(i/4), c = i % 4;
    const cell = cells[i];
    const div = document.createElement('div');
    div.className = 'card';
    div.style.gridRow = String(r + 2);
    div.style.gridColumn = String(c + 2);
    if (cell.value == null) {
      div.classList.add('empty');
    } else if (!cell.faceUp) {
      div.classList.add('face-down');
      div.style.backgroundImage = 'url(' + CARD_IMAGES.back + ')';
      if (!viewOnly && isHuman && state.phase === 'select' && !isEliminated(p)) {
        div.onclick = () => humanSelectCard(r, c);
      }
    } else {
      div.style.backgroundImage = 'url(' + CARD_IMAGES[cell.value] + ')';
      if (cancelled && cancelled[i]) div.classList.add('cancelled');
    }
    if (state.selectedPos && state.selectedPos.r === r && state.selectedPos.c === c && isHuman) {
      div.classList.add('selected');
    }
    wrap.appendChild(div);
  }
}

function renderAll() {
  if (!state) return;
  updateStatusUI();
  renderTabs();
  renderBoard();
  refreshLogView();
  if (!viewOnly) {
    const el = document.getElementById('viewGameSwitcher');
    if (el) { el.style.display = 'none'; el.innerHTML = ''; }
  } else {
    renderViewGameSwitcher();
  }
}

function saveGame() {
  if (!state || viewOnly) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      state, activeTab, lang, selectedMode, currentMsgKey, currentMsgArgs
    }));
    setMsg('saved');
    logMsg('saved');
  } catch (e) { setMsg('saved'); }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) { setMsg('noSave'); return; }
    const data = JSON.parse(raw);
    state = data.state;
    activeTab = data.activeTab || 0;
    if (data.lang) lang = data.lang;
    if (data.selectedMode) selectedMode = data.selectedMode;
    currentMsgKey = data.currentMsgKey || null;
    currentMsgArgs = data.currentMsgArgs || [];
    viewOnly = false;
    viewSession = null;
    document.getElementById('btnMode').textContent = MODE_LABEL[selectedMode] || '4';
    // Keep tournament stats continuity after load
    if (state.tournament && state.tournament.id) {
      try {
        const st = loadStats();
        st.currentTournamentId = state.tournament.id;
        saveStats(st);
      } catch (e) {}
    }
    applyI18n();
    logMsg('loaded');
    setMsg('loaded');
    renderViewGameSwitcher();
    renderAll();
    if (state.phase === 'market' && state.mode !== 'solo' && state.currentPicker !== state.humanIndex) {
      beginMarketPick();
    }
  } catch (e) { setMsg('noSave'); }
}

function viewSnapshot(snap, allGames) {
  viewOnly = true;
  if (allGames && allGames.length > 1) {
    let idx = allGames.findIndex(g => g === snap);
    if (idx < 0 && snap.tournamentGameNumber != null) {
      idx = allGames.findIndex(g => g.tournamentGameNumber === snap.tournamentGameNumber);
    }
    if (idx < 0) idx = allGames.length - 1;
    viewSession = { games: allGames, gameIndex: idx };
    applyViewGame(idx);
  } else if (allGames && allGames.length === 1) {
    viewSession = { games: allGames, gameIndex: 0 };
    applyViewGame(0);
  } else {
    viewSession = null;
    applyViewSnap(snap);
  }
  document.getElementById('statsOverlay').classList.remove('show');
}

function applyViewSnap(snap) {
  state = {
    mode: snap.mode,
    numPlayers: snap.numPlayers,
    humanIndex: snap.humanIndex,
    round: 16,
    firstPlayer: 0,
    phase: 'view',
    currentPicker: 0,
    grids: snap.grids.map(g => g.map(c => ({ ...c }))),
    market: [],
    deck: [],
    selectedPos: null,
    pendingCard: null,
    emptyPos: null,
    scores: snap.scores ? snap.scores.map(s => ({ ...s })) : null,
    cancelled: snap.cancelled ? snap.cancelled.map(a => a.slice()) : null,
    log: state && state.log ? state.log : [],
    tournament: snap.cumulative ? {
      id: snap.tournamentId || (state && state.tournament && state.tournament.id) || 0,
      cumulative: snap.cumulative.slice(),
      eliminated: (snap.eliminated || snap.cumulative.map(() => false)).slice(),
      eliminationGame: snap.eliminationGame ? snap.eliminationGame.slice() : Array(snap.numPlayers || 4).fill(null),
      gameNumber: snap.tournamentGameNumber || 1
    } : null
  };
  activeTab = snap.humanIndex || 0;
  setMsg('phaseView');
  currentMsgKey = 'phaseView';
  renderViewGameSwitcher();
  renderAll();
}

function applyViewGame(idx) {
  if (!viewSession || !viewSession.games[idx]) return;
  viewSession.gameIndex = idx;
  applyViewSnap(viewSession.games[idx]);
}

function playerPlayedInGame(g, gi, playerIdx, allGames) {
  if (g.played) return !!g.played[playerIdx];
  if (gi > 0 && allGames[gi - 1].eliminated && allGames[gi - 1].eliminated[playerIdx]) return false;
  return true;
}

function renderViewGameSwitcher() {
  const el = document.getElementById('viewGameSwitcher');
  if (!el) return;
  if (!viewOnly || !viewSession || viewSession.games.length < 2) {
    el.style.display = 'none';
    el.innerHTML = '';
    return;
  }
  const p = activeTab;
  const games = viewSession.games;
  // Only games this player participated in (up to elimination)
  const allowed = [];
  for (let i = 0; i < games.length; i++) {
    if (playerPlayedInGame(games[i], i, p, games)) allowed.push(i);
  }
  if (allowed.length === 0) {
    el.style.display = 'none';
    el.innerHTML = '';
    return;
  }
  // If current view game is not allowed for this tab, jump to last allowed
  if (allowed.indexOf(viewSession.gameIndex) < 0) {
    applyViewGame(allowed[allowed.length - 1]);
    return;
  }
  el.style.display = 'flex';
  let html = '';
  allowed.forEach(function (i) {
    const g = games[i];
    const num = g.tournamentGameNumber || (i + 1);
    const active = i === viewSession.gameIndex;
    html += '<button class="icon-btn" style="width:auto;min-width:32px;padding:0 8px;font-size:0.75rem;' +
      (active ? 'background:var(--accent);border-color:#f8b4c4;color:#fff;' : '') +
      '" data-vg="' + i + '">' + t('viewGameNum') + ' ' + num + '</button>';
  });
  el.innerHTML = html;
  el.querySelectorAll('[data-vg]').forEach(btn => {
    btn.onclick = () => applyViewGame(+btn.dataset.vg);
  });
}

function clearAllStats() {
  try {
    localStorage.removeItem(STATS_KEY);
  } catch (e) {}
  setMsg('statsCleared');
  renderStats();
}

function computePlacesFromGames(games, n) {
  const last = games[games.length - 1];
  if (!last || !last.cumulative) return {};
  const rows = [];
  for (let p = 0; p < n; p++) {
    let gamesPlayed = 0;
    games.forEach(function (g, gi) {
      let played = true;
      if (g.played) played = !!g.played[p];
      else if (gi > 0 && games[gi - 1].eliminated && games[gi - 1].eliminated[p]) played = false;
      if (played) gamesPlayed++;
    });
    const isWinner = last.tournamentWinner === p || (last.eliminated && !last.eliminated[p] && last.tournamentComplete);
    rows.push({ p: p, isWinner: !!isWinner, gamesPlayed: gamesPlayed, score: last.cumulative[p] });
  }
  // Fix winner: lowest score among non-eliminated at end, or tournamentWinner
  if (last.tournamentWinner != null) {
    rows.forEach(function (r) { r.isWinner = (r.p === last.tournamentWinner); });
  } else {
    let best = Infinity, bestP = 0;
    rows.forEach(function (r) {
      if (r.score < best) { best = r.score; bestP = r.p; }
    });
    rows.forEach(function (r) { r.isWinner = (r.p === bestP); });
  }
  rows.sort(function (a, b) {
    if (a.isWinner !== b.isWinner) return a.isWinner ? -1 : 1;
    if (a.gamesPlayed !== b.gamesPlayed) return b.gamesPlayed - a.gamesPlayed;
    return a.score - b.score;
  });
  const places = {};
  rows.forEach(function (r, i) { places[r.p] = i + 1; });
  return places;
}

function renderStats() {
  const stats = loadStats();
  const box = document.getElementById('statsContent');
  let html = '';

  html += '<div class="stats-section"><h3>' + t('bestResults') + '</h3>';
  html += '<table class="stats-table"><tr><th>' + t('mode') + '</th><th>' + t('score') + '</th><th>' + t('winner') + '</th></tr>';
  const modes = ['solo', 'ai2', 'ai3', 'ai4', 'tournament'];
  let anyBest = false;
  modes.forEach(m => {
    const b = stats.best[m];
    if (!b) return;
    anyBest = true;
    const wName = (b.winner === 0) ? '👤' : ('🖥️' + (b.winner || 0));
    const canView = !!(b.snapshot || (b.tournamentGames && b.tournamentGames.length));
    html += '<tr class="' + (canView ? 'clickable' : '') + '" data-best="' + m + '"><td>' +
      (MODE_LABEL[m] || m) + '</td><td>' + b.score + '</td><td>' + wName + '</td></tr>';
  });
  if (!anyBest) html += '<tr><td colspan="3">' + t('noStats') + '</td></tr>';
  html += '</table></div>';

  html += '<div class="stats-section"><h3>' + t('lastGames') + '</h3>';
  if (!stats.lastGames || !stats.lastGames.length) {
    html += '<p style="color:var(--muted)">' + t('noStats') + '</p>';
  } else {
    const games = stats.lastGames;
    const isT = games[0].mode === 'tournament';
    const n = games[0].numPlayers || 4;
    const hi = games[0].humanIndex || 0;

    html += '<table class="stats-table"><tr><th>' + t('mode') + '</th>';
    for (let p = 0; p < n; p++) {
      const nm = p === hi ? '👤' : ('🖥️' + (p + 1));
      html += '<th' + (isT ? ' style="text-align:right"' : '') + '>' + nm + '</th>';
    }
    html += '</tr>';

    if (isT) {
      html += '<tr class="clickable" data-last="1">';
      html += '<td style="vertical-align:top">T';
      games.forEach(g => {
        html += '<div style="line-height:1.3;color:var(--muted);font-size:0.75rem">#' + (g.tournamentGameNumber || '?') + '</div>';
      });
      html += '</td>';
      for (let p = 0; p < n; p++) {
        html += '<td style="vertical-align:top;text-align:right">';
        let lastCum = null;
        games.forEach(function (g, gi) {
          let played = true;
          if (g.played) played = !!g.played[p];
          else if (gi > 0 && games[gi - 1].eliminated && games[gi - 1].eliminated[p]) played = false;
          if (!played) {
            html += '<div style="line-height:1.3;color:var(--muted)">---</div>';
            return;
          }
          const sc = (g.scores && g.scores[p]) ? g.scores[p].score : '—';
          html += '<div style="line-height:1.3">+' + sc + '</div>';
          if (g.cumulative) lastCum = g.cumulative[p];
        });
        const last = games[games.length - 1];
        const cum = (lastCum != null) ? lastCum : (last.cumulative ? last.cumulative[p] : '—');
        if (p === 0) {
          window._statPlaces = computePlacesFromGames(games, n);
        }
        const place = window._statPlaces ? window._statPlaces[p] : null;
        const placeStr = (place && place > 1) ? ' (' + place + ')' : '';
        html += '<div style="line-height:1.3;font-weight:700;margin-top:2px;border-top:1px solid #4a2030;padding-top:2px">' + cum + placeStr + '</div>';
        html += '</td>';
      }
      html += '</tr>';
    } else {
      games.forEach((g, idx) => {
        html += '<tr class="clickable" data-last-idx="' + idx + '">';
        html += '<td>' + (MODE_LABEL[g.mode] || g.mode) + '</td>';
        for (let p = 0; p < n; p++) {
          const sc = (g.scores && g.scores[p]) ? g.scores[p].score : '—';
          html += '<td>' + sc + '</td>';
        }
        html += '</tr>';
      });
    }
    html += '</table>';
  }
  html += '</div>';
  box.innerHTML = html;

  box.querySelectorAll('[data-best]').forEach(tr => {
    tr.onclick = () => {
      const m = tr.dataset.best;
      const b = loadStats().best[m];
      if (!b) return;
      if (b.tournamentGames && b.tournamentGames.length) {
        viewSnapshot(b.tournamentGames[b.tournamentGames.length - 1], b.tournamentGames);
      } else if (b.snapshot) {
        viewSnapshot(b.snapshot);
      }
    };
  });
  box.querySelectorAll('[data-last]').forEach(tr => {
    tr.onclick = () => {
      const games = loadStats().lastGames;
      if (games && games.length) viewSnapshot(games[games.length - 1], games);
    };
  });
  box.querySelectorAll('[data-last-idx]').forEach(tr => {
    tr.onclick = () => {
      const idx = +tr.dataset.lastIdx;
      const snap = loadStats().lastGames[idx];
      if (snap) viewSnapshot(snap);
    };
  });
}

function copyLog() {
  if (!state || !state.log.length) return;
  const text = state.log.map(entry => {
    if (typeof entry === 'string') return entry;
    if (entry.key === 'newGameLog' && entry.args && entry.args[0]) {
      return formatMsg('newGameLog') + ' (' + entry.args[0] + ')';
    }
    return formatMsg(entry.key, entry.args);
  }).join('\n');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => setMsg('copied')).catch(() => fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); setMsg('copied'); } catch (e) {}
  document.body.removeChild(ta);
}

document.getElementById('btnNew').onclick = () => {
  showConfirm(t('confirmNew'), () => newGame(selectedMode));
};
document.getElementById('btnMode').onclick = () => cycleMode();
document.getElementById('btnSave').onclick = saveGame;
document.getElementById('btnLoad').onclick = loadGame;
document.getElementById('btnLog').onclick = () => {
  document.getElementById('logTitleLabel').textContent = t('logTitle');
  refreshLogView();
  document.getElementById('logOverlay').classList.add('show');
};
document.getElementById('closeLog').onclick = () => document.getElementById('logOverlay').classList.remove('show');
document.getElementById('btnCopyLog').onclick = copyLog;
document.getElementById('btnStats').onclick = () => {
  document.getElementById('statsTitleLabel').textContent = t('statsTitle');

  document.getElementById('statsOverlay').classList.add('show');
};
document.getElementById('closeStats').onclick = () => document.getElementById('statsOverlay').classList.remove('show');
document.getElementById('btnClearStats').onclick = () => {
  showConfirm(t('confirmClearStats'), () => clearAllStats());
};
document.getElementById('btnHelp').onclick = () => {
  document.getElementById('helpContent').innerHTML = t('helpHtml');
  document.getElementById('helpTitleLabel').textContent = t('helpTitle');
  document.getElementById('helpOverlay').classList.add('show');
};
document.getElementById('closeHelp').onclick = () => document.getElementById('helpOverlay').classList.remove('show');
document.getElementById('btnLang').onclick = () => {
  lang = lang === 'cs' ? 'en' : 'cs';
  applyI18n();
};

let confirmCb = null;
function showConfirm(msg, cb) {
  document.getElementById('confirmTitle').textContent = '⟳';
  document.getElementById('confirmMsg').textContent = msg;
  document.getElementById('confirmNo').textContent = t('cancel');
  document.getElementById('confirmYes').textContent = t('yes');
  confirmCb = cb;
  document.getElementById('confirmOverlay').classList.add('show');
}
document.getElementById('confirmYes').onclick = () => {
  document.getElementById('confirmOverlay').classList.remove('show');
  if (confirmCb) confirmCb(); confirmCb = null;
};
document.getElementById('confirmNo').onclick = () => {
  document.getElementById('confirmOverlay').classList.remove('show'); confirmCb = null;
};
document.getElementById('confirmCloseX').onclick = () => {
  document.getElementById('confirmOverlay').classList.remove('show'); confirmCb = null;
};

['logOverlay','helpOverlay','confirmOverlay','statsOverlay'].forEach(id => {
  document.getElementById(id).addEventListener('click', e => {
    if (e.target.id === id) {
      e.target.classList.remove('show');
      if (id === 'confirmOverlay') confirmCb = null;
    }
  });
});

applyI18n();
newGame('ai4');
